<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本对比工具</title>
    <link rel="stylesheet" href="../assets/common.css">
    <style>
        .editors { display: flex; gap: 16px; }
        .editors .panel { flex: 1; min-width: 0; margin-bottom: 0; }
        .editors .editor-wrap { height: 240px; }

        .diff-wrap {
            border: 1px solid #dde1e6;
            border-radius: 8px;
            background: #fafbfc;
            height: 420px;
            overflow: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            line-height: 20.8px;
        }

        /* ---- 统一视图 ---- */
        .diff-row { display: flex; white-space: pre; }
        .diff-row .ln {
            width: 44px; flex-shrink: 0; text-align: right; padding-right: 10px;
            color: #aaa; user-select: none; background: #f0f2f5;
            border-right: 1px solid #dde1e6;
        }
        .diff-row .sign {
            width: 22px; flex-shrink: 0; text-align: center;
            user-select: none; color: #999;
        }
        .diff-row .code { flex: 1; padding-right: 12px; }
        .diff-row.del { background: #ffeef0; }
        .diff-row.del .sign, .diff-row.del .code { color: #c62828; }
        .diff-row.add { background: #e8f5e9; }
        .diff-row.add .sign, .diff-row.add .code { color: #2e7d32; }

        /* ---- 并排视图（IDEA 风格） ---- */
        .sd-row { display: flex; white-space: pre; }
        .sd-row .ln {
            width: 40px; flex-shrink: 0; text-align: right; padding-right: 8px;
            color: #aaa; user-select: none; background: #f0f2f5;
            border-right: 1px solid #dde1e6;
        }
        .sd-row .cell { flex: 1; min-width: 0; overflow: hidden; padding-right: 8px; }
        .sd-row .gutter {
            width: 16px; flex-shrink: 0; background: #f7f8fa;
            border-left: 1px solid #e4e7ea; border-right: 1px solid #e4e7ea;
            display: flex; align-items: center; justify-content: center;
        }
        .sd-row.change .gutter::after { content: '⇄'; font-size: 9px; color: #fff; }
        .sd-row .cell.l:empty, .sd-row .cell.r:empty { background: #f4f5f7; }
        .sd-row.same .cell { color: #333; }
        .sd-row.change .cell.l { background: #ffeef0; color: #c62828; }
        .sd-row.change .cell.r { background: #e8f5e9; color: #2e7d32; }
        .sd-row.del .cell.l { background: #ffeef0; color: #c62828; }
        .sd-row.del .gutter { background: rgba(229, 57, 53, 0.35); }
        .sd-row.add .cell.r { background: #e8f5e9; color: #2e7d32; }
        .sd-row.add .gutter { background: rgba(67, 160, 71, 0.4); }
        .sd-row.change .gutter { background: linear-gradient(to right, rgba(229,57,53,0.35), rgba(67,160,71,0.4)); }
        .sd-row.change:hover .cell.l { background: #fddde1; }
        .sd-row.change:hover .cell.r { background: #d2ecd4; }
        .sd-row.del:hover .cell.l { background: #fddde1; }
        .sd-row.add:hover .cell.r { background: #d2ecd4; }
        .sd-row.fold .cell { background: #f0f4f8; color: #999; cursor: pointer; text-align: center; user-select: none; }
        .sd-row.fold .cell:hover { background: #e3f2fd; color: #1565c0; }

        .part-del { background: rgba(229, 57, 53, 0.25); border-radius: 2px; }
        .part-add { background: rgba(67, 160, 71, 0.28); border-radius: 2px; }

        .diff-row.paired.del { box-shadow: inset 2px 0 0 #ef9a9a; }
        .diff-row.paired.add { box-shadow: inset 2px 0 0 #a5d6a7; }

        .legend {
            display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
            font-size: 12px; color: #888; margin-bottom: 8px;
        }
        .legend .sw {
            display: inline-block; width: 12px; height: 12px; border-radius: 3px;
            border: 1px solid #dde1e6; margin-right: 5px; vertical-align: -1px;
        }

        .options-row {
            display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
        }
        .options-row label {
            display: flex; gap: 6px; align-items: center;
            font-size: 13px; color: #666; cursor: pointer;
        }
        .options-row input[type="checkbox"] { accent-color: #4a9eff; }

        .view-toggle {
            display: inline-flex;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }
        .view-toggle button {
            border: none;
            border-radius: 0;
            padding: 4px 12px;
            font-size: 12px;
            background: #fff;
            color: #666;
        }
        .view-toggle button.active { background: #4a9eff; color: #fff; }

        @media (max-width: 720px) { .editors { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>文本对比工具</h1>
        <p class="subtitle">并排 / 统一双视图 · 行内字符级高亮 · 实时刷新</p>

        <div class="editors">
            <div class="panel">
                <div class="panel-header">
                    <h3>原文</h3>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <span class="badge badge-info" id="sizeBadgeA"></span>
                        <button class="btn-outline btn-sm" onclick="$('fileA').click()">导入文件</button>
                    </div>
                </div>
                <div class="editor-wrap">
                    <div class="line-numbers" id="linesA"><div>1</div></div>
                    <textarea id="inputA" placeholder="粘贴原文，或直接导入文件..."></textarea>
                </div>
                <input type="file" id="fileA" style="display:none" onchange="loadFile(this, 'inputA', 'linesA', 'sizeBadgeA')">
            </div>
            <div class="panel">
                <div class="panel-header">
                    <h3>新文本</h3>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <span class="badge badge-info" id="sizeBadgeB"></span>
                        <button class="btn-outline btn-sm" onclick="$('fileB').click()">导入文件</button>
                    </div>
                </div>
                <div class="editor-wrap">
                    <div class="line-numbers" id="linesB"><div>1</div></div>
                    <textarea id="inputB" placeholder="粘贴修改后的文本，或直接导入文件..."></textarea>
                </div>
                <input type="file" id="fileB" style="display:none" onchange="loadFile(this, 'inputB', 'linesB', 'sizeBadgeB')">
            </div>
        </div>

        <div class="btn-row">
            <div class="view-toggle">
                <button id="btnSideView" class="active" onclick="switchView('side')">并排视图</button>
                <button id="btnUnifiedView" onclick="switchView('unified')">统一视图</button>
            </div>
            <button class="btn-primary" onclick="doDiff()">对比</button>
            <button class="btn-outline btn-sm" onclick="swapSides()">交换左右</button>
            <button class="btn-outline btn-sm" onclick="navChange(-1)">↑ 上一处</button>
            <button class="btn-outline btn-sm" onclick="navChange(1)">↓ 下一处</button>
            <button class="btn-success" onclick="copyDiff()">复制差异文本</button>
            <button class="btn-danger btn-sm" onclick="clearAll()">清空</button>
            <span class="badge" id="navBadge" style="align-self:center;"></span>
            <span class="badge" id="diffBadge" style="align-self:center;"></span>
        </div>

        <div class="options-row" style="margin-bottom:16px;">
            <label><input type="checkbox" id="ignoreWs" onchange="doDiff()"> 忽略行首尾空白</label>
            <label><input type="checkbox" id="ignoreCase" onchange="doDiff()"> 忽略大小写</label>
        </div>

        <div class="panel" id="resultPanel" style="display:none;">
            <div class="panel-header">
                <h3>对比结果</h3>
                <span class="badge badge-ok" id="resultBadge"></span>
            </div>
            <div class="legend">
                <span><span class="sw" style="background:#ffeef0"></span>删除的行</span>
                <span><span class="sw" style="background:#e8f5e9"></span>新增的行</span>
                <span><span class="sw" style="background:linear-gradient(to right,#ffeef0,#e8f5e9)"></span>修改的行（同一行左右对应，槽内 ⇄）</span>
                <span><span class="sw" style="background:#f0f4f8"></span>未更改（超长段可折叠）</span>
            </div>
            <div class="diff-wrap" id="diffResult"></div>
        </div>
    </div>
    <div id="toast"></div>
    <script src="../assets/common.js"></script>
    <script>
        var ignoreWs = false, ignoreCase = false;
        var currentView = 'side';
        var lastUnits = [];
        var expandedFolds = {};
        var FOLD_THRESHOLD = 8, FOLD_EDGE = 3;

        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function normLine(s) {
            if (ignoreCase) s = s.toLowerCase();
            if (ignoreWs) s = s.replace(/^\s+|\s+$/g, '');
            return s;
        }

        // ---- 行级 LCS 差异 ----
        function diffLines(a, b) {
            var A = a.split('\n'), B = b.split('\n');
            var pre = 0;
            while (pre < A.length && pre < B.length && normLine(A[pre]) === normLine(B[pre])) pre++;
            var suf = 0;
            while (suf < A.length - pre && suf < B.length - pre && normLine(A[A.length - 1 - suf]) === normLine(B[B.length - 1 - suf])) suf++;

            var midA = A.slice(pre, A.length - suf);
            var midB = B.slice(pre, B.length - suf);
            var n = midA.length, m = midB.length;
            var ops = [];

            var MAX_CELLS = 4000000;
            if (n > 0 && m > 0 && n * m <= MAX_CELLS) {
                var W = m + 1;
                var dp = new Uint32Array((n + 1) * W);
                for (var i = n - 1; i >= 0; i--)
                    for (var j = m - 1; j >= 0; j--)
                        dp[i * W + j] = normLine(midA[i]) === normLine(midB[j])
                            ? dp[(i + 1) * W + j + 1] + 1
                            : Math.max(dp[(i + 1) * W + j], dp[i * W + j + 1]);
                var i = 0, j = 0;
                while (i < n && j < m) {
                    if (normLine(midA[i]) === normLine(midB[j])) { ops.push({ t: 'same', text: midA[i] }); i++; j++; }
                    else if (dp[(i + 1) * W + j] >= dp[i * W + j + 1]) { ops.push({ t: 'del', text: midA[i] }); i++; }
                    else { ops.push({ t: 'add', text: midB[j] }); j++; }
                }
                while (i < n) { ops.push({ t: 'del', text: midA[i] }); i++; }
                while (j < m) { ops.push({ t: 'add', text: midB[j] }); j++; }
            } else {
                for (var k = 0; k < n; k++) ops.push({ t: 'del', text: midA[k] });
                for (var k = 0; k < m; k++) ops.push({ t: 'add', text: midB[k] });
            }

            var seq = [];
            for (var k = 0; k < pre; k++) seq.push({ t: 'same', text: A[k] });
            seq = seq.concat(ops);
            for (var k = 0; k < suf; k++) seq.push({ t: 'same', text: A[A.length - suf + k] });

            var an = 0, bn = 0;
            return seq.map(function (o) {
                if (o.t === 'same') { an++; bn++; return { t: 'same', text: o.text, an: an, bn: bn }; }
                if (o.t === 'del') { an++; return { t: 'del', text: o.text, an: an }; }
                bn++; return { t: 'add', text: o.text, bn: bn };
            });
        }

        // ---- 字符级差异（行内高亮） ----
        function inlineDiff(a, b) {
            var A = Array.from(a), B = Array.from(b);
            var la = A.length, lb = B.length;
            var pre = 0;
            while (pre < la && pre < lb && A[pre] === B[pre]) pre++;
            var suf = 0;
            while (suf < la - pre && suf < lb - pre && A[la - 1 - suf] === B[lb - 1 - suf]) suf++;
            var n = la - pre - suf, m = lb - pre - suf;

            var aChg = new Array(la).fill(false);
            var bChg = new Array(lb).fill(false);
            var MAX_CELLS = 1000000;
            if (n > 0 && m > 0 && n * m <= MAX_CELLS) {
                var W = m + 1;
                var dp = new Uint32Array((n + 1) * W);
                for (var i = n - 1; i >= 0; i--)
                    for (var j = m - 1; j >= 0; j--) {
                        var x = pre + i, y = pre + j;
                        dp[i * W + j] = A[x] === B[y]
                            ? dp[(i + 1) * W + j + 1] + 1
                            : Math.max(dp[(i + 1) * W + j], dp[i * W + j + 1]);
                    }
                var i = 0, j = 0;
                while (i < n && j < m) {
                    var x = pre + i, y = pre + j;
                    if (A[x] === B[y]) { i++; j++; }
                    else if (dp[(i + 1) * W + j] >= dp[i * W + j + 1]) { aChg[x] = true; i++; }
                    else { bChg[y] = true; j++; }
                }
                while (i < n) { aChg[pre + i] = true; i++; }
                while (j < m) { bChg[pre + j] = true; j++; }
            } else {
                for (var k = pre; k < la - suf; k++) aChg[k] = true;
                for (var k = pre; k < lb - suf; k++) bChg[k] = true;
            }

            function build(arr, chg) {
                var segs = [], cur = null;
                for (var k = 0; k < arr.length; k++) {
                    var t = chg[k] ? 'chg' : 'same';
                    if (cur && cur.t === t) cur.text += arr[k];
                    else { cur = { t: t, text: arr[k] }; segs.push(cur); }
                }
                return segs;
            }
            return { a: build(A, aChg), b: build(B, bChg) };
        }

        // ---- 差异单元：same / change(配对) / del / add ----
        function segsHtml(segs, side) {
            return segs.map(function (s) {
                if (s.t === 'same') return esc(s.text);
                return '<span class="part-' + side + '">' + esc(s.text) + '</span>';
            }).join('');
        }

        // 行相似度：公共前后缀长度 / 最大行长（0~1），用于变更块内的智能配对
        function lineSim(a, b) {
            var la = a.length, lb = b.length;
            var m = Math.min(la, lb);
            if (m === 0) return la === lb ? 1 : 0;
            var pre = 0;
            while (pre < m && a[pre] === b[pre]) pre++;
            var suf = 0;
            while (suf < m - pre && a[la - 1 - suf] === b[lb - 1 - suf]) suf++;
            return (pre + suf) / Math.max(la, lb);
        }

        // 变更块内配对：按相似度做不交叉最优配对（DP），避免"aaa 改为 dawdwadawd"式错位
        // 相似度低于阈值的行保持纯删除/纯新增；超大块退化为按位置顺序配对
        function pairBlock(ds, as) {
            var n = ds.length, m = as.length;
            var TH = 500; // 相似度阈值 0.5，放大了 1000 倍用整数运算
            var pairs = [];

            if (n * m <= 1000000) {
                var sim = [];
                for (var i = 0; i < n; i++) {
                    sim[i] = [];
                    for (var j = 0; j < m; j++) sim[i][j] = Math.round(lineSim(ds[i].text, as[j].text) * 1000);
                }
                var W = m + 1;
                var dp = new Int32Array((n + 1) * W);
                for (var i = 1; i <= n; i++)
                    for (var j = 1; j <= m; j++) {
                        var g = sim[i - 1][j - 1] >= TH ? sim[i - 1][j - 1] : 0;
                        var best = Math.max(dp[(i - 1) * W + j], dp[i * W + j - 1]);
                        dp[i * W + j] = Math.max(best, dp[(i - 1) * W + j - 1] + g);
                    }
                var i = n, j = m;
                while (i > 0 && j > 0) {
                    var cur = dp[i * W + j];
                    var g = sim[i - 1][j - 1];
                    if (g >= TH && cur === dp[(i - 1) * W + j - 1] + g) { pairs.unshift([i - 1, j - 1]); i--; j--; }
                    else if (cur === dp[(i - 1) * W + j]) i--;
                    else j--;
                }
            } else {
                for (var t = 0; t < Math.min(n, m); t++) pairs.push([t, t]);
            }

            // 依据配对结果按序生成单元，保证两侧行号各自递增
            var dMap = {}, aMap = {};
            pairs.forEach(function (p) { dMap[p[0]] = p[1]; aMap[p[1]] = p[0]; });
            var units = [], i = 0, j = 0;
            while (i < n || j < m) {
                if (i < n && dMap[i] !== undefined) {
                    var aj = dMap[i];
                    while (j < aj) {
                        if (aMap[j] === undefined) units.push({ t: 'add', bn: as[j].bn, bHtml: esc(as[j].text) });
                        j++;
                    }
                    var seg = inlineDiff(ds[i].text, as[aj].text);
                    units.push({ t: 'change', an: ds[i].an, bn: as[aj].bn, aHtml: segsHtml(seg.a, 'del'), bHtml: segsHtml(seg.b, 'add') });
                    j = aj + 1; i++;
                } else if (i < n) {
                    units.push({ t: 'del', an: ds[i].an, aHtml: esc(ds[i].text) });
                    i++;
                } else {
                    if (aMap[j] === undefined) units.push({ t: 'add', bn: as[j].bn, bHtml: esc(as[j].text) });
                    j++;
                }
            }
            return units;
        }

        function buildUnits(rows) {
            var units = [], pending = [];
            function flush() {
                if (!pending.length) return;
                var ds = [], as = [];
                pending.forEach(function (r) { (r.t === 'del' ? ds : as).push(r); });
                units = units.concat(pairBlock(ds, as));
                pending = [];
            }
            rows.forEach(function (r) {
                if (r.t === 'same') {
                    flush();
                    units.push({ t: 'same', an: r.an, bn: r.bn, aHtml: esc(r.text), bHtml: esc(r.text) });
                } else pending.push(r);
            });
            flush();
            return units;
        }

        // ---- 并排视图（IDEA 风格）：长未变更段自动折叠 ----
        function renderSideBySide(units) {
            var out = [], i = 0;
            function sdRow(u) {
                if (u.t === 'same') {
                    return '<div class="sd-row same">' +
                        '<span class="ln">' + u.an + '</span><span class="cell l">' + (u.aHtml || '&nbsp;') + '</span>' +
                        '<span class="gutter"></span>' +
                        '<span class="ln">' + u.bn + '</span><span class="cell r">' + (u.bHtml || '&nbsp;') + '</span></div>';
                }
                var hasA = u.aHtml !== undefined, hasB = u.bHtml !== undefined;
                return '<div class="sd-row ' + u.t + '">' +
                    '<span class="ln">' + (hasA ? u.an : '') + '</span>' +
                    '<span class="cell l">' + (hasA ? (u.aHtml || '&nbsp;') : '') + '</span>' +
                    '<span class="gutter"></span>' +
                    '<span class="ln">' + (hasB ? u.bn : '') + '</span>' +
                    '<span class="cell r">' + (hasB ? (u.bHtml || '&nbsp;') : '') + '</span></div>';
            }
            while (i < units.length) {
                var u = units[i];
                if (u.t !== 'same') { out.push(sdRow(u)); i++; continue; }
                var j = i;
                while (j < units.length && units[j].t === 'same') j++;
                var run = j - i;
                if (run > FOLD_THRESHOLD && !expandedFolds[i]) {
                    for (var k = i; k < i + FOLD_EDGE; k++) out.push(sdRow(units[k]));
                    out.push('<div class="sd-row fold" onclick="toggleFold(' + i + ')">' +
                        '<span class="ln"></span><span class="cell l">··· 展开 ' + (run - FOLD_EDGE * 2) + ' 行未更改 ···</span>' +
                        '<span class="gutter"></span>' +
                        '<span class="ln"></span><span class="cell r"></span></div>');
                    for (var k = j - FOLD_EDGE; k < j; k++) out.push(sdRow(units[k]));
                } else {
                    for (var k = i; k < j; k++) out.push(sdRow(units[k]));
                }
                i = j;
            }
            return out.join('');
        }

        // ---- 统一视图 ----
        function renderUnified(units) {
            return units.map(function (u) {
                if (u.t === 'same') {
                    return '<div class="diff-row same">' +
                        '<span class="ln">' + u.an + '</span><span class="ln">' + u.bn + '</span>' +
                        '<span class="sign"> </span><span class="code">' + (u.aHtml || '&nbsp;') + '</span></div>';
                }
                var rows = '';
                if (u.aHtml !== undefined) rows += '<div class="diff-row del paired">' +
                    '<span class="ln">' + u.an + '</span><span class="ln"></span>' +
                    '<span class="sign">-</span><span class="code">' + (u.aHtml || '&nbsp;') + '</span></div>';
                if (u.bHtml !== undefined) rows += '<div class="diff-row add paired">' +
                    '<span class="ln"></span><span class="ln">' + u.bn + '</span>' +
                    '<span class="sign">+</span><span class="code">' + (u.bHtml || '&nbsp;') + '</span></div>';
                return rows;
            }).join('');
        }

        function switchView(v) {
            currentView = v;
            $('btnSideView').classList.toggle('active', v === 'side');
            $('btnUnifiedView').classList.toggle('active', v === 'unified');
            renderCurrentView();
        }

        function toggleFold(key) {
            expandedFolds[key] = !expandedFolds[key];
            renderCurrentView();
        }

        var lastDiffText = '';
        var changeEls = [], changeIdx = -1;

        function renderCurrentView() {
            if (!lastUnits.length) return;
            $('diffResult').innerHTML = currentView === 'side' ? renderSideBySide(lastUnits) : renderUnified(lastUnits);
            changeEls = $('diffResult').querySelectorAll
                ? Array.prototype.slice.call($('diffResult').querySelectorAll('.sd-row.change, .sd-row.del, .sd-row.add, .diff-row.del, .diff-row.add'))
                : [];
            changeIdx = -1;
            updateNavBadge();
        }

        function doDiff() {
            ignoreWs = $('ignoreWs').checked;
            ignoreCase = $('ignoreCase').checked;
            var a = $('inputA').value, b = $('inputB').value;
            if (!a && !b) {
                $('resultPanel').style.display = 'none';
                $('diffBadge').textContent = '';
                $('navBadge').textContent = '';
                lastDiffText = '';
                lastUnits = [];
                return;
            }
            var rows = diffLines(a, b);
            var adds = 0, dels = 0, text = [];
            rows.forEach(function (r) {
                if (r.t === 'add') adds++;
                if (r.t === 'del') dels++;
                text.push((r.t === 'add' ? '+' : r.t === 'del' ? '-' : ' ') + r.text);
            });
            lastDiffText = text.join('\n');
            lastUnits = buildUnits(rows);
            expandedFolds = {};
            $('resultPanel').style.display = 'block';

            var b2 = $('diffBadge');
            b2.textContent = '+' + adds + ' / -' + dels;
            b2.className = 'badge ' + (adds + dels > 0 ? 'badge-err' : 'badge-ok');
            $('resultBadge').textContent = adds + dels === 0 ? '两段文本完全一致' : '';

            renderCurrentView();
        }

        function updateNavBadge() {
            $('navBadge').textContent = changeEls.length
                ? (changeIdx + 1) + ' / ' + changeEls.length + ' 处差异'
                : (changeEls.length === 0 && $('resultPanel').style.display === 'block' ? '无差异' : '');
            $('navBadge').className = 'badge ' + (changeEls.length ? 'badge-info' : 'badge-ok');
        }

        function navChange(dir) {
            if (!changeEls.length) return;
            changeIdx = (changeIdx + dir + changeEls.length) % changeEls.length;
            updateNavBadge();
            var el = changeEls[changeIdx];
            if (el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }

        // 输入防抖实时对比
        var debounceTimer = null;
        function scheduleDiff() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(doDiff, 250);
        }

        function swapSides() {
            var a = $('inputA').value;
            $('inputA').value = $('inputB').value;
            $('inputB').value = a;
            updateLineNumbers($('inputA'), $('linesA'));
            updateLineNumbers($('inputB'), $('linesB'));
            updateSize('inputA', 'sizeBadgeA');
            updateSize('inputB', 'sizeBadgeB');
            doDiff();
        }

        function loadFile(input, textareaId, gutterId, badgeId) {
            var f = input.files && input.files[0];
            input.value = '';
            if (!f) return;
            var r = new FileReader();
            r.onload = function () {
                $(textareaId).value = r.result;
                updateLineNumbers($(textareaId), $(gutterId));
                updateSize(textareaId, badgeId);
                doDiff();
                showToast('已导入 ' + f.name);
            };
            r.readAsText(f);
        }

        function copyDiff() {
            if (!lastDiffText) { showToast('请先进行对比'); return; }
            navigator.clipboard.writeText(lastDiffText).then(function () { showToast('已复制到剪贴板'); });
        }

        function clearAll() {
            $('inputA').value = '';
            $('inputB').value = '';
            $('diffResult').innerHTML = '';
            $('resultPanel').style.display = 'none';
            $('diffBadge').textContent = '';
            $('navBadge').textContent = '';
            $('resultBadge').textContent = '';
            lastDiffText = '';
            lastUnits = [];
            changeEls = []; changeIdx = -1;
            expandedFolds = {};
            updateLineNumbers($('inputA'), $('linesA'));
            updateLineNumbers($('inputB'), $('linesB'));
            updateSize('inputA', 'sizeBadgeA');
            updateSize('inputB', 'sizeBadgeB');
        }

        bindEditor('inputA', 'linesA', 'sizeBadgeA');
        bindEditor('inputB', 'linesB', 'sizeBadgeB');
        $('inputA').addEventListener('input', scheduleDiff);
        $('inputB').addEventListener('input', scheduleDiff);
    </script>
</body>
</html>
