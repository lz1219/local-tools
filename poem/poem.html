<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>唐诗宋词库</title>
    <link rel="stylesheet" href="../assets/common.css">
    <style>
        body {
            background: #f3efe6;
            background-image: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(176, 141, 90, 0.10), transparent);
            color: #3a3428;
        }
        .container { max-width: 1080px; }
        h1 { font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', serif; color: #5a4632; letter-spacing: 6px; }
        .subtitle { color: #a0917a; letter-spacing: 2px; }
        .panel {
            background: #fdfbf5; border-color: #e4dcc9;
            box-shadow: 0 2px 10px rgba(120, 96, 60, 0.06);
        }
        .panel-header h3 { font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', serif; color: #5a4632; letter-spacing: 2px; }

        /* 工具栏 */
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .toolbar input[type="text"] {
            flex: 1; min-width: 180px; padding: 9px 14px; font-size: 14px;
            border: 1px solid #d8cdb4; border-radius: 8px; background: #fff;
            color: #3a3428; outline: none; font-family: inherit;
        }
        .toolbar input[type="text"]:focus { border-color: #b08d5a; box-shadow: 0 0 0 3px rgba(176, 141, 90, 0.15); }
        .indent-select { border-color: #d8cdb4; background: #fff; color: #3a3428; }
        .btn-primary { background: #b08d5a; }
        .btn-primary:hover { background: #9d7c4c; }
        .btn-outline { border-color: #d8cdb4; color: #7a6a52; background: #fff; }
        .btn-outline:hover { background: #f5efe2; }
        .result-count { font-size: 12px; color: #a0917a; margin-left: auto; }

        /* 主体：左列表右详情 */
        .main { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
        @media (max-width: 860px) { .main { grid-template-columns: 1fr; } }

        .list-panel { padding: 12px; }
        .poem-list { max-height: 640px; overflow-y: auto; }
        .poem-item {
            padding: 10px 12px; border-radius: 8px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
            transition: background 0.12s;
        }
        .poem-item:hover { background: #f5efe2; }
        .poem-item.active { background: #efe5d0; box-shadow: inset 2px 0 0 #b08d5a; }
        .poem-item .pt { font-size: 14px; color: #3a3428; font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', serif; }
        .poem-item .pa { font-size: 12px; color: #a0917a; white-space: nowrap; }
        .more-wrap { text-align: center; padding: 10px 0 4px; }
        .empty-tip { text-align: center; color: #a0917a; padding: 40px 0; font-size: 13px; }

        /* 阅读区 */
        .reader { text-align: center; padding: 36px 30px 28px; min-height: 420px; }
        .reader .daily-tag {
            display: inline-block; font-size: 11px; letter-spacing: 2px; color: #b08d5a;
            border: 1px solid rgba(176, 141, 90, 0.4); border-radius: 999px;
            padding: 3px 14px; margin-bottom: 18px;
        }
        .reader .rt {
            font-size: 30px; font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', serif;
            color: #4a3a26; letter-spacing: 3px; margin-bottom: 10px;
        }
        .reader .ra { font-size: 14px; color: #a0917a; letter-spacing: 2px; margin-bottom: 24px; }
        .reader .rc {
            font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', serif;
            font-size: 19px; line-height: 2.1; color: #3a3428;
            white-space: pre-line; max-width: 560px; margin: 0 auto 22px; text-align: center;
        }
        .tag-row { margin-bottom: 20px; min-height: 24px; }
        .tag-chip {
            display: inline-block; font-size: 12px; color: #8a7658;
            background: #f5efe2; border: 1px solid #e4dcc9;
            border-radius: 999px; padding: 2px 12px; margin: 2px 3px;
        }
        mark { background: #f2d98c; color: inherit; border-radius: 2px; padding: 0 1px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>唐诗宋词库</h1>
        <p class="subtitle">唐诗三百首 · 宋词三百首 · 全量收录</p>

        <div class="panel">
            <div class="toolbar">
                <input type="text" id="searchInput" placeholder="搜索标题 / 作者 / 诗句，如：明月、苏轼、大江东去">
                <select id="dynastyFilter" class="indent-select">
                    <option value="all">全部朝代</option>
                    <option value="唐">唐诗</option>
                    <option value="宋">宋词</option>
                </select>
                <select id="tagFilter" class="indent-select">
                    <option value="all">全部主题</option>
                </select>
                <button class="btn-primary" onclick="randomPoem()">随机一首</button>
                <button class="btn-outline" onclick="showDaily()">今日一诗</button>
                <span class="result-count" id="resultCount"></span>
            </div>
        </div>

        <div class="main">
            <div class="panel list-panel">
                <div class="poem-list" id="poemList"></div>
                <div class="more-wrap" id="moreWrap" style="display:none;">
                    <button class="btn-outline btn-sm" onclick="renderMore()">加载更多</button>
                </div>
            </div>
            <div class="panel reader">
                <div class="daily-tag" id="dailyTag" style="display:none;">今日一诗</div>
                <div class="rt" id="readerTitle"></div>
                <div class="ra" id="readerAuthor"></div>
                <div class="rc" id="readerContent"></div>
                <div class="tag-row" id="readerTags"></div>
                <button class="btn-outline btn-sm" onclick="copyPoem()">复制这首诗</button>
            </div>
        </div>
    </div>
    <div id="toast"></div>

    <script src="../assets/common.js"></script>
    <script src="../assets/poems.js"></script>
    <script>
        var PAGE_SIZE = 100;
        var filtered = POEM_DB.slice();
        var shownCount = 0;
        var currentIdx = -1;
        var keyword = '';

        function dayOfYear(d) {
            return Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(d.getFullYear(), 0, 1)) / 86400000) + 1;
        }
        function dailyPoemIndex(now) { // 与「人生进度条」页同一首
            var seed = now.getFullYear() * 1000 + dayOfYear(now);
            return (seed * 31) % POEM_DB.length;
        }

        // ---------- 筛选 ----------
        function buildTagOptions() {
            var tags = {}, sel = $('tagFilter');
            POEM_DB.forEach(function (p) { (p.g || []).forEach(function (t) { tags[t] = (tags[t] || 0) + 1; }); });
            Object.keys(tags).sort(function (a, b) { return tags[b] - tags[a]; }).forEach(function (t) {
                var opt = document.createElement('option');
                opt.value = t; opt.textContent = t + '（' + tags[t] + '）';
                sel.appendChild(opt);
            });
        }
        function applyFilter() {
            keyword = $('searchInput').value.trim();
            var dyn = $('dynastyFilter').value || 'all';
            var tag = $('tagFilter').value || 'all';
            filtered = POEM_DB.filter(function (p) {
                if (dyn !== 'all' && p.d !== dyn) return false;
                if (tag !== 'all' && (p.g || []).indexOf(tag) < 0) return false;
                if (keyword) {
                    var hay = p.t + '\n' + p.a + '\n' + p.c;
                    if (hay.indexOf(keyword) < 0) return false;
                }
                return true;
            });
            shownCount = 0;
            $('poemList').innerHTML = '';
            renderMore();
            $('resultCount').textContent = '共 ' + filtered.length + ' 首';
        }
        function hi(text) { // 关键词高亮
            if (!keyword) return text;
            var safe = keyword.replace(/&/g, '&amp;').replace(/</g, '&lt;');
            return text.split(keyword).join('<mark>' + safe + '</mark>');
        }
        function renderMore() {
            var list = $('poemList');
            var end = Math.min(shownCount + PAGE_SIZE, filtered.length);
            var html = '';
            for (var i = shownCount; i < end; i++) {
                var p = filtered[i];
                html += '<div class="poem-item" data-i="' + POEM_DB.indexOf(p) + '">' +
                    '<span class="pt">' + hi(p.t) + '</span>' +
                    '<span class="pa">' + p.d + ' · ' + hi(p.a) + '</span></div>';
            }
            if (shownCount === 0 && filtered.length === 0) {
                list.innerHTML = '<div class="empty-tip">没有找到匹配的诗词</div>';
            } else {
                list.insertAdjacentHTML('beforeend', html);
            }
            shownCount = end;
            $('moreWrap').style.display = shownCount < filtered.length ? '' : 'none';
        }

        // ---------- 阅读区 ----------
        function showPoem(idx, isDaily) {
            var p = POEM_DB[idx];
            if (!p) return;
            currentIdx = idx;
            $('readerTitle').textContent = p.t;
            $('readerAuthor').textContent = '【' + p.d + '】' + p.a;
            $('readerContent').textContent = p.c;
            $('readerTags').innerHTML = (p.g || []).map(function (t) {
                return '<span class="tag-chip">' + t + '</span>';
            }).join('');
            $('dailyTag').style.display = isDaily ? '' : 'none';
            var items = document.querySelectorAll('.poem-item');
            for (var i = 0; i < items.length; i++) {
                items[i].classList.toggle('active', +items[i].getAttribute('data-i') === idx);
            }
        }
        function randomPoem() {
            var pool = filtered.length ? filtered : POEM_DB;
            var p, idx, guard = 0;
            do {
                p = pool[Math.floor(Math.random() * pool.length)];
                idx = POEM_DB.indexOf(p);
            } while (pool.length > 1 && idx === currentIdx && ++guard < 10);
            showPoem(idx, false);
        }
        function showDaily() { showPoem(dailyPoemIndex(new Date()), true); }
        function copyPoem() {
            var p = POEM_DB[currentIdx];
            if (!p) return;
            var text = '《' + p.t + '》 ' + p.d + '·' + p.a + '\n' + p.c;
            navigator.clipboard.writeText(text).then(function () {
                showToast('已复制');
            }, function () {
                showToast('复制失败');
            });
        }

        // ---------- 事件 ----------
        $('poemList').addEventListener('click', function (e) {
            var item = e.target.closest('.poem-item');
            if (item) showPoem(+item.getAttribute('data-i'), false);
        });
        var searchTimer = null;
        $('searchInput').addEventListener('input', function () {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(applyFilter, 200);
        });
        $('dynastyFilter').addEventListener('change', applyFilter);
        $('tagFilter').addEventListener('change', applyFilter);

        // ---------- 启动 ----------
        buildTagOptions();
        applyFilter();
        document.querySelector('.subtitle').textContent = '唐诗三百首 · 宋词三百首 · 全量收录 ' + POEM_DB.length + ' 首经典';
        showDaily();
    </script>
</body>
</html>
