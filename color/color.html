<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色工具</title>
    <link rel="stylesheet" href="../assets/common.css">
    <style>
        .color-layout { display: flex; gap: 20px; }
        .preview-col { flex-shrink: 0; }
        .preview-box {
            width: 160px; height: 160px; border-radius: 10px;
            border: 1px solid #e0e4e8; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .preview-tip { text-align: center; font-size: 12px; color: #aaa; margin-top: 6px; }
        .form-col { flex: 1; min-width: 0; }
        .field-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
        .field-row label { width: 44px; font-size: 13px; color: #666; flex-shrink: 0; }
        .field-row input {
            padding: 8px 10px; border: 1px solid #dde1e6; border-radius: 6px;
            background: #fafbfc; font-family: Consolas, monospace; font-size: 13px; color: #333;
        }
        .field-row input:focus { outline: none; border-color: #4a9eff; }
        .field-row input[type="range"] { accent-color: #4a9eff; flex: 1; min-width: 100px; padding: 0; }
        .field-row .num { width: 56px; }
        .field-row .hex { width: 110px; }
        .fmt-list { display: flex; flex-direction: column; gap: 6px; }
        .fmt-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #fafbfc; border: 1px solid #dde1e6; border-radius: 6px;
            padding: 7px 12px; font-family: Consolas, monospace; font-size: 13px;
            cursor: pointer;
        }
        .fmt-item:hover { border-color: #4a9eff; }
        .fmt-item .k { color: #999; font-family: 'Segoe UI', sans-serif; font-size: 12px; }
        .palette { display: flex; gap: 10px; flex-wrap: wrap; }
        .swatch {
            width: 44px; height: 44px; border-radius: 6px; cursor: pointer;
            border: 1px solid rgba(0,0,0,0.08);
        }
        .swatch:hover { transform: scale(1.1); }
        .sw-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .sw-hex { font-size: 10px; color: #999; font-family: Consolas, monospace; }
        .sw-saved { position: relative; }
        .sw-del {
            position: absolute; top: -7px; right: -7px; width: 16px; height: 16px;
            border-radius: 50%; border: 1px solid #dde1e6; background: #fff; color: #c62828;
            font-size: 11px; line-height: 1; cursor: pointer; padding: 0;
            display: none; align-items: center; justify-content: center;
        }
        .sw-saved:hover .sw-del { display: flex; }
        .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .chip {
            padding: 5px 14px; border-radius: 999px; font-size: 12px; cursor: pointer;
            border: 1px solid #dde1e6; background: #fafbfc; color: #666; font-family: inherit;
        }
        .chip:hover { border-color: #4a9eff; }
        .chip.on { background: #4a9eff; border-color: #4a9eff; color: #fff; }
        .saved-empty { font-size: 12px; color: #aaa; }
        .contrast-row { display: flex; gap: 12px; align-items: center; font-size: 13px; color: #666; flex-wrap: wrap; }
        .wcag { font-size: 12px; padding: 2px 10px; border-radius: 10px; font-weight: 600; }
        .wcag-pass { background: #e8f5e9; color: #2e7d32; }
        .wcag-fail { background: #ffeef0; color: #c62828; }
        .wcag-warn { background: #fff8e1; color: #b26a00; }
        .contrast-preview {
            margin-top: 12px; padding: 12px 16px; border-radius: 8px;
            font-size: 15px; letter-spacing: 1px; border: 1px solid #e0e4e8;
            transition: background 0.15s, color 0.15s;
        }
        .contrast-advice { margin-top: 8px; font-size: 13px; color: #666; }
        .contrast-advice b { color: #333; }
        /* ---- 取色弹窗 ---- */
        .modal-mask {
            position: fixed; inset: 0; z-index: 50; display: none;
            background: rgba(30, 40, 55, 0.35);
            align-items: center; justify-content: center;
        }
        .modal-mask.show { display: flex; }
        .picker {
            background: #fff; border-radius: 12px; padding: 18px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            width: 300px;
        }
        .picker-title {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 14px; font-weight: 600; color: #333; margin-bottom: 14px;
        }
        .picker-close {
            border: none; background: none; font-size: 18px; color: #aaa;
            cursor: pointer; padding: 0 4px; line-height: 1;
        }
        .picker-close:hover { color: #333; }
        .sv-box {
            position: relative; width: 100%; height: 180px; border-radius: 8px;
            cursor: crosshair; touch-action: none;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
        }
        .sv-marker, .hue-marker {
            position: absolute; width: 14px; height: 14px; border-radius: 50%;
            border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0,0,0,0.4);
            pointer-events: none; transform: translate(-50%, -50%);
        }
        .hue-strip {
            position: relative; height: 14px; border-radius: 999px; margin-top: 14px;
            background: linear-gradient(to right,
                hsl(0,100%,50%), hsl(30,100%,50%), hsl(60,100%,50%), hsl(90,100%,50%),
                hsl(120,100%,50%), hsl(150,100%,50%), hsl(180,100%,50%), hsl(210,100%,50%),
                hsl(240,100%,50%), hsl(270,100%,50%), hsl(300,100%,50%), hsl(330,100%,50%), hsl(360,100%,50%));
            cursor: pointer; touch-action: none;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
        }
        .hue-marker { top: 50%; }
        .picker-row { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
        .picker-preview {
            width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        .picker-hex {
            flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #dde1e6;
            border-radius: 6px; background: #fafbfc;
            font-family: Consolas, monospace; font-size: 13px; color: #333;
        }
        .picker-hex:focus { outline: none; border-color: #4a9eff; }
        @media (max-width: 640px) { .color-layout { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>颜色工具</h1>
        <p class="subtitle">HEX / RGB / HSL 互转 · 色阶 · 色彩调和 · 调色板收藏 · 对比度检查</p>

        <div class="panel">
            <div class="color-layout">
                <div class="preview-col">
                    <div class="preview-box" id="preview" onclick="openPicker()"></div>
                    <div class="preview-tip">点击打开取色器</div>
                </div>
                <div class="form-col">
                    <div class="field-row">
                        <label>HEX</label>
                        <input type="text" class="hex" id="hexInput" placeholder="#4a9eff">
                    </div>
                    <div class="field-row">
                        <label>RGB</label>
                        <input type="range" id="rRange" min="0" max="255"><input type="number" class="num" id="rNum">
                        <input type="range" id="gRange" min="0" max="255"><input type="number" class="num" id="gNum">
                        <input type="range" id="bRange" min="0" max="255"><input type="number" class="num" id="bNum">
                    </div>
                    <div class="field-row">
                        <label>HSL</label>
                        <input type="range" id="hRange" min="0" max="360"><input type="number" class="num" id="hNum">
                        <input type="range" id="sRange" min="0" max="100"><input type="number" class="num" id="sNum">
                        <input type="range" id="lRange" min="0" max="100"><input type="number" class="num" id="lNum">
                    </div>
                    <div class="field-row">
                        <button class="btn-outline btn-sm" onclick="randomColor()">随机颜色</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header"><h3>常用格式（点击复制）</h3></div>
            <div class="fmt-list" id="fmtList"></div>
        </div>

        <div class="panel">
            <div class="panel-header"><h3>色阶</h3></div>
            <div class="palette" id="palette"></div>
        </div>

        <div class="panel">
            <div class="panel-header"><h3>色彩调和</h3></div>
            <div class="chip-row" id="harmonyTypes"></div>
            <div class="palette" id="harmony"></div>
        </div>

        <div class="panel">
            <div class="panel-header"><h3>我的调色板</h3></div>
            <div class="palette" id="saved"></div>
            <div style="margin-top:12px">
                <button class="btn-outline btn-sm" onclick="saveCurrent()">收藏当前颜色</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header"><h3>文字对比度</h3></div>
            <div class="contrast-row">
                <span>当前颜色上的文字可读性（正文 AA ≥ 4.5 · 大字 AA ≥ 3.0）:</span>
                <span id="contrastWhite"></span>
                <span id="contrastBlack"></span>
            </div>
            <div class="contrast-preview" id="contrastPreview">示例文字 Aa 123 · 星空工具箱</div>
            <div class="contrast-advice" id="contrastAdvice"></div>
        </div>
    </div>
    <div id="toast"></div>
    <div class="modal-mask" id="pickerMask">
        <div class="picker">
            <div class="picker-title">取色器<button class="picker-close" onclick="closePicker()" aria-label="关闭">×</button></div>
            <div class="sv-box" id="svBox"><div class="sv-marker" id="svMarker"></div></div>
            <div class="hue-strip" id="hueStrip"><div class="hue-marker" id="hueMarker"></div></div>
            <div class="picker-row">
                <div class="picker-preview" id="pickerPreview"></div>
                <input type="text" class="picker-hex" id="pickerHex" placeholder="#4a9eff" spellcheck="false">
                <button class="btn-primary btn-sm" onclick="closePicker()">确定</button>
            </div>
        </div>
    </div>
    <script src="../assets/common.js"></script>
    <script>
        var current = { r: 74, g: 158, b: 255 };

        function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

        function rgbToHex(r, g, b) {
            function h(n) { var s = clamp(Math.round(n), 0, 255).toString(16); return s.length < 2 ? '0' + s : s; }
            return '#' + h(r) + h(g) + h(b);
        }

        function hexToRgb(hex) {
            var m = /^#?([0-9a-f]{6}|[0-9a-f]{3})$/i.exec(hex.trim());
            if (!m) return null;
            var s6 = m[1].length === 3 ? m[1].replace(/./g, function (ch) { return ch + ch; }) : m[1];
            var v = parseInt(s6, 16);
            return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
        }

        // 色彩调和：围绕当前色相按经典配色关系取一组 [h, s, l]（纯函数，可测）
        function buildHarmony(h, s, l, type) {
            var offsets =
                type === 'comp' ? [0, 180] :
                type === 'analog' ? [-60, -30, 0, 30, 60] :
                type === 'triad' ? [0, 120, 240] :
                type === 'split' ? [0, 150, 210] :
                [0, 90, 180, 270]; // square 方形
            return offsets.map(function (d) {
                return [(((h + d) % 360) + 360) % 360, s, l];
            });
        }

        // 色域面板坐标 → [h, s, l]。面板渲染 = 基色上叠白色左渐层 + 黑色下渐层：
        // 右上角是纯基色（l=50），左上角白色，底边黑色（纯函数，可测）
        function pickSv(h, fx, fy) {
            var x = clamp(fx, 0, 1), y = clamp(fy, 0, 1);
            return [(((h % 360) + 360) % 360),
                    Math.round(x * 100),
                    Math.round((100 - 50 * x) * (1 - y))];
        }

        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            var max = Math.max(r, g, b), min = Math.min(r, g, b);
            var h = 0, s = 0, l = (max + min) / 2;
            if (max !== min) {
                var d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
                else if (max === g) h = (b - r) / d + 2;
                else h = (r - g) / d + 4;
                h *= 60;
            }
            return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
        }

        function hslToRgb(h, s, l) {
            h = ((h % 360) + 360) % 360; s = clamp(s, 0, 100) / 100; l = clamp(l, 0, 100) / 100;
            var c = (1 - Math.abs(2 * l - 1)) * s;
            var x = c * (1 - Math.abs((h / 60) % 2 - 1));
            var m = l - c / 2, r = 0, g = 0, b = 0;
            if (h < 60) { r = c; g = x; }
            else if (h < 120) { r = x; g = c; }
            else if (h < 180) { g = c; b = x; }
            else if (h < 240) { g = x; b = c; }
            else if (h < 300) { r = x; b = c; }
            else { r = c; b = x; }
            return { r: Math.round((r + m) * 255), g: Math.round((g + m) * 255), b: Math.round((b + m) * 255) };
        }

        function luminance(r, g, b) {
            function f(v) {
                v /= 255;
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            }
            return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
        }

        function contrastRatio(rgb1, rgb2) {
            var l1 = luminance(rgb1.r, rgb1.g, rgb1.b);
            var l2 = luminance(rgb2.r, rgb2.g, rgb2.b);
            var hi = Math.max(l1, l2), lo = Math.min(l1, l2);
            return (hi + 0.05) / (lo + 0.05);
        }

        // WCAG 判定：正文 AA 4.5 / AAA 7；大字（≥24px 或 ≥18.7px 粗体）AA 3.0 / AAA 4.5
        function wcagTag(ratio, level, large) {
            var th = level === 'AA' ? (large ? 3 : 4.5) : (large ? 4.5 : 7);
            var pass = ratio >= th;
            return '<span class="wcag ' + (pass ? 'wcag-pass' : 'wcag-fail') + '">' + level + ' ' + (pass ? '通过' : '不通过') + '</span>';
        }

        // 一行对比度结论：正文标签 + 大字可达性补充（纯函数，可测）
        function contrastLine(ratio) {
            var html = '对比度 <b>' + ratio.toFixed(2) + '</b> ' + wcagTag(ratio, 'AA') + ' ' + wcagTag(ratio, 'AAA');
            if (ratio >= 3 && ratio < 4.5) {
                html += ' <span class="wcag wcag-warn" title="大字（≥24px，或 ≥18.7px 粗体）标准">大字可通过 AA</span>';
            } else if (ratio >= 4.5 && ratio < 7) {
                html += ' <span class="wcag wcag-warn" title="大字（≥24px，或 ≥18.7px 粗体）标准">大字可通过 AAA</span>';
            }
            return html;
        }

        // 取对比度高的一方给建议（纯函数，可测）
        function contrastAdvice(rw, rb) {
            var useWhite = rw >= rb;
            var best = Math.max(rw, rb);
            var level = best >= 7 ? '可达 AAA（正文标准）' :
                        best >= 4.5 ? '可达 AA（正文）· AAA（大字）' :
                        best >= 3 ? '可达 AA（大字标准）' : '不满足 WCAG 最低要求';
            return { color: useWhite ? '#ffffff' : '#000000', label: useWhite ? '白字' : '黑字', level: level, ratio: best };
        }

        function setFromRgb(r, g, b) {
            current = { r: clamp(Math.round(r), 0, 255), g: clamp(Math.round(g), 0, 255), b: clamp(Math.round(b), 0, 255) };
            render();
        }

        function render() {
            var c = current;
            var hex = rgbToHex(c.r, c.g, c.b);
            var hsl = rgbToHsl(c.r, c.g, c.b);

            $('preview').style.background = hex;
            if (document.activeElement !== $('hexInput')) $('hexInput').value = hex;

            [['r', c.r], ['g', c.g], ['b', c.b]].forEach(function (p) {
                if (document.activeElement !== $(p[0] + 'Range')) $(p[0] + 'Range').value = p[1];
                if (document.activeElement !== $(p[0] + 'Num')) $(p[0] + 'Num').value = p[1];
            });
            [['h', hsl.h], ['s', hsl.s], ['l', hsl.l]].forEach(function (p) {
                if (document.activeElement !== $(p[0] + 'Range')) $(p[0] + 'Range').value = p[1];
                if (document.activeElement !== $(p[0] + 'Num')) $(p[0] + 'Num').value = p[1];
            });

            $('fmtList').innerHTML =
                fmtItem('HEX', hex) +
                fmtItem('RGB', 'rgb(' + c.r + ', ' + c.g + ', ' + c.b + ')') +
                fmtItem('RGBA', 'rgba(' + c.r + ', ' + c.g + ', ' + c.b + ', 1)') +
                fmtItem('HSL', 'hsl(' + hsl.h + ', ' + hsl.s + '%, ' + hsl.l + '%)');

            // 色阶：向白和黑各 5 档
            var sw = '';
            for (var i = 5; i >= 1; i--) {
                var f = i / 6;
                sw += swatch(rgbToHex(c.r + (255 - c.r) * f, c.g + (255 - c.g) * f, c.b + (255 - c.b) * f));
            }
            sw += swatch(hex);
            for (var i = 1; i <= 5; i++) {
                var f = i / 6;
                sw += swatch(rgbToHex(c.r * (1 - f), c.g * (1 - f), c.b * (1 - f)));
            }
            $('palette').innerHTML = sw;

            var rw = contrastRatio(c, { r: 255, g: 255, b: 255 });
            var rb = contrastRatio(c, { r: 0, g: 0, b: 0 });
            $('contrastWhite').innerHTML = '白字 ' + contrastLine(rw);
            $('contrastBlack').innerHTML = '黑字 ' + contrastLine(rb);
            var adv = contrastAdvice(rw, rb);
            $('contrastPreview').style.background = hex;
            $('contrastPreview').style.color = adv.color;
            $('contrastAdvice').innerHTML = '建议搭配 <b>' + adv.label + '</b> · 对比度 ' + adv.ratio.toFixed(2) + ' · ' + adv.level;
            renderHarmony();
            renderSaved();
        }

        // ---- 色彩调和 ----
        var harmonyType = 'analog';
        var HARMONY_TYPES = [
            ['analog', '类似色'], ['comp', '互补色'], ['triad', '三角色'],
            ['split', '分裂互补'], ['square', '方形']
        ];

        function renderHarmonyTypes() {
            $('harmonyTypes').innerHTML = HARMONY_TYPES.map(function (t) {
                return '<button class="chip' + (t[0] === harmonyType ? ' on' : '') + '" data-type="' + t[0] + '">' + t[1] + '</button>';
            }).join('');
        }

        function renderHarmony() {
            var hsl = rgbToHsl(current.r, current.g, current.b);
            $('harmony').innerHTML = buildHarmony(hsl.h, hsl.s, hsl.l, harmonyType).map(function (c) {
                var rgb = hslToRgb(c[0], c[1], c[2]);
                var hex = rgbToHex(rgb.r, rgb.g, rgb.b);
                return '<div class="sw-item"><div class="swatch" style="background:' + hex + '" title="点击应用 ' + hex +
                    '" onclick="applyHex(\'' + hex + '\')"></div><span class="sw-hex">' + hex + '</span></div>';
            }).join('');
        }

        // ---- 我的调色板（localStorage 持久化） ----
        function getSaved() {
            try {
                var a = JSON.parse(localStorage.getItem('color.saved') || '[]');
                return Array.isArray(a) ? a : [];
            } catch (err) { return []; }
        }

        function persistSaved(list) {
            try { localStorage.setItem('color.saved', JSON.stringify(list)); } catch (err) {}
        }

        function saveCurrent() {
            var hex = rgbToHex(current.r, current.g, current.b);
            var list = getSaved();
            if (list.indexOf(hex) !== -1) { showToast('该颜色已在调色板中'); return; }
            list.push(hex);
            persistSaved(list);
            renderSaved();
            showToast('已收藏 ' + hex);
        }

        function removeSaved(hex) {
            persistSaved(getSaved().filter(function (x) { return x !== hex; }));
            renderSaved();
        }

        function renderSaved() {
            var list = getSaved();
            $('saved').innerHTML = list.length ? list.map(function (hex) {
                return '<div class="sw-item"><div class="swatch sw-saved" style="background:' + hex +
                    '" title="点击应用 ' + hex + '" onclick="applyHex(\'' + hex + '\')">' +
                    '<button class="sw-del" title="删除" onclick="event.stopPropagation(); removeSaved(\'' + hex + '\')">×</button></div>' +
                    '<span class="sw-hex">' + hex + '</span></div>';
            }).join('') : '<span class="saved-empty">还没有收藏颜色，调好颜色后点下方按钮收藏</span>';
        }

        // ---- 弹窗取色器：色域面板 + 色相条，与主表单双向联动 ----
        var pickerHue = 212;

        function openPicker() {
            renderPicker(rgbToHsl(current.r, current.g, current.b));
            $('pickerMask').classList.add('show');
        }

        function closePicker() { $('pickerMask').classList.remove('show'); }

        function renderPicker(hsl) {
            pickerHue = hsl.h;
            $('svBox').style.background =
                'linear-gradient(to top, #000, rgba(0,0,0,0)),' +
                'linear-gradient(to right, #fff, rgba(255,255,255,0)),' +
                'hsl(' + hsl.h + ', 100%, 50%)';
            var mx = hsl.s / 100;
            $('svMarker').style.left = (mx * 100) + '%';
            $('svMarker').style.top = ((1 - hsl.l / (100 - 50 * mx)) * 100) + '%';
            $('hueMarker').style.left = (hsl.h / 3.6) + '%';
            var rgb = hslToRgb(hsl.h, hsl.s, hsl.l);
            $('pickerPreview').style.background = rgbToHex(rgb.r, rgb.g, rgb.b);
            if (document.activeElement !== $('pickerHex')) {
                $('pickerHex').value = rgbToHex(rgb.r, rgb.g, rgb.b);
            }
            setFromRgb(rgb.r, rgb.g, rgb.b);
        }

        // 在元素上按下并拖动，回调持续收到 pointer 事件
        function bindDrag(el, cb) {
            el.addEventListener('pointerdown', function (e) {
                if (el.setPointerCapture) { try { el.setPointerCapture(e.pointerId); } catch (err) {} }
                cb(e);
                function mv(ev) { cb(ev); }
                function up() {
                    el.removeEventListener('pointermove', mv);
                    el.removeEventListener('pointerup', up);
                    el.removeEventListener('pointercancel', up);
                }
                el.addEventListener('pointermove', mv);
                el.addEventListener('pointerup', up);
                el.addEventListener('pointercancel', up);
            });
        }

        function fmtItem(k, v) {
            return '<div class="fmt-item" onclick="copyText(\'' + v.replace(/'/g, '') + '\')"><span class="k">' + k + '</span><span>' + v + '</span></div>';
        }

        function swatch(hex) {
            return '<div class="swatch" style="background:' + hex + '" title="' + hex + '" onclick="applyHex(\'' + hex + '\')"></div>';
        }

        function applyHex(hex) {
            var rgb = hexToRgb(hex);
            if (rgb) setFromRgb(rgb.r, rgb.g, rgb.b);
        }

        function copyText(t) {
            navigator.clipboard.writeText(t).then(function () { showToast('已复制 ' + t); });
        }

        function randomColor() {
            var buf = new Uint8Array(3);
            crypto.getRandomValues(buf);
            setFromRgb(buf[0], buf[1], buf[2]);
        }

        // 调和类型切换（委托绑定）
        $('harmonyTypes').addEventListener('click', function (e) {
            var t = e.target.getAttribute && e.target.getAttribute('data-type');
            if (t) { harmonyType = t; renderHarmonyTypes(); renderHarmony(); }
        });
        renderHarmonyTypes();

        // 取色弹窗：色域面板 / 色相条拖动、hex 输入、遮罩与 ESC 关闭
        bindDrag($('svBox'), function (e) {
            var r = $('svBox').getBoundingClientRect();
            var hsl = pickSv(pickerHue, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
            renderPicker({ h: hsl[0], s: hsl[1], l: hsl[2] });
        });
        bindDrag($('hueStrip'), function (e) {
            var r = $('hueStrip').getBoundingClientRect();
            var cur = rgbToHsl(current.r, current.g, current.b);
            renderPicker({ h: Math.round(clamp((e.clientX - r.left) / r.width, 0, 1) * 360), s: cur.s, l: cur.l });
        });
        $('pickerHex').addEventListener('input', function () {
            var rgb = hexToRgb(this.value);
            if (rgb) renderPicker(rgbToHsl(rgb.r, rgb.g, rgb.b));
        });
        $('pickerMask').addEventListener('click', function (e) {
            if (e.target === this) closePicker();
        });
        if (document.addEventListener) {
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closePicker();
            });
        }

        // 事件：HEX 输入
        $('hexInput').addEventListener('input', function () {
            var rgb = hexToRgb(this.value);
            if (rgb) setFromRgb(rgb.r, rgb.g, rgb.b);
        });
        // RGB 控件
        ['r', 'g', 'b'].forEach(function (k) {
            function applyChannel(v) {
                setFromRgb(k === 'r' ? v : current.r, k === 'g' ? v : current.g, k === 'b' ? v : current.b);
            }
            $(k + 'Range').addEventListener('input', function () {
                $(k + 'Num').value = this.value;
                applyChannel(+this.value);
            });
            $(k + 'Num').addEventListener('input', function () {
                var v = +this.value;
                if (!isNaN(v)) applyChannel(v);
            });
        });
        // HSL 控件
        ['h', 's', 'l'].forEach(function (k) {
            function applyHsl() {
                var rgb = hslToRgb(+$('hNum').value || 0, +$('sNum').value || 0, +$('lNum').value || 0);
                setFromRgb(rgb.r, rgb.g, rgb.b);
            }
            $(k + 'Range').addEventListener('input', function () {
                $(k + 'Num').value = this.value;
                applyHsl();
            });
            $(k + 'Num').addEventListener('input', function () {
                if (!isNaN(+this.value)) applyHsl();
            });
        });

        render();
    </script>
</body>
</html>
