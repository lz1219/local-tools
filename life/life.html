<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生进度条</title>
    <link rel="stylesheet" href="../assets/common.css">
    <style>
        body {
            background: #070b16;
            color: #dbe4f5;
            font-family: Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background-image:
                radial-gradient(ellipse 900px 500px at 15% -5%, rgba(56, 189, 248, 0.10), transparent),
                radial-gradient(ellipse 800px 500px at 85% 0%, rgba(129, 140, 248, 0.12), transparent),
                radial-gradient(ellipse 700px 600px at 50% 110%, rgba(192, 132, 252, 0.08), transparent);
            background-attachment: fixed;
        }
        .container { max-width: 880px; }
        h1 {
            color: transparent; font-size: 30px; letter-spacing: 2px;
            background: linear-gradient(90deg, #7dd3fc, #a5b4fc, #d8b4fe);
            -webkit-background-clip: text; background-clip: text;
        }
        .subtitle { color: #5b6b8c; margin-bottom: 24px; letter-spacing: 1px; }
        .panel {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px; padding: 22px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(6px);
        }
        .panel-header h3 { color: #b8c6e2; font-weight: 600; letter-spacing: 1px; }

        /* 设置区 */
        .setup-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 13px; color: #8fa0c2; }
        .setup-row input {
            padding: 8px 12px; border-radius: 8px; font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.06); color: #e6edfb;
            font-family: Consolas, monospace; outline: none;
        }
        .setup-row input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        .setup-row input[type="number"] { width: 76px; }
        .setup-row input[type="date"] { color-scheme: dark; }

        /* 英雄区 */
        .hero { text-align: center; padding: 30px 24px 26px; }
        .hero-num {
            font-size: 64px; font-weight: 700; letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-shadow: none; line-height: 1.1;
        }
        .hero-cap { color: #64748b; font-size: 13px; margin: 6px 0 18px; letter-spacing: 3px; }
        .hero-sub { margin-top: 14px; font-size: 13px; color: #8fa0c2; font-variant-numeric: tabular-nums; }
        .hero-sub b { color: #e2e8f0; font-weight: 600; }

        /* 进度条 */
        .bar {
            height: 10px; border-radius: 999px; overflow: hidden;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
        }
        .bar > i {
            display: block; height: 100%; width: 0;
            border-radius: 999px;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            box-shadow: 0 0 12px rgba(99, 132, 248, 0.55);
            transition: width 0.4s linear;
        }
        .hero-bar { height: 14px; }

        /* 四格卡片 */
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
        .mini {
            background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px; padding: 16px 18px;
        }
        .mini .lab { font-size: 12px; color: #64748b; letter-spacing: 2px; margin-bottom: 6px; }
        .mini .pct { font-size: 24px; font-weight: 700; color: #e2e8f0; font-variant-numeric: tabular-nums; margin-bottom: 10px; }
        .mini .pct small { font-size: 13px; color: #7c8db0; font-weight: 500; }

        /* 生命周格 */
        .weeks-info { font-size: 12px; color: #7c8db0; font-variant-numeric: tabular-nums; }
        #weeksGrid { display: grid; grid-template-columns: repeat(52, 1fr); gap: 3px; margin-top: 12px; }
        .wk { aspect-ratio: 1; border-radius: 2px; background: rgba(255, 255, 255, 0.07); }
        .wk.done { background: linear-gradient(135deg, #38bdf8, #818cf8); box-shadow: 0 0 3px rgba(56, 189, 248, 0.35); }
        .wk.now { background: #f0abfc; box-shadow: 0 0 8px rgba(240, 171, 252, 0.9); animation: pulse 1.2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.6); } }
        .legend { display: flex; gap: 18px; margin-top: 12px; font-size: 12px; color: #7c8db0; }
        .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

        /* 每日箴言 */
        .quote-panel { text-align: center; padding: 26px 24px; }
        .quote {
            font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', serif;
            font-size: 20px; color: #e2e8f0; line-height: 1.8;
            max-width: 640px; margin: 4px auto 10px;
            text-shadow: 0 0 24px rgba(129, 140, 248, 0.25);
            white-space: pre-line;
        }
        .quote-author { font-size: 13px; color: #64748b; letter-spacing: 1px; }

        /* 今日黄历 */
        .alm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .alm-cell {
            text-align: center; padding: 12px 8px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .alm-cell .v { font-size: 16px; font-weight: 700; color: #e2e8f0; font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', serif; }
        .alm-cell .k { font-size: 11px; color: #64748b; margin-top: 4px; letter-spacing: 2px; }
        .yiji { display: flex; flex-direction: column; gap: 10px; }
        .yiji-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
        .yiji-tag {
            flex-shrink: 0; width: 34px; height: 34px; border-radius: 10px;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 16px; font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', serif;
        }
        .tag-yi { background: rgba(52, 211, 153, 0.16); color: #34d399; box-shadow: 0 0 12px rgba(52, 211, 153, 0.2); }
        .tag-ji { background: rgba(248, 113, 113, 0.14); color: #f87171; box-shadow: 0 0 12px rgba(248, 113, 113, 0.18); }
        .chip {
            display: inline-block; padding: 4px 12px; margin: 2px 4px 2px 0; border-radius: 999px;
            font-size: 12.5px; letter-spacing: 0.5px;
        }
        .chip-yi { background: rgba(52, 211, 153, 0.10); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.22); }
        .chip-ji { background: rgba(248, 113, 113, 0.08); color: #fca5a5; border: 1px solid rgba(248, 113, 113, 0.20); }
        .alm-note { font-size: 11.5px; color: #4b5a77; margin-top: 14px; }

        /* 趣味数字 */
        .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
        .fact { text-align: center; padding: 18px 12px; }
        .fact .num { font-size: 26px; font-weight: 700; color: #e2e8f0; font-variant-numeric: tabular-nums; }
        .fact .cap { font-size: 12px; color: #64748b; margin-top: 6px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>人生进度条</h1>
        <p class="subtitle">TIME FLIES · 每一格都是一周，每一秒都算数</p>

        <div class="panel">
            <div class="setup-row">
                <span>出生日期 <input type="date" id="birthInput" value="2000-01-01"></span>
                <span>预期寿命 <input type="number" id="expectInput" value="80" min="1" max="120"> 岁</span>
                <button class="btn-primary btn-sm" onclick="applySettings()">开始计时</button>
                <button class="btn-outline btn-sm" style="background:rgba(255,255,255,0.06); color:#b8c6e2; border-color:rgba(255,255,255,0.14);" onclick="resetSettings()">重置</button>
            </div>
        </div>

        <div class="panel hero">
            <div class="hero-num" id="lifePct">--.--%</div>
            <div class="hero-cap">人 生 已 走 过</div>
            <div class="bar hero-bar"><i id="lifeBar"></i></div>
            <div class="hero-sub" id="lifeSub">填写生日后开始</div>
        </div>

        <div class="panel quote-panel">
            <div class="panel-header">
                <h3>每日一诗</h3>
                <div style="display:flex; gap:8px; align-items:center;">
                    <select id="poemFilter" onchange="nextPoem()" class="indent-select" style="background:rgba(255,255,255,0.06); color:#b8c6e2; border-color:rgba(255,255,255,0.14);">
                        <option value="all">全部</option>
                        <option value="tang">唐诗</option>
                        <option value="song">宋词</option>
                    </select>
                    <button class="btn-outline btn-sm" style="background:rgba(255,255,255,0.06); color:#b8c6e2; border-color:rgba(255,255,255,0.14);" onclick="nextPoem()">换一首</button>
                </div>
            </div>
            <div class="quote" id="poemContent"></div>
            <div class="quote-author"><span id="poemTitle"></span> · <span id="poemMeta"></span> · <span id="poemCounter"></span></div>
        </div>

        <div class="cards">
            <div class="mini"><div class="lab">今 天</div><div class="pct" id="dayPct">--</div><div class="bar"><i id="dayBar"></i></div></div>
            <div class="mini"><div class="lab">本 周</div><div class="pct" id="weekPct">--</div><div class="bar"><i id="weekBar"></i></div></div>
            <div class="mini"><div class="lab">本 月</div><div class="pct" id="monthPct">--</div><div class="bar"><i id="monthBar"></i></div></div>
            <div class="mini"><div class="lab">今 年</div><div class="pct" id="yearPct">--</div><div class="bar"><i id="yearBar"></i></div></div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h3>今日黄历</h3>
                <span class="weeks-info" id="almDate"></span>
            </div>
            <div class="alm-grid" id="almanacGrid"></div>
            <div class="yiji">
                <div class="yiji-row"><span class="yiji-tag tag-yi">宜</span><span id="yiList"></span></div>
                <div class="yiji-row"><span class="yiji-tag tag-ji">忌</span><span id="jiList"></span></div>
            </div>
            <p class="alm-note">农历与干支按历法推算（1900-2100）；宜忌由当日干支确定性生成，仅供娱乐。</p>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h3>生命周格</h3>
                <span class="weeks-info" id="weeksInfo"></span>
            </div>
            <div id="weeksGrid"></div>
            <div class="legend">
                <span><i style="background:linear-gradient(135deg,#38bdf8,#818cf8);"></i>已度过</span>
                <span><i style="background:#f0abfc;"></i>本周</span>
                <span><i style="background:rgba(255,255,255,0.07);"></i>未来</span>
            </div>
        </div>

        <div class="facts" id="facts"></div>
    </div>
    <div id="toast"></div>
    <script src="../assets/common.js"></script>
    <script src="../assets/poems.js"></script>
    <script>
        var DAY = 86400000;
        var LSK_BIRTH = 'life.birth', LSK_EXPECT = 'life.expect';
        var birthDate = null, expectAge = 80;

        // ---------- 纯计算 ----------
        function dayProgress(now) {
            var d = new Date(now);
            return (d - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / DAY;
        }
        function weekProgress(now) { // 周一为一周之始
            var d = new Date(now);
            var dow = (d.getDay() + 6) % 7;
            var start = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
            return (d - start) / (7 * DAY);
        }
        function monthProgress(now) {
            var d = new Date(now);
            var start = new Date(d.getFullYear(), d.getMonth(), 1);
            var end = new Date(d.getFullYear(), d.getMonth() + 1, 1);
            return (d - start) / (end - start);
        }
        function yearProgress(now) {
            var d = new Date(now);
            var start = new Date(d.getFullYear(), 0, 1);
            var end = new Date(d.getFullYear() + 1, 0, 1);
            return (d - start) / (end - start);
        }
        function lifeStats(birth, expect, now) {
            var totalWeeks = expect * 52;
            var msLived = Math.max(0, now - birth);
            var days = Math.floor(msLived / DAY);
            var weeks = Math.floor(days / 7);
            return {
                days: days,
                weeks: weeks,
                totalWeeks: totalWeeks,
                pct: Math.min(100, msLived / (expect * 365.2425 * DAY) * 100),
                heartbeats: Math.round(days * 1440 * 72),          // 平均 72 次/分
                sleepDays: Math.round(days / 3),                    // 三分之一在睡觉
                weekendsLeft: Math.max(0, totalWeeks - weeks)
            };
        }
        function weeksHtml(weeks, total) {
            var html = '';
            for (var i = 0; i < total; i++) {
                var cls = i < weeks ? 'wk done' : (i === weeks ? 'wk now' : 'wk');
                html += '<i class="' + cls + '" data-w="' + i + '"></i>';
            }
            return html;
        }
        function fmtInt(n) {
            var s = String(Math.round(n)), out = '';
            while (s.length > 3) { out = ',' + s.slice(-3) + out; s = s.slice(0, -3); }
            return s + out;
        }


        // ---------- 每日一诗 ----------
        var poemIdx = -1;
        function dayOfYear(d) {
            return Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(d.getFullYear(), 0, 1)) / DAY) + 1;
        }
        function dailyPoemIndex(now) { // 按日期确定性轮换
            var seed = now.getFullYear() * 1000 + dayOfYear(now);
            return (seed * 31) % POEM_DB.length;
        }
        function poemPool() {
            var f = $('poemFilter').value || 'all';
            if (f === 'tang') return POEM_DB.filter(function (p) { return p.d === '唐'; });
            if (f === 'song') return POEM_DB.filter(function (p) { return p.d === '宋'; });
            return POEM_DB;
        }
        function renderPoem(idx) {
            var p = POEM_DB[idx];
            if (!p) return;
            poemIdx = idx;
            $('poemContent').textContent = p.c;
            $('poemTitle').textContent = '\u300A' + p.t + '\u300B';
            $('poemMeta').textContent = p.d + ' \u00B7 ' + p.a;
            $('poemCounter').textContent = '\u7B2C ' + (idx + 1) + ' / ' + POEM_DB.length + ' \u9996';
        }
        function nextPoem() {
            var pool = poemPool(), p, guard = 0, idx;
            do {
                p = pool[Math.floor(Math.random() * pool.length)];
                idx = POEM_DB.indexOf(p);
            } while (pool.length > 1 && idx === poemIdx && ++guard < 10);
            renderPoem(idx);
        }

        // ---------- 今日黄历（农历 1900-2100 查表法） ----------
        var LUNAR_INFO = [
            0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
            0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
            0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
            0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
            0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
            0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
            0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
            0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
            0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
            0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
            0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
            0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
            0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
            0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
            0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
            0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
            0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
            0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
            0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
            0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,
            0x0d520];
        function leapMonth(y) { return LUNAR_INFO[y - 1900] & 0xf; }
        function leapDays(y) { return leapMonth(y) ? ((LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29) : 0; }
        function monthDays(y, m) { return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29; }
        function yearDays(y) { var t = 348; for (var m = 1; m <= 12; m++) t += monthDays(y, m) - 29; return t + leapDays(y); }
        function dayDiff(y1, m1, d1, y2, m2, d2) {
            return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / DAY);
        }
        function solarToLunar(sy, sm, sd) { // 公历 -> {year,month,day,isLeap}
            var offset = dayDiff(1900, 1, 31, sy, sm, sd); // 1900-01-31 = 农历庚子年正月初一
            if (offset < 0 || sy > 2100) return null;
            var y = 1900;
            for (; y < 2101; y++) { var dy = yearDays(y); if (offset < dy) break; offset -= dy; }
            var leap = leapMonth(y), m = 1, inLeap = false;
            while (true) {
                var dom, curM = m, curLeap = false;
                if (leap && m === leap + 1 && !inLeap) { curM = leap; curLeap = true; dom = leapDays(y); inLeap = true; }
                else { dom = monthDays(y, m); m++; }
                if (offset < dom) return { year: y, month: curM, day: offset + 1, isLeap: curLeap };
                offset -= dom;
            }
        }
        var GAN = '\u7532\u4E59\u4E19\u4E01\u620A\u5DF1\u5E9A\u8F9B\u58EC\u7678';
        var ZHI = '\u5B50\u4E11\u5BC5\u536F\u8FB0\u5DF3\u5348\u672A\u7533\u9149\u620C\u4EA5';
        var ZODIAC = '\u9F20\u725B\u864E\u5154\u9F99\u86C7\u9A6C\u7F8A\u7334\u9E21\u72D7\u732A';
        function gz(i) { i = ((i % 60) + 60) % 60; return GAN[i % 10] + ZHI[i % 12]; }
        function dayGanzhiIndex(y, m, d) { return ((dayDiff(1900, 1, 1, y, m, d) + 10) % 60 + 60) % 60; } // 1949-10-01 = 甲子日
        var LUNAR_MN = ['\u6B63','\u4E8C','\u4E09','\u56DB','\u4E94','\u516D','\u4E03','\u516B','\u4E5D','\u5341','\u51AC','\u814A'];
        function lunarDayName(d) {
            var tens = ['\u521D','\u5341','\u5EFF','\u5345'];
            var ones = ['\u4E00','\u4E8C','\u4E09','\u56DB','\u4E94','\u516D','\u4E03','\u516B','\u4E5D','\u5341'];
            if (d === 10) return '\u521D\u5341';
            if (d === 20) return '\u4E8C\u5341';
            if (d === 30) return '\u4E09\u5341';
            return tens[Math.floor((d - 1) / 10)] + ones[(d - 1) % 10];
        }
        function lunarMonthName(m, isLeap) { return (isLeap ? '\u95F0' : '') + LUNAR_MN[m - 1] + '\u6708'; }
        function constellation(m, d) {
            var names = ['\u6469\u7FAF','\u6C34\u74F6','\u53CC\u9C7C','\u767D\u7F8A','\u91D1\u725B','\u53CC\u5B50','\u5DE8\u87F9','\u72EE\u5B50','\u5904\u5973','\u5929\u79E4','\u5929\u874E','\u5C04\u624B'];
            var bounds = [20, 19, 21, 20, 21, 22, 23, 23, 23, 24, 23, 22];
            return names[d >= bounds[m - 1] ? m % 12 : m - 1];
        }
        var YI_POOL = ['\u8BFB\u4E66','\u8FD0\u52A8','\u65E9\u7761','\u6574\u7406\u623F\u95F4','\u5B66\u70B9\u65B0\u4E1C\u897F','\u5199\u70B9\u4EC0\u4E48','\u8054\u7CFB\u8001\u670B\u53CB','\u591A\u559D\u6C34','\u51FA\u95E8\u8D70\u8D70','\u505A\u987F\u996D','\u590D\u76D8\u4ECA\u5929','\u5B58\u7B14\u5C0F\u94B1','\u5938\u5938\u522B\u4EBA','\u5C1D\u8BD5\u65B0\u4E8B\u7269','\u770B\u573A\u65E5\u843D','\u542C\u9996\u8001\u6B4C','\u6E05\u7406\u6536\u85CF\u5939','\u6CE1\u676F\u8336','\u53D1\u5446\u5341\u5206\u949F','\u5B9A\u4E2A\u5C0F\u76EE\u6807'];
        var JI_POOL = ['\u71AC\u591C','\u62D6\u5EF6','\u661F\u671F\u4E00\u5F00\u4F1A\u5C31\u53D1\u6101','\u66B4\u996E\u66B4\u98DF','\u51B2\u52A8\u6D88\u8D39','\u4E45\u5750\u4E0D\u52A8','\u5237\u624B\u673A\u5230\u51CC\u6668','\u751F\u95F7\u6C14','\u8D56\u5E8A','\u7A7A\u8179\u559D\u5496\u5561','\u7EA0\u7ED3\u8FC7\u53BB','\u8DDF\u4EBA\u62AC\u6760'];
        function pickCycle(pool, seed, count, step) { // step 与池长互质，确定性不重复
            var out = [], i = ((seed % pool.length) + pool.length) % pool.length;
            while (out.length < count) { out.push(pool[i % pool.length]); i += step; }
            return out;
        }
        function renderAlmanac(now) {
            var y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
            $('almDate').textContent = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
            var lunar = solarToLunar(y, m, d);
            if (!lunar) { $('almanacGrid').innerHTML = ''; $('yiList').textContent = ''; $('jiList').textContent = ''; return; }
            var dayGz = dayGanzhiIndex(y, m, d);
            var cells = [
                { v: lunarMonthName(lunar.month, lunar.isLeap) + lunarDayName(lunar.day), k: '\u519C\u5386' },
                { v: gz(lunar.year - 4) + '\u5E74', k: '\u5E72\u652F' },
                { v: gz(dayGz) + '\u65E5', k: '\u65E5\u67F1' },
                { v: ZODIAC[((lunar.year - 4) % 12 + 12) % 12], k: '\u751F\u8096' },
                { v: constellation(m, d), k: '\u661F\u5EA7' },
                { v: '\u5468' + '\u65E5\u4E00\u4E8C\u4E09\u56DB\u4E94\u516D'[now.getDay()], k: '\u661F\u671F' }
            ];
            $('almanacGrid').innerHTML = cells.map(function (c) {
                return '<div class="alm-cell"><div class="v">' + c.v + '</div><div class="k">' + c.k + '</div></div>';
            }).join('');
            $('yiList').innerHTML = pickCycle(YI_POOL, dayGz, 4, 7).map(function (t) { return '<span class="chip chip-yi">' + t + '</span>'; }).join('');
            $('jiList').innerHTML = pickCycle(JI_POOL, dayGz * 3 + 1, 3, 7).map(function (t) { return '<span class="chip chip-ji">' + t + '</span>'; }).join('');
        }

        // ---------- 设置与持久化 ----------
        function parseBirth(str) {
            var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || '');
            if (!m) return null;
            var d = new Date(+m[1], +m[2] - 1, +m[3]);
            return isNaN(d) ? null : d;
        }
        function applySettings() {
            var b = parseBirth($('birthInput').value);
            var e = parseInt($('expectInput').value, 10);
            if (!b) { showToast('请填写正确的出生日期'); return false; }
            if (!e || e < 1 || e > 120) { showToast('预期寿命需在 1-120 之间'); return false; }
            if (b > new Date()) { showToast('出生日期不能在未来'); return false; }
            birthDate = b; expectAge = e;
            try {
                localStorage.setItem(LSK_BIRTH, $('birthInput').value);
                localStorage.setItem(LSK_EXPECT, String(e));
            } catch (err) {}
            renderAll(new Date());
            showToast('已开始计时');
            return true;
        }
        function resetSettings() {
            try { localStorage.removeItem(LSK_BIRTH); localStorage.removeItem(LSK_EXPECT); } catch (err) {}
            $('birthInput').value = '2000-01-01';
            $('expectInput').value = '80';
            applySettings();
        }
        function loadSettings() {
            var b = null, e = null;
            try { b = localStorage.getItem(LSK_BIRTH); e = localStorage.getItem(LSK_EXPECT); } catch (err) {}
            if (b) $('birthInput').value = b;
            if (e) $('expectInput').value = e;
            var parsed = parseBirth($('birthInput').value);
            if (parsed) { birthDate = parsed; expectAge = parseInt($('expectInput').value, 10) || 80; }
        }

        // ---------- 渲染 ----------
        function pctText(p, digits) { return (p * 100).toFixed(digits); }
        function setBar(id, p) { $(id).style.width = Math.min(100, p * 100) + '%'; }
        function renderTick(now) {
            setBar('dayBar', dayProgress(now)); $('dayPct').innerHTML = pctText(dayProgress(now), 2) + '<small>%</small>';
            setBar('weekBar', weekProgress(now)); $('weekPct').innerHTML = pctText(weekProgress(now), 2) + '<small>%</small>';
            setBar('monthBar', monthProgress(now)); $('monthPct').innerHTML = pctText(monthProgress(now), 2) + '<small>%</small>';
            setBar('yearBar', yearProgress(now)); $('yearPct').innerHTML = pctText(yearProgress(now), 2) + '<small>%</small>';
            if (!birthDate) return;
            var st = lifeStats(birthDate, expectAge, now);
            $('lifePct').textContent = st.pct.toFixed(6) + '%';
            setBar('lifeBar', st.pct / 100);
            $('lifeSub').innerHTML = '已度过 <b>' + fmtInt(st.days) + '</b> 天 · <b>' + fmtInt(st.weeks) + '</b> 周' +
                ' · 还剩约 <b>' + fmtInt(st.weekendsLeft) + '</b> 个周末';
        }
        function renderStatics(now) {
            if (!birthDate) return;
            var st = lifeStats(birthDate, expectAge, now);
            $('weeksGrid').innerHTML = weeksHtml(Math.min(st.weeks, st.totalWeeks - 1), st.totalWeeks);
            $('weeksInfo').textContent = '一格一周 · ' + fmtInt(st.totalWeeks) + ' 格 · 已涂 ' + fmtInt(st.weeks) + ' 格';
            var facts = [
                { num: fmtInt(st.days), cap: '已度过的天数' },
                { num: fmtInt(st.heartbeats), cap: '心跳约这么多次' },
                { num: fmtInt(st.sleepDays), cap: '其中睡了这么多天' },
                { num: fmtInt(st.weekendsLeft), cap: '还剩的周末数' }
            ];
            var html = '';
            for (var i = 0; i < facts.length; i++) {
                html += '<div class="panel fact"><div class="num">' + facts[i].num + '</div><div class="cap">' + facts[i].cap + '</div></div>';
            }
            $('facts').innerHTML = html;
        }
        function renderAll(now) {
            renderTick(now);
            renderStatics(now);
            renderAlmanac(now);
            renderPoem(dailyPoemIndex(now));
        }

        // ---------- 启动 ----------
        loadSettings();
        renderAll(new Date());
        var lastDay = new Date().getDate();
        setInterval(function () {
            var now = new Date();
            renderTick(now);
            if (now.getDate() !== lastDay) { lastDay = now.getDate(); renderStatics(now); renderAlmanac(now); renderPoem(dailyPoemIndex(now)); } // 跨天刷新
        }, 200);
    </script>
</body>
</html>
