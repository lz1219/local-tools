<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分形浏览器</title>
    <link rel="stylesheet" href="../assets/common.css">
    <style>
        .container { max-width: none; }
        .stage-wrap {
            position: relative; border: 1px solid #dde1e6; border-radius: 10px;
            overflow: hidden; background: #000; line-height: 0;
        }
        #fractalCanvas { display: block; cursor: crosshair; width: 100%; }
        .zoom-rect {
            position: absolute; border: 1.5px dashed #fff;
            background: rgba(255,255,255,0.12); display: none; pointer-events: none;
        }
        .info-bar {
            display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
            font-size: 12px; color: #888; font-family: Consolas, monospace;
            padding: 8px 4px 0;
        }
        .progress-outer { height: 4px; background: #f0f2f5; border-radius: 2px; overflow: hidden; margin-top: 8px; }
        .progress-inner { height: 100%; background: #4a9eff; width: 0; transition: width 0.1s; }
        .ctrl-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; color: #666; }
        .ctrl-row select, .ctrl-row input[type="number"] {
            padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>分形浏览器</h1>
        <p class="subtitle">曼德博集合 · 拖拽框选放大 · 无限纵深</p>

        <div class="panel">
            <div class="ctrl-row" style="margin-bottom:12px;">
                <span>配色:
                    <select id="palette">
                        <option value="fire" selected>火焰</option>
                        <option value="ocean">深海</option>
                        <option value="rainbow">彩虹</option>
                        <option value="mono">单色</option>
                    </select>
                </span>
                <span>迭代上限: <input type="number" id="maxIter" value="300" min="50" max="3000" step="50" style="width:80px"></span>
                <button class="btn-outline btn-sm" onclick="resetView()">重置视图</button>
                <button class="btn-outline btn-sm" onclick="reRender()">重新渲染</button>
                <span style="color:#aaa">拖拽框选 = 放大该区域 · 双击 = 重置</span>
            </div>
            <div class="stage-wrap" id="stageWrap">
                <canvas id="fractalCanvas" height="520"></canvas>
                <div class="zoom-rect" id="zoomRect"></div>
            </div>
            <div class="info-bar">
                <span id="coordInfo"></span>
                <span id="zoomInfo"></span>
            </div>
            <div class="progress-outer"><div class="progress-inner" id="progress"></div></div>
        </div>
    </div>
    <div id="toast"></div>
    <script src="../assets/common.js"></script>
    <script>
        // ---- 数学核心 ----
        // 返回 {n, sm}：逃逸迭代次数 + 平滑修正（0~1）
        function mandelIter(cx, cy, maxIter) {
            var x = 0, y = 0, x2 = 0, y2 = 0;
            var i = 0;
            while (i < maxIter && x2 + y2 <= 4) {
                y = 2 * x * y + cy;
                x = x2 - y2 + cx;
                x2 = x * x; y2 = y * y;
                i++;
            }
            if (i >= maxIter) return { n: maxIter, sm: 0 };
            var logZn = Math.log(x2 + y2) / 2;
            var nu = Math.log(logZn / Math.LN2) / Math.LN2;
            return { n: i, sm: Math.max(0, 1 - nu) };
        }

        // 渐变调色板：stops = [[位置0~1, [r,g,b]], ...]，返回采样函数
        function makePalette(stops) {
            return function (t) {
                t = Math.min(0.9999, Math.max(0, t));
                for (var i = 1; i < stops.length; i++) {
                    if (t <= stops[i][0]) {
                        var p0 = stops[i - 1], p1 = stops[i];
                        var f = (t - p0[0]) / (p1[0] - p0[0] || 1);
                        return [
                            Math.round(p0[1][0] + (p1[1][0] - p0[1][0]) * f),
                            Math.round(p0[1][1] + (p1[1][1] - p0[1][1]) * f),
                            Math.round(p0[1][2] + (p1[1][2] - p0[1][2]) * f)
                        ];
                    }
                }
                return stops[stops.length - 1][1];
            };
        }

        var PALETTES = {
            fire: makePalette([[0, [0, 0, 0]], [0.25, [80, 0, 90]], [0.5, [200, 30, 30]], [0.75, [255, 160, 30]], [1, [255, 255, 220]]]),
            ocean: makePalette([[0, [0, 0, 20]], [0.3, [0, 40, 120]], [0.6, [0, 160, 200]], [0.85, [140, 240, 220]], [1, [255, 255, 255]]]),
            rainbow: makePalette([[0, [0, 0, 0]], [0.15, [120, 0, 180]], [0.35, [40, 40, 255]], [0.5, [0, 200, 120]], [0.68, [240, 220, 40]], [0.85, [255, 80, 0]], [1, [255, 240, 240]]]),
            mono: makePalette([[0, [0, 0, 0]], [1, [255, 255, 255]]])
        };

        // ---- 视图状态 ----
        var HOME = { x0: -2.6, x1: 1.0, y0: -1.25, y1: 1.25 };
        var view = { x0: HOME.x0, x1: HOME.x1, y0: HOME.y0, y1: HOME.y1 };
        var canvas, ctx, imgData;
        var renderToken = 0;

        function currentDepth() {
            return Math.log((HOME.x1 - HOME.x0) / (view.x1 - view.x0)) / Math.LN2;
        }

        function updateInfo() {
            $('coordInfo').textContent = 'Re: ' + view.x0.toFixed(16) + ' ~ ' + view.x1.toFixed(16) +
                '  Im: ' + view.y0.toFixed(16) + ' ~ ' + view.y1.toFixed(16);
            $('zoomInfo').textContent = '放大倍率 ≈ ' + Math.pow(2, currentDepth()).toExponential(2) + '×';
        }

        // 分块渲染，避免阻塞页面；token 用于取消过期任务
        function render() {
            var token = ++renderToken;
            var maxIter = Math.max(50, +$('maxIter').value || 300);
            var palette = PALETTES[$('palette').value] || PALETTES.fire;
            var w = canvas.width, h = canvas.height;
            var xStep = (view.x1 - view.x0) / w;
            var yStep = (view.y1 - view.y0) / h;
            var row = 0, CHUNK = 12;
            updateInfo();

            function step() {
                if (token !== renderToken) return;
                var end = Math.min(h, row + CHUNK);
                for (; row < end; row++) {
                    var cy = view.y0 + row * yStep;
                    var off = row * w * 4;
                    for (var px = 0; px < w; px++) {
                        var r = mandelIter(view.x0 + px * xStep, cy, maxIter);
                        var rgb;
                        if (r.n >= maxIter) rgb = [0, 0, 0];
                        else {
                            var t = (r.n + r.sm) / maxIter;
                            rgb = palette(Math.sqrt(t)); // 开方拉伸暗部细节
                        }
                        imgData.data[off + px * 4] = rgb[0];
                        imgData.data[off + px * 4 + 1] = rgb[1];
                        imgData.data[off + px * 4 + 2] = rgb[2];
                        imgData.data[off + px * 4 + 3] = 255;
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                $('progress').style.width = (row / h * 100) + '%';
                if (row < h) setTimeout(step, 0);
            }
            step();
        }

        function reRender() { render(); }

        function resetView() {
            view = { x0: HOME.x0, x1: HOME.x1, y0: HOME.y0, y1: HOME.y1 };
            render();
        }

        // 像素矩形 → 复平面矩形（保持画布纵横比）
        function rectFromDrag(x0, y0, x1, y1, w, h, v) {
            var nx0 = v.x0 + (v.x1 - v.x0) * Math.min(x0, x1) / w;
            var nx1 = v.x0 + (v.x1 - v.x0) * Math.max(x0, x1) / w;
            var ny0 = v.y0 + (v.y1 - v.y0) * Math.min(y0, y1) / h;
            var ny1 = v.y0 + (v.y1 - v.y0) * Math.max(y0, y1) / h;
            return { x0: nx0, x1: nx1, y0: ny0, y1: ny1 };
        }

        // ---- 交互 ----
        var dragging = false, startX = 0, startY = 0;

        function bindInteractions() {
            var wrap = $('stageWrap'), rect = $('zoomRect');

            canvas.addEventListener('mousedown', function (e) {
                dragging = true;
                var r = canvas.getBoundingClientRect();
                startX = e.clientX - r.left; startY = e.clientY - r.top;
            });
            window.addEventListener('mousemove', function (e) {
                if (!dragging) return;
                var r = canvas.getBoundingClientRect();
                var x = e.clientX - r.left, y = e.clientY - r.top;
                rect.style.display = 'block';
                rect.style.left = Math.min(startX, x) + 'px';
                rect.style.top = Math.min(startY, y) + 'px';
                rect.style.width = Math.abs(x - startX) + 'px';
                rect.style.height = Math.abs(y - startY) + 'px';
            });
            window.addEventListener('mouseup', function (e) {
                if (!dragging) return;
                dragging = false;
                rect.style.display = 'none';
                var r = canvas.getBoundingClientRect();
                var x = e.clientX - r.left, y = e.clientY - r.top;
                if (Math.abs(x - startX) < 8 || Math.abs(y - startY) < 8) return;
                view = rectFromDrag(startX, startY, x, y, r.width, r.height, view);
                render();
            });
            canvas.addEventListener('dblclick', resetView);
        }

        function init() {
            canvas = $('fractalCanvas');
            ctx = canvas.getContext('2d');
            var wrap = $('stageWrap');
            canvas.width = wrap.clientWidth || 960;
            canvas.height = 520;
            imgData = ctx.createImageData(canvas.width, canvas.height);
            $('palette').addEventListener('change', render);
            $('maxIter').addEventListener('change', render);
            bindInteractions();
            render();
        }

        if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
            window.addEventListener('load', init);
        }
    </script>
</body>
</html>
