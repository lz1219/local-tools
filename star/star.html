<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星空图 · 今晚的星空</title>
    <link rel="stylesheet" href="../assets/common.css">
    <style>
        :root { color-scheme: dark; }
        html, body { height: 100%; margin: 0; overflow: hidden; background: #04070f; }
        body { font-family: Inter, Roboto, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
        .layout { display: flex; height: 100vh; }
        .sky-area { position: relative; flex: 1; min-width: 0; }
        #skyCanvas { position: absolute; inset: 0; display: block; cursor: grab; touch-action: none; }
        #skyCanvas.grabbing { cursor: grabbing; }

        .head-info {
            position: absolute; top: 20px; left: 24px; z-index: 3; pointer-events: none;
            color: rgba(225, 235, 255, 0.92);
        }
        .head-info .place { font-size: 20px; font-weight: 300; letter-spacing: 2px; }
        .head-info .meta { margin-top: 6px; font-size: 12px; color: rgba(170, 190, 230, 0.65); letter-spacing: 1px; }
        .head-info .view { margin-top: 4px; font-size: 12px; color: rgba(143, 224, 255, 0.75); letter-spacing: 1px; }
        .head-info .hint { margin-top: 4px; font-size: 11px; color: rgba(140, 160, 205, 0.45); }

        .legend {
            position: absolute; left: 24px; bottom: 20px; z-index: 3; pointer-events: none;
            font-size: 11px; color: rgba(150, 170, 215, 0.55); line-height: 1.9;
        }
        .legend i { display: inline-block; width: 14px; text-align: center; font-style: normal; }

        .hover-info {
            position: absolute; z-index: 5; pointer-events: none;
            font-size: 12px; letter-spacing: 0.5px; line-height: 1.75;
            color: rgba(210, 225, 255, 0.92); background: rgba(10, 18, 32, 0.72);
            border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 10px;
            padding: 8px 14px; opacity: 0; transition: opacity 0.15s;
            backdrop-filter: blur(12px); white-space: nowrap;
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.15), 0 6px 20px rgba(0, 0, 0, 0.5);
        }
        .hover-info.show { opacity: 1; }
        .hover-info .tt-t { font-size: 12.5px; font-weight: 600; color: #fff; letter-spacing: 1px; }
        .hover-info .tt-d { font-size: 11px; color: rgba(165, 188, 230, 0.85); }

        .side {
            width: 316px; flex-shrink: 0; overflow-y: auto; overflow-x: hidden; z-index: 4;
            background: rgba(15, 25, 40, 0.42); border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 18px 30px; color: rgba(215, 227, 252, 0.92);
            backdrop-filter: blur(20px);
            transition: width 0.38s cubic-bezier(0.65, 0, 0.35, 1), padding 0.38s cubic-bezier(0.65, 0, 0.35, 1),
                        border-color 0.38s;
        }
        .side.collapsed { width: 0; padding-left: 0; padding-right: 0; border-left-color: transparent; }

        #panelToggle {
            position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 6;
            width: 26px; height: 58px; padding: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(10, 18, 32, 0.62); color: #8fe0ff; cursor: pointer;
            border: 1px solid rgba(56, 189, 248, 0.4); border-right: none;
            border-radius: 10px 0 0 10px;
            backdrop-filter: blur(12px); font-family: inherit;
            transition: background 0.2s, box-shadow 0.2s;
        }
        #panelToggle svg { transition: transform 0.32s; }
        #panelToggle:hover {
            background: rgba(56, 189, 248, 0.16);
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.4);
        }
        .side.collapsed ~ #panelToggle svg { transform: rotate(180deg); }
        .side h2 { font-size: 15px; font-weight: 600; letter-spacing: 3px; margin-bottom: 2px; }
        .side .sub { font-size: 11px; color: rgba(150, 170, 215, 0.55); margin-bottom: 14px; }
        .sec { margin-bottom: 16px; }
        .sec > h3 {
            font-size: 12px; color: rgba(140, 165, 220, 0.75); font-weight: 600;
            letter-spacing: 2px; margin-bottom: 8px;
            border-left: 3px solid rgba(90, 140, 255, 0.6); padding-left: 8px;
        }
        .side select, .side input[type="datetime-local"], .side input[type="number"] {
            width: 100%; background: rgba(255, 255, 255, 0.06); color: rgba(220, 232, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 7px;
            font-size: 12px; padding: 7px 9px; font-family: inherit;
        }
        .side select:focus, .side input:focus { outline: none; border-color: rgba(56, 189, 248, 0.7); }
        .row { display: flex; gap: 8px; margin-top: 8px; }
        .row > * { flex: 1; }
        .mini-btn {
            background: rgba(56, 189, 248, 0.06); color: rgba(174, 230, 255, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.5); border-radius: 8px;
            font-size: 12px; padding: 7px 0; cursor: pointer; font-family: inherit;
            transition: background 0.2s;
        }
        .mini-btn:hover { background: rgba(56, 189, 248, 0.14); animation: breathe 1.6s ease-in-out infinite; }
        @keyframes breathe {
            0%, 100% { box-shadow: 0 0 6px rgba(56, 189, 248, 0.35); }
            50% { box-shadow: 0 0 18px rgba(56, 189, 248, 0.8); }
        }
        .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
        .tog {
            display: flex; align-items: center; gap: 8px; font-size: 12px;
            color: rgba(195, 212, 240, 0.85); cursor: pointer; user-select: none;
        }
        .tog input { display: none; }
        .tog .sw {
            width: 28px; height: 15px; border-radius: 999px; flex-shrink: 0;
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.14);
            position: relative; transition: background 0.2s, border-color 0.2s;
        }
        .tog .sw::after {
            content: ''; position: absolute; top: 1.5px; left: 2px; width: 10px; height: 10px;
            border-radius: 50%; background: #93a7cc; transition: left 0.2s, background 0.2s;
        }
        .tog input:checked + .sw {
            background: rgba(56, 189, 248, 0.3); border-color: rgba(56, 189, 248, 0.6);
            box-shadow: inset 0 0 8px rgba(56, 189, 248, 0.35);
        }
        .tog input:checked + .sw::after { left: 14px; background: #8fe0ff; box-shadow: 0 0 8px rgba(56, 189, 248, 0.9); }
        .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .slider-row span { font-size: 12px; color: rgba(190, 205, 240, 0.8); flex-shrink: 0; }
        .slider-row b { font-size: 11px; color: rgba(150, 170, 215, 0.7); width: 28px; text-align: right; font-weight: 400; }
        .side input[type="range"] {
            -webkit-appearance: none; appearance: none; flex: 1; height: 4px; border-radius: 2px;
            background: rgba(0, 0, 0, 0.45); box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
            outline: none; cursor: pointer;
        }
        .side input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
            background: #7dd3fc; border: 2px solid #0ea5e9; box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
            cursor: pointer;
        }
        .side input[type="range"]::-moz-range-thumb {
            width: 14px; height: 14px; border-radius: 50%;
            background: #7dd3fc; border: 2px solid #0ea5e9; box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
            cursor: pointer;
        }
        #tonight { list-style: none; }
        #tonight li {
            display: flex; justify-content: space-between; gap: 8px;
            font-size: 12px; padding: 6px 2px;
            border-bottom: 1px dashed rgba(110, 150, 230, 0.12);
        }
        #tonight li.empty { color: rgba(150, 172, 220, 0.5); justify-content: center; border: none; }
        .t-name { color: rgba(225, 236, 255, 0.92); flex-shrink: 0; }
        .t-viz { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: flex-end; min-width: 0; }
        .t-bar {
            width: 74px; height: 5px; border-radius: 3px; overflow: hidden; flex-shrink: 0;
            background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
        }
        .t-bar i {
            display: block; height: 100%; border-radius: 3px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            box-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
        }
        .t-pill {
            font-size: 10px; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
            border: 1px solid rgba(125, 211, 252, 0.35); color: rgba(165, 220, 255, 0.9);
            background: rgba(56, 189, 248, 0.08);
        }
        .custom-latlon { display: none; }
        .custom-latlon.show { display: block; }
        @media (max-width: 900px) {
            .layout { flex-direction: column; }
            .side {
                width: auto; border-left: none; border-top: 1px solid rgba(110,150,230,0.14);
                transition: height 0.38s cubic-bezier(0.65, 0, 0.35, 1), padding 0.38s cubic-bezier(0.65, 0, 0.35, 1),
                            border-color 0.38s;
            }
            .side.collapsed { width: auto; height: 0; padding-top: 0; padding-bottom: 0; border-top-color: transparent; }
            #panelToggle {
                top: auto; bottom: 0; right: 16px; transform: none;
                width: 58px; height: 26px;
                border-radius: 10px 10px 0 0;
                border-right: 1px solid rgba(56, 189, 248, 0.4); border-bottom: none;
            }
            #panelToggle svg { transform: rotate(-90deg); }
            .side.collapsed ~ #panelToggle svg { transform: rotate(90deg); }
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="sky-area">
            <canvas id="skyCanvas"></canvas>
            <div class="head-info">
                <div class="place" id="headPlace">--</div>
                <div class="meta" id="headMeta">--</div>
                <div class="view" id="headView"></div>
                <div class="hint">拖动旋转天空 · 滚轮/双指缩放 · 双击飞行对准 · 悬停点亮星座</div>
            </div>
            <div class="legend">
                <div><i>·</i>恒星（颜色代表表面温度，越大越亮）</div>
                <div><i style="color:#58c7ff">—</i>星座连线　<i style="color:#ffd34d">●</i>太阳系天体　<i style="color:#8affc1">○</i>深空天体</div>
                <div><i style="color:#c6d6ff">·</i>银河光带　<i style="color:#7f8cff">·</i>赤道网格与黄道（右侧可开关）</div>
            </div>
            <div class="hover-info" id="hoverInfo"></div>
        </div>

        <div class="side">
            <h2>星空图</h2>
            <p class="sub">3232 颗恒星 · 88 星座 · 银河与行星实时推算 · 3D 漫游 · 大气闪烁</p>

            <div class="sec">
                <h3>观测地点</h3>
                <select id="citySel"></select>
                <div class="custom-latlon" id="customBox">
                    <div class="row">
                        <input type="number" id="latInput" placeholder="纬度，如 39.90" step="0.01">
                        <input type="number" id="lonInput" placeholder="经度，如 116.40" step="0.01">
                    </div>
                </div>
            </div>

            <div class="sec">
                <h3>时间</h3>
                <div class="checks" style="grid-template-columns:1fr;">
                    <label class="tog"><input type="checkbox" id="useNow" checked><span class="sw"></span>使用当前时间（实时流动）</label>
                </div>
                <div class="row">
                    <input type="datetime-local" id="timeInput" disabled>
                </div>
                <div class="row">
                    <button class="mini-btn" id="tonightBtn">跳到今晚 20:00</button>
                </div>
            </div>

            <div class="sec">
                <h3>显示</h3>
                <div class="checks">
                    <label class="tog"><input type="checkbox" id="ckLines" checked><span class="sw"></span>星座连线</label>
                    <label class="tog"><input type="checkbox" id="ckConName" checked><span class="sw"></span>星座名称</label>
                    <label class="tog"><input type="checkbox" id="ckPlanets" checked><span class="sw"></span>行星与月亮</label>
                    <label class="tog"><input type="checkbox" id="ckStarName" checked><span class="sw"></span>亮星名称</label>
                    <label class="tog"><input type="checkbox" id="ckGrid" checked><span class="sw"></span>赤道坐标网格</label>
                    <label class="tog"><input type="checkbox" id="ckEcliptic"><span class="sw"></span>黄道</label>
                    <label class="tog"><input type="checkbox" id="ckMw" checked><span class="sw"></span>银河光带</label>
                    <label class="tog"><input type="checkbox" id="ckDso" checked><span class="sw"></span>深空天体</label>
                    <label class="tog"><input type="checkbox" id="ckAtmo" checked><span class="sw"></span>大气效果</label>
                    <label class="tog"><input type="checkbox" id="ckGroundGrid" checked><span class="sw"></span>地面网格</label>
                    <label class="tog"><input type="checkbox" id="ckMeteor" checked><span class="sw"></span>流星</label>
                </div>
                <div class="slider-row">
                    <span>极限星等</span>
                    <input type="range" id="magLimit" min="2.5" max="5.6" step="0.1" value="5">
                    <b id="magVal">5.0</b>
                </div>
            </div>

            <div class="sec">
                <h3>今晚能看到什么</h3>
                <ul id="tonight"></ul>
            </div>

            <div class="row" style="margin-top:6px;">
                <button class="mini-btn" id="resetBtn">复位视角</button>
                <button class="mini-btn" id="fullBtn">全屏观看</button>
            </div>
        </div>
        <button id="panelToggle" aria-label="收起面板" title="收起面板">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </div>
    <div id="toast" style="display:none"></div>

    <script src="stardata.js"></script>
    <script src="../assets/common.js"></script>
    <script>
        // ================= 天球数学（纯函数，可测） =================

        var D2R = Math.PI / 180, R2D = 180 / Math.PI;

        function julianDay(dateMs) { return dateMs / 86400000 + 2440587.5; }

        // 格林尼治平恒星时（度）
        function gmstDeg(jd) {
            var T = (jd - 2451545.0) / 36525;
            var g = 280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T - T * T * T / 38710000;
            return ((g % 360) + 360) % 360;
        }

        // 本地恒星时（度）：经度东经为正
        function lstDeg(dateMs, lonDeg) {
            return (gmstDeg(julianDay(dateMs)) + lonDeg + 360) % 360;
        }

        // 赤道坐标 → 地平坐标；az 以正北为 0、向东顺时针
        function raDecToAltAz(raDeg, decDeg, latDeg, lst) {
            var H = (lst - raDeg + 540) % 360 - 180;
            var dec = decDeg * D2R, lat = latDeg * D2R, h = H * D2R;
            var sinAlt = Math.sin(dec) * Math.sin(lat) + Math.cos(dec) * Math.cos(lat) * Math.cos(h);
            var alt = Math.asin(Math.min(1, Math.max(-1, sinAlt))) * R2D;
            var y = -Math.cos(dec) * Math.sin(h);
            var x = Math.sin(dec) * Math.cos(lat) - Math.cos(dec) * Math.sin(lat) * Math.cos(h);
            var az = Math.atan2(y, x) * R2D;
            return { alt: alt, az: (az + 360) % 360 };
        }

        // 黄道坐标 → 赤道坐标（J2000 近似）
        function eclToEq(lonDeg, latDeg, epsDeg) {
            var l = lonDeg * D2R, b = latDeg * D2R, e = epsDeg * D2R;
            var ra = Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l));
            var dec = Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l));
            return { ra: ((ra * R2D) + 360) % 360, dec: dec * R2D };
        }

        // 解开普勒方程（弧度）
        function kepler(M, e) {
            var E = M;
            for (var i = 0; i < 8; i++) {
                E = E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
            }
            return E;
        }

        // JPL 低精度行星轨道根数（J2000，每世纪变率）
        var PLANET_ELEMENTS = {
            mercury: { a: 0.38709927, e: 0.20563593, I: 7.00497902, L: 252.25032350, W: 77.45779628, O: 48.33076593, da: 0.00000037, de: 0.00001906, dI: -0.00594749, dL: 149472.67411175, dW: 0.16047689, dO: -0.12534081 },
            venus:   { a: 0.72333566, e: 0.00677672, I: 3.39467605, L: 181.97909950, W: 131.60246718, O: 76.67984255, da: 0.00000390, de: -0.00004107, dI: -0.00078890, dL: 58517.81538729, dW: 0.00268329, dO: -0.27769418 },
            earth:   { a: 1.00000261, e: 0.01671123, I: -0.00001531, L: 100.46457166, W: 102.93768193, O: 0, da: 0.00000562, de: -0.00004392, dI: -0.01294668, dL: 35999.37244981, dW: 0.32327364, dO: 0 },
            mars:    { a: 1.52371034, e: 0.09339410, I: 1.84969142, L: -4.55343205, W: -23.94362959, O: 49.55953891, da: 0.00001847, de: 0.00007882, dI: -0.00813131, dL: 19140.30268499, dW: 0.44441088, dO: -0.29257343 },
            jupiter: { a: 5.20288700, e: 0.04838624, I: 1.30439695, L: 34.39644051, W: 14.72847983, O: 100.47390909, da: -0.00011607, de: -0.00013253, dI: -0.00183714, dL: 3034.74612775, dW: 0.21252668, dO: 0.20469106 },
            saturn:  { a: 9.53667594, e: 0.05386179, I: 2.48599187, L: 49.95424423, W: 92.59887831, O: 113.66242448, da: -0.00125060, de: -0.00050991, dI: 0.00193609, dL: 1222.49362201, dW: -0.41897216, dO: -0.28867794 },
            uranus:  { a: 19.18916464, e: 0.04725744, I: 0.77263783, L: 313.23810451, W: 170.95427630, O: 74.01692503, da: -0.00196176, de: -0.00004397, dI: -0.00242939, dL: 428.48202785, dW: 0.40805281, dO: 0.04240589 },
            neptune: { a: 30.06992276, e: 0.00859048, I: 1.77004347, L: -55.12002969, W: 44.96476227, O: 131.78422574, da: 0.00026291, de: 0.00005105, dI: 0.00035372, dL: 218.45945325, dW: -0.32241464, dO: -0.00508664 }
        };

        // 行星日心黄道直角坐标
        function heliocentric(el, T) {
            var a = el.a + el.da * T, e = el.e + el.de * T, I = (el.I + el.dI * T) * D2R;
            var L = el.L + el.dL * T, W = el.W + el.dW * T, O = el.O + el.dO * T;
            var M = ((L - W) % 360 + 360) % 360;
            var E = kepler(M * D2R, e);
            var xv = a * (Math.cos(E) - e), yv = a * Math.sqrt(1 - e * e) * Math.sin(E);
            var v = Math.atan2(yv, xv), r = Math.hypot(xv, yv);
            var w = (W - O) * D2R; O = O * D2R;
            return {
                x: r * (Math.cos(O) * Math.cos(v + w) - Math.sin(O) * Math.sin(v + w) * Math.cos(I)),
                y: r * (Math.sin(O) * Math.cos(v + w) + Math.cos(O) * Math.sin(v + w) * Math.cos(I)),
                z: r * Math.sin(v + w) * Math.sin(I)
            };
        }

        // 八大行星 + 太阳的地心赤道坐标；返回 {key, ra, dec}（J2000 平赤道，肉眼观测够用）
        function planetPositions(dateMs) {
            var T = (julianDay(dateMs) - 2451545.0) / 36525;
            var eps = 23.4393 - 0.0130 * T;
            var out = [];
            var earth = heliocentric(PLANET_ELEMENTS.earth, T);
            for (var key in PLANET_ELEMENTS) {
                if (key === 'earth') continue;
                var p = heliocentric(PLANET_ELEMENTS[key], T);
                var gx = p.x - earth.x, gy = p.y - earth.y, gz = p.z - earth.z;
                var eq = eclToEq(Math.atan2(gy, gx) * R2D, Math.asin(gz / Math.hypot(gx, gy, gz)) * R2D, eps);
                out.push({ key: key, ra: eq.ra, dec: eq.dec });
            }
            // 太阳 = 地球日心位置的反方向
            var sunLon = Math.atan2(-earth.y, -earth.x) * R2D;
            var sunLat = Math.asin(-earth.z / Math.hypot(earth.x, earth.y, earth.z)) * R2D;
            var sun = eclToEq(sunLon, sunLat, eps);
            out.push({ key: 'sun', ra: sun.ra, dec: sun.dec });
            return out;
        }

        // 月亮（Schlyter 低精度公式）：赤经赤纬 + 月相
        function moonPosition(dateMs) {
            var d = julianDay(dateMs) - 2451543.5; // 自 2000-01-00 的天数
            var N = (125.1228 - 0.0529538083 * d) % 360;
            var i = 5.1454;
            var w = (318.0634 + 0.1643573223 * d) % 360;
            var a = 60.2666, e = 0.054900;
            var M = ((115.3654 + 13.0649929509 * d) % 360 + 360) % 360;
            var E0 = M + R2D * e * Math.sin(M * D2R) * (1 + e * Math.cos(M * D2R));
            var xv = a * (Math.cos(E0 * D2R) - e);
            var yv = a * Math.sqrt(1 - e * e) * Math.sin(E0 * D2R);
            var v = Math.atan2(yv, xv) * R2D, r = Math.hypot(xv, yv);
            var u = (v + w) % 360;
