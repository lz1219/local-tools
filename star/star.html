            { name: 'NGC869 双星团', ra: 34.75, dec: 57.13, r: 1.4 },
            { name: 'ω 半人马星团', ra: 201.70, dec: -47.48, r: 2.0 }
        ];

        // ================= 渲染 =================

        var canvas, ctx, W = 0, H = 0;
        var hoverEl = null;
        var state = {
            lat: 39.90, lon: 116.40, place: '北京',
            useNow: true, fixedMs: Date.now(),
            lines: true, conName: true, planets: true, starName: true,
            grid: true, ecliptic: false, mw: true, dso: true, atmo: true,
            groundGrid: true, meteor: true,
            magLimit: 5.0
        };
        var view = { yaw: 180, pitch: 18, fov: 75 };
        var cache = {
            sec: -1, lat: null, lon: null,
            stars: null, consts: null, planets: null, moon: null, dso: null,
            mw: null, grid: null, ecl: null, sunAlt: 0, sunAz: 0
        };
        var sprites = {};
        var mouse = { x: -1, y: -1 };
        var pointers = null;
        var dragging = false, pinchPrev = 0;
        var vel = { x: 0, y: 0 };
        var lastInteract = 0, userInteracted = false, introT = 0;
        var frameCands = [], placedLabels = [];
        var camNow = null, kNow = 0, fovNow = 75, zsc = 1;
        var meteors = [], lastFrameMs = 0, dragFov = 0;
        var fly = null, hoverConId = '', lastViewUpd = 0;

        function bvColor(bv) {
            if (bv <= -0.05) return '#cfe0ff';
            if (bv <= 0.15) return '#ffffff';
            if (bv <= 0.45) return '#fff7e8';
            if (bv <= 0.9) return '#ffe8c4';
            if (bv <= 1.4) return '#ffd2a8';
            return '#ffb498';
        }

        function mix3(c1, c2, t) {
            return [Math.round(c1[0] + (c2[0] - c1[0]) * t),
                    Math.round(c1[1] + (c2[1] - c1[1]) * t),
                    Math.round(c1[2] + (c2[2] - c1[2]) * t)];
        }

        function rgb(c, a) {
            return a === undefined ? 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'
                                   : 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
        }

        function starSprite(color, size) {
            var key = color + size.toFixed(1);
            if (sprites[key]) return sprites[key];
            var pad = 4;
            var c = document.createElement('canvas');
            var d = Math.ceil((size + pad) * 2);
            c.width = c.height = d;
            var g = c.getContext('2d');
            var grad = g.createRadialGradient(d / 2, d / 2, 0, d / 2, d / 2, size + pad);
            grad.addColorStop(0, color);
            grad.addColorStop(Math.min(0.6, size / (size + pad)), color);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            g.fillStyle = grad;
            g.fillRect(0, 0, d, d);
            sprites[key] = c;
            return c;
        }

        function resize() {
            var rect = canvas.parentElement.getBoundingClientRect();
            W = Math.max(1, rect.width);
            H = Math.max(1, rect.height);
            var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            cache.sec = -1;
        }

        function curTimeMs() { return state.useNow ? Date.now() : state.fixedMs; }

        // 恒星时/经纬度每秒变化才重算全天方向向量缓存
        function ensureAltAz() {
            var t = curTimeMs();
            var sec = Math.floor(t / 1000);
            if (sec === cache.sec && cache.lat === state.lat && cache.lon === state.lon) return;
            cache.sec = sec; cache.lat = state.lat; cache.lon = state.lon;
            var lst = lstDeg(t, state.lon);
            var data = (typeof STAR_DATA !== 'undefined') ? STAR_DATA : { stars: [], lines: {}, starNames: {}, starZh: {} };

            cache.stars = [];
            for (var i = 0; i < data.stars.length; i++) {
                var s = data.stars[i];
                var aa = raDecToAltAz(s[0], s[1], state.lat, lst);
                if (aa.alt < -30) continue;
                cache.stars.push({ v: altAzToVec(aa.alt, aa.az), alt: aa.alt, mag: s[2], bv: s[3], idx: i });
            }

            cache.consts = [];
            for (var id in data.lines) {
                var c = data.lines[id];
                var aaA = raDecToAltAz(c.anchor[0], c.anchor[1], state.lat, lst);
                var polys = [];
                for (var k = 0; k < c.polys.length; k++) {
                    var flat = c.polys[k], vecs = [], alts = [];
                    for (var j = 0; j < flat.length; j += 2) {
                        var aa2 = raDecToAltAz(flat[j], flat[j + 1], state.lat, lst);
                        vecs.push(altAzToVec(aa2.alt, aa2.az));
                        alts.push(aa2.alt);
                    }
                    polys.push({ vecs: vecs, alts: alts });
                }
                cache.consts.push({
                    id: id, zh: c.zh, la: c.la, polys: polys,
                    alt: aaA.alt, az: aaA.az, av: altAzToVec(aaA.alt, aaA.az)
                });
            }

            cache.planets = [];
            var pos = planetPositions(t);
            for (var n = 0; n < pos.length; n++) {
                var info = PLANET_INFO[pos[n].key];
                var aa3 = raDecToAltAz(pos[n].ra, pos[n].dec, state.lat, lst);
                cache.planets.push({
                    key: pos[n].key, zh: info.zh, color: info.color, mag: info.mag,
                    alt: aa3.alt, az: aa3.az, v: altAzToVec(aa3.alt, aa3.az)
                });
            }
            cache.sunAlt = 0; cache.sunAz = 0;
            for (var m = 0; m < cache.planets.length; m++) {
                if (cache.planets[m].key === 'sun') {
                    cache.sunAlt = cache.planets[m].alt;
                    cache.sunAz = cache.planets[m].az;
                }
            }

            var moon = moonPosition(t);
            var aaM = raDecToAltAz(moon.ra, moon.dec, state.lat, lst);
            cache.moon = {
                age: moon.age, illum: moon.illum,
                alt: aaM.alt, az: aaM.az, v: altAzToVec(aaM.alt, aaM.az)
            };

            cache.dso = [];
            for (var q = 0; q < DSOS.length; q++) {
                var aa4 = raDecToAltAz(DSOS[q].ra, DSOS[q].dec, state.lat, lst);
                if (aa4.alt < -12) continue;
                cache.dso.push({
                    name: DSOS[q].name, r: DSOS[q].r,
                    alt: aa4.alt, az: aa4.az, v: altAzToVec(aa4.alt, aa4.az)
                });
            }

            cache.mw = [];
            var mw = buildMilkyWay();
            for (var w = 0; w < mw.length; w++) {
                var aaW = raDecToAltAz(mw[w].ra, mw[w].dec, state.lat, lst);
                cache.mw.push({
                    v: altAzToVec(aaW.alt, aaW.az), alt: aaW.alt,
                    a: mw[w].a, s: mw[w].s, col: mw[w].col
                });
            }

            cache.noise = [];
            var noise = buildNoiseStars();
            for (var w2 = 0; w2 < noise.length; w2++) {
                var aaN = raDecToAltAz(noise[w2].ra, noise[w2].dec, state.lat, lst);
                cache.noise.push({ v: altAzToVec(aaN.alt, aaN.az), alt: aaN.alt, a: noise[w2].a, s: noise[w2].s });
            }

            cache.neb = [];
            var nebs = buildNebulae();
            for (var w3 = 0; w3 < nebs.length; w3++) {
                var aaB = raDecToAltAz(nebs[w3].ra, nebs[w3].dec, state.lat, lst);
                cache.neb.push({
                    v: altAzToVec(aaB.alt, aaB.az), alt: aaB.alt,
                    r: nebs[w3].r, a: nebs[w3].a, col: nebs[w3].col
                });
            }

            cache.grid = [];
            var grid = eqGrid();
            for (var g = 0; g < grid.length; g++) {
                var vecs2 = [];
                for (var g2 = 0; g2 < grid[g].pts.length; g2++) {
                    var aaG = raDecToAltAz(grid[g].pts[g2][0], grid[g].pts[g2][1], state.lat, lst);
                    vecs2.push(altAzToVec(aaG.alt, aaG.az));
                }
                cache.grid.push({ vecs: vecs2, eq: grid[g].eq });
            }

            var ecl = eclipticPolyline();
            cache.ecl = [];
            for (var e2 = 0; e2 < ecl.pts.length; e2++) {
                var aaE = raDecToAltAz(ecl.pts[e2][0], ecl.pts[e2][1], state.lat, lst);
                cache.ecl.push(altAzToVec(aaE.alt, aaE.az));
            }

            updateHeadAndTonight(t);
        }

        // 折线绘制：逐段投影，任一端在相机身后则断开（3D 投影天然处理赤经 0/360 环绕）
        function strokeVecPoly(vecs, color, width, alpha, dash) {
            if (alpha <= 0.01) return;
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.globalAlpha = alpha;
            if (dash) ctx.setLineDash(dash);
            ctx.beginPath();
            var prev = projectVec(vecs[0], camNow, W, H, view.fov);
            for (var i = 1; i < vecs.length; i++) {
                var cur = projectVec(vecs[i], camNow, W, H, view.fov);
                if (prev && cur) {
                    ctx.moveTo(prev.x, prev.y);
                    ctx.lineTo(cur.x, cur.y);
                }
                prev = cur;
            }
            ctx.stroke();
            if (dash) ctx.setLineDash([]);
            ctx.globalAlpha = 1;
        }

        function drawMoon(x, y, r) {
            var mr = r || 9;
            var ph = cache.moon.age / 29.530588853; // 0 新月 0.5 满月
            var k2 = Math.cos(2 * Math.PI * ph);
            ctx.save();
            ctx.beginPath(); ctx.arc(x, y, mr, 0, Math.PI * 2);
            ctx.fillStyle = '#3a3f4d'; ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x, y, Math.max(Math.abs(k2) * mr, 0.4), mr, 0, 0, Math.PI * 2);
            ctx.clip();
            ctx.beginPath();
            ctx.arc(x - Math.sin(2 * Math.PI * ph) * mr, y, mr, 0, Math.PI * 2);
            ctx.fillStyle = '#f4f6ff'; ctx.fill();
            ctx.restore();
            ctx.beginPath(); ctx.arc(x, y, mr + 2.5, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(200,210,240,0.25)'; ctx.lineWidth = 1; ctx.stroke();
        }

        // 标签碰撞占位：行星 > 星座 > 亮星，后来的自动避让
        function labelFree(x, y, w, h) {
            for (var i = 0; i < placedLabels.length; i++) {
                var p = placedLabels[i];
                if (x < p.x + p.w && x + w > p.x && y < p.y + p.h && y + h > p.y) return false;
            }
            placedLabels.push({ x: x, y: y, w: w, h: h });
            return true;
        }

        function draw() {
            ensureAltAz();
            handleMotion(Date.now());
            // 拖动速度带出轻微视场扩张（速度感），全部投影统一走 fovNow
            var speed = Math.abs(vel.x) + Math.abs(vel.y);
            dragFov += (Math.min(9, speed * 12) - dragFov) * 0.12;
            fovNow = Math.min(118, view.fov + (dragging ? dragFov : dragFov * 0.6));
            camNow = camBasis(view.yaw, view.pitch);
            kNow = (H / 2) / Math.tan(fovNow * D2R / 2);
            zsc = Math.min(2.2, Math.max(0.7, Math.sqrt(Math.tan(75 * D2R / 2) / Math.tan(fovNow * D2R / 2))));
            // 快速拖动/甩动时进入"曲速"状态：恒星拖出短光线（位置 = 数帧前的相机投影）
            var warpK = clamp01((speed - 0.3) / 1.0);
            var prevCam = null;
            if (warpK > 0.03) {
                prevCam = camBasis(view.yaw - vel.x * 4,
                    Math.max(-89, Math.min(89, view.pitch - vel.y * 4)));
            }
            var t = curTimeMs();
            var dtMs = Math.min(100, Math.max(0, t - lastFrameMs));
            lastFrameMs = t;
            // 朝向/视场读数（约 5 次/秒，避免每帧写 DOM）
            if (t - lastViewUpd > 200) {
                lastViewUpd = t;
                var hv = document.getElementById('headView');
                if (hv) hv.textContent = '朝向 ' + azText(view.yaw) + ' · 视场 ' + Math.round(view.fov) + '°' +
                    (warpK > 0.03 ? ' · 曲速中' : '');
            }
            var dayK = clamp01((cache.sunAlt + 3) / 7);
            var darkK = 1 - dayK;
            frameCands = [];
            placedLabels = [];

            // 1. 天空背景：中心 #0B101E → 边缘 #05070A 的径向渐变（白天混入天蓝）
            var bgR = Math.max(W, H) * 0.75;
            var bg = ctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, bgR);
            bg.addColorStop(0, rgb(mix3([11, 16, 30], [96, 150, 205], dayK)));
            bg.addColorStop(0.65, rgb(mix3([8, 11, 22], [130, 170, 215], dayK)));
            bg.addColorStop(1, rgb(mix3([5, 7, 10], [172, 200, 230], dayK)));
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            // 2. 暗弱星云（加色）+ 噪点暗星：天空纹理层
            if (darkK > 0.04) {
                ctx.globalCompositeOperation = 'lighter';
                for (var nb = 0; nb < cache.neb.length; nb++) {
                    var ne = cache.neb[nb];
                    var prN = projectVec(ne.v, camNow, W, H, fovNow);
                    if (!prN) continue;
                    var nr = Math.min(330, ne.r * zsc);
                    var na = ne.a * darkK * (ne.alt < 0 ? 0.3 : 1);
                    var ng = ctx.createRadialGradient(prN.x, prN.y, 0, prN.x, prN.y, nr);
                    ng.addColorStop(0, rgb(ne.col, na));
                    ng.addColorStop(1, rgb(ne.col, 0));
                    ctx.fillStyle = ng;
                    ctx.beginPath(); ctx.arc(prN.x, prN.y, nr, 0, Math.PI * 2); ctx.fill();
                }
                ctx.globalCompositeOperation = 'source-over';
                for (var ns = 0; ns < cache.noise.length; ns++) {
                    var nst = cache.noise[ns];
                    if (nst.alt < -8) continue;
                    var prS = projectVec(nst.v, camNow, W, H, fovNow);
                    if (!prS) continue;
                    ctx.fillStyle = 'rgba(210,222,255,' + (nst.a * darkK * (nst.alt < 0 ? 0.2 : 1)).toFixed(3) + ')';
                    var nsz = Math.max(0.6, nst.s * Math.min(zsc, 1.5));
                    ctx.fillRect(prS.x - nsz / 2, prS.y - nsz / 2, nsz, nsz);
                }
            }

            // 3. 晨昏暖光：太阳附近辉光，落到地平线下仍残留
            if (state.atmo && darkK > 0.05) {
                var twA = clamp01((cache.sunAlt + 12) / 14) * clamp01((9 - cache.sunAlt) / 18);
                if (twA > 0.01) {
                    var sunPr = projectVec(altAzToVec(Math.max(cache.sunAlt, -9), cache.sunAz), camNow, W, H, fovNow);
                    if (sunPr) {
                        var rg = ctx.createRadialGradient(sunPr.x, sunPr.y, 0, sunPr.x, sunPr.y, W * 0.55);
                        rg.addColorStop(0, 'rgba(255,150,70,' + (twA * 0.4 * darkK) + ')');
                        rg.addColorStop(1, 'rgba(255,150,70,0)');
                        ctx.fillStyle = rg;
                        ctx.fillRect(0, 0, W, H);
                    }
                }
            }

            // 4. 银河光带（加色混合，光晕与星点两层；随缩放增亮增大）
            if (state.mw && darkK > 0.04) {
                ctx.globalCompositeOperation = 'lighter';
                for (var w = 0; w < cache.mw.length; w++) {
                    var p = cache.mw[w];
                    var pr = projectVec(p.v, camNow, W, H, fovNow);
                    if (!pr) continue;
                    var a = Math.min(0.85, p.a * darkK * (0.7 + 0.3 * zsc));
                    if (p.alt < 0) a *= 0.25;
                    else if (state.atmo) a *= 0.3 + 0.7 * clamp01((p.alt + 2) / 25);
                    if (a < 0.01) continue;
                    var s = p.s * zsc;
                    // 光晕层
                    ctx.fillStyle = 'rgba(' + p.col + ',' + (a * 0.35).toFixed(3) + ')';
                    ctx.fillRect(pr.x - s, pr.y - s, s * 2, s * 2);
                    // 星点层
                    ctx.fillStyle = 'rgba(' + p.col + ',' + a.toFixed(3) + ')';
                    ctx.fillRect(pr.x - s / 2, pr.y - s / 2, s, s);
                }
                ctx.globalCompositeOperation = 'source-over';
            }

            // 4. 赤道坐标网格（5 条赤纬圈 + 12 条赤经线）
            if (state.grid && darkK > 0.04) {
                for (var g = 0; g < cache.grid.length; g++) {
                    var gl = cache.grid[g];
                    strokeVecPoly(gl.vecs, 'rgba(140,165,230,1)', gl.eq ? 1.2 : 0.8,
                        (gl.eq ? 0.2 : 0.1) * darkK);
                }
            }

            // 5. 黄道
            if (state.ecliptic && darkK > 0.15) {
                strokeVecPoly(cache.ecl, 'rgba(127,140,255,1)', 1, 0.4 * darkK, [4, 5]);
            }

            // 6. 星座连线（40% 透明科幻虚线 + 流动动画 + 底层辉光）
            if (state.lines) {
                var dashOff = -((t / 45) % 22);
                for (var c = 0; c < cache.consts.length; c++) {
                    var con = cache.consts[c];
                for (var k = 0; k < con.polys.length; k++) {
                    var poly = con.polys[k];
                    // 悬停的恒星所属星座：整条连线点亮为实心高亮
                    var hl = hoverConId && con.id === hoverConId;
                    // 底层辉光（实线、粗、极淡）
                    ctx.strokeStyle = hl ? 'rgba(120,225,255,0.32)' : 'rgba(88,199,255,0.08)';
                    ctx.lineWidth = hl ? 6.5 : 4.5;
                        ctx.setLineDash([]);
                        ctx.beginPath();
                        var prev2 = projectVec(poly.vecs[0], camNow, W, H, fovNow);
                        for (var j2 = 1; j2 < poly.vecs.length; j2++) {
                            var cur2 = projectVec(poly.vecs[j2], camNow, W, H, fovNow);
                            if (prev2 && cur2) {
                                ctx.moveTo(prev2.x, prev2.y);
                                ctx.lineTo(cur2.x, cur2.y);
                            }
                            prev2 = cur2;
                        }
                        ctx.stroke();
                        // 流动虚线主层
                        ctx.strokeStyle = hl ? 'rgba(150,235,255,0.95)' : 'rgba(96,205,255,0.42)';
                        ctx.lineWidth = hl ? 1.9 : 1.2;
                        ctx.setLineDash(hl ? [] : [7, 8]);
                        ctx.lineDashOffset = dashOff;
                        ctx.beginPath();
                        prev2 = projectVec(poly.vecs[0], camNow, W, H, fovNow);
                        for (var j3 = 1; j3 < poly.vecs.length; j3++) {
                            var cur3 = projectVec(poly.vecs[j3], camNow, W, H, fovNow);
                            if (prev2 && cur3) {
                                ctx.moveTo(prev2.x, prev2.y);
                                ctx.lineTo(cur3.x, cur3.y);
                            }
                            prev2 = cur3;
                        }
                        ctx.stroke();
                    }
                }
                ctx.setLineDash([]);
                ctx.lineDashOffset = 0;
            }

            // 7. 恒星（全星域大气闪烁：双频扰动 + 偶发尖峰，低空更强；一等星带衍射芒）
            var data = (typeof STAR_DATA !== 'undefined') ? STAR_DATA : { stars: [], starNames: {}, starZh: {} };
            var magEff = Math.min(5.6, state.magLimit + (75 - view.fov) / 22);
            var tw = t / 1000;
            var TWK = buildTwinkle(data.stars.length);
            for (var i = 0; i < cache.stars.length; i++) {
                var s = cache.stars[i];
                if (s.mag > magEff) continue;
                var pr3 = projectVec(s.v, camNow, W, H, fovNow);
                if (!pr3) continue;
                if (s.mag <= 3.2) frameCands.push({ x: pr3.x, y: pr3.y, kind: 'star', ref: s });
                var bright = state.magLimit + 1.2 - s.mag;
                var size = Math.min(6, Math.max(0.5, bright * 1.15)) * zsc;
                var alpha = Math.min(1, Math.max(0.35, bright / 2.4)) * darkK;
                if (s.alt < 0) alpha *= 0.35;
                else if (state.atmo) alpha *= 0.25 + 0.75 * clamp01((s.alt + 2) / 25);
                if (alpha < 0.02) continue;
                var color = bvColor(s.bv);
                var twk = 1;
                if (state.atmo && s.alt > -0.5) {
                    var f1 = TWK.f1[s.idx], p1 = TWK.p1[s.idx], p2 = TWK.p2[s.idx];
                    var v = 0.6 * Math.sin(tw * f1 + p1) + 0.4 * Math.sin(tw * f1 * 2.63 + p2);
                    var spike = Math.pow(Math.max(0, Math.sin(tw * f1 * 0.37 + p1 * 2.1)), 12);
                    var amp = (0.08 + 0.5 * clamp01(1 - s.alt / 55)) * Math.min(1.5, Math.max(0.25, 1.55 - s.mag * 0.38));
                    twk = 1 - amp * 0.55 + amp * (0.55 * v + spike);
                }
                var size2 = size * (1 + (twk - 1) * 0.3);
                var spr = starSprite(color, Math.max(0.75, Math.round(size2 * 2) / 2));
                ctx.globalAlpha = alpha * twk;
                var hw = spr.width / 2;
                ctx.drawImage(spr, pr3.x - hw, pr3.y - hw);
                // 曲速拖尾：向数帧前的投影位置拉短光线
                if (prevCam) {
                    var prW = projectVec(s.v, prevCam, W, H, fovNow);
                    if (prW) {
                        ctx.globalAlpha = alpha * twk * warpK * 0.5;
                        ctx.strokeStyle = color;
                        ctx.lineWidth = Math.max(0.5, size * 0.45);
                        ctx.beginPath();
                        ctx.moveTo(prW.x, prW.y);
                        ctx.lineTo(pr3.x, pr3.y);
                        ctx.stroke();
                    }
                }
                // 一等亮星：屏幕对齐衍射芒（随闪烁呼吸）
                if (s.mag <= 0.5 && s.alt > 3) {
                    var L = size * 4.5 + 6;
                    ctx.globalAlpha = alpha * twk * 0.3;
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(pr3.x - L, pr3.y); ctx.lineTo(pr3.x + L, pr3.y);
                    ctx.moveTo(pr3.x, pr3.y - L); ctx.lineTo(pr3.x, pr3.y + L);
                    ctx.stroke();
                }
            }
            ctx.globalAlpha = 1;

            // 7.5 流星（夜间偶发，加色拖尾）
            if (state.meteor && darkK > 0.5) stepMeteors(t, dtMs, darkK);

            // 8. 深空天体
            if (state.dso) {
                for (var d = 0; d < cache.dso.length; d++) {
                    var o = cache.dso[d];
                    var pr4 = projectVec(o.v, camNow, W, H, fovNow);
                    if (!pr4) continue;
                    frameCands.push({ x: pr4.x, y: pr4.y, kind: 'dso', ref: o });
                    var rr = o.r * 2.2 * zsc;
                    var g2 = ctx.createRadialGradient(pr4.x, pr4.y, 0, pr4.x, pr4.y, rr);
                    g2.addColorStop(0, 'rgba(140,255,200,' + (0.3 * darkK) + ')');
                    g2.addColorStop(1, 'rgba(140,255,200,0)');
                    ctx.fillStyle = g2;
                    ctx.beginPath(); ctx.arc(pr4.x, pr4.y, rr, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = 'rgba(140,255,200,' + (0.4 * darkK) + ')';
                    ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.ellipse(pr4.x, pr4.y, rr, rr * 0.6, -0.5, 0, Math.PI * 2); ctx.stroke();
                }
            }

            // 9. 太阳系天体（太阳在地平线下 1.5° 内仍画，营造晨昏）
            if (state.planets) {
                for (var n = 0; n < cache.planets.length; n++) {
                    var pl = cache.planets[n];
                    if (pl.key === 'sun' && cache.sunAlt < -1.5) continue;
                    if (pl.key !== 'sun' && pl.alt < -2) continue;
                    var pr5 = projectVec(pl.v, camNow, W, H, fovNow);
                    if (!pr5) continue;
                    frameCands.push({ x: pr5.x, y: pr5.y, kind: 'planet', ref: pl });
                    var pr2 = (pl.key === 'sun' ? 7 : Math.min(6, Math.max(2.6, (6 - pl.mag) * 0.9))) * zsc;
                    var pg = ctx.createRadialGradient(pr5.x, pr5.y, 0, pr5.x, pr5.y, pr2 * 2.6);
                    pg.addColorStop(0, pl.color);
                    pg.addColorStop(0.4, pl.color + 'aa');
                    pg.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = pg;
                    ctx.beginPath(); ctx.arc(pr5.x, pr5.y, pr2 * 2.6, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = pl.color;
                    ctx.beginPath(); ctx.arc(pr5.x, pr5.y, pr2, 0, Math.PI * 2); ctx.fill();
                    if (pl.key === 'saturn') {
                        ctx.strokeStyle = 'rgba(240,219,168,0.75)';
                        ctx.lineWidth = 1.6;
                        ctx.beginPath(); ctx.ellipse(pr5.x, pr5.y, pr2 * 1.9, pr2 * 0.6, -0.4, 0, Math.PI * 2); ctx.stroke();
                    }
                }
                if (cache.moon.alt > -2) {
                    var prM = projectVec(cache.moon.v, camNow, W, H, fovNow);
                    if (prM) {
                        frameCands.push({ x: prM.x, y: prM.y, kind: 'moon', ref: cache.moon });
                        drawMoon(prM.x, prM.y, Math.min(15, 9 * Math.pow(zsc, 0.7)));
                    }
                }
            }

            // 10. 地面（透视下地平线恒为直线）：渐变 + 远山近丘剪影 + 透视网格
            drawGround(dayK);

            // 11. 边缘暗角（增强沉浸感）
            var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.78);
            vg.addColorStop(0, 'rgba(0,0,0,0)');
            vg.addColorStop(1, 'rgba(2,3,8,' + (0.32 * darkK + 0.1) + ')');
            ctx.fillStyle = vg;
            ctx.fillRect(0, 0, W, H);

            // 12. 标签（行星 > 星座 > 亮星）
            drawLabels(data);

            // 13. 罗盘 + 悬停
            drawCompass();
            drawHover();
        }

        // 流星：头亮点 + 渐隐拖尾，沿大圆弧插值运动
        function stepMeteors(t, dtMs, darkK) {
            if (meteors.length < 3 && Math.random() * 9000 < dtMs) spawnMeteor(t);
            ctx.globalCompositeOperation = 'lighter';
            for (var i = meteors.length - 1; i >= 0; i--) {
                var m = meteors[i];
                var tau = (t - m.born) / m.dur;
                if (tau >= 1 || tau < 0) { meteors.splice(i, 1); continue; }
                var env = Math.sin(Math.PI * tau);
                var hx = m.sx + (m.ex - m.sx) * tau;
                var hy = m.sy + (m.ey - m.sy) * tau;
                var hz = m.sz + (m.ez - m.sz) * tau;
                var hl = Math.hypot(hx, hy, hz); hx /= hl; hy /= hl; hz /= hl;
                var hp = projectVec([hx, hy, hz], camNow, W, H, fovNow);
                if (!hp) continue;
                for (var k2 = 0; k2 < 9; k2++) {
                    var tau2 = tau - k2 * 0.028;
                    if (tau2 < 0) break;
                    var qx = m.sx + (m.ex - m.sx) * tau2;
                    var qy = m.sy + (m.ey - m.sy) * tau2;
                    var qz = m.sz + (m.ez - m.sz) * tau2;
                    var ql = Math.hypot(qx, qy, qz); qx /= ql; qy /= ql; qz /= ql;
                    var pp = projectVec([qx, qy, qz], camNow, W, H, fovNow);
                    if (!pp) break;
                    var a2 = env * (1 - k2 / 9) * 0.55 * darkK;
                    if (k2 === 0) {
                        ctx.fillStyle = 'rgba(255,255,255,' + a2.toFixed(3) + ')';
                        ctx.beginPath(); ctx.arc(pp.x, pp.y, 1.8, 0, Math.PI * 2); ctx.fill();
                    } else {
                        ctx.strokeStyle = 'rgba(200,220,255,' + a2.toFixed(3) + ')';
                        ctx.lineWidth = 1.4;
                        ctx.beginPath(); ctx.moveTo(hp.x, hp.y); ctx.lineTo(pp.x, pp.y); ctx.stroke();
                    }
                }
            }
            ctx.globalCompositeOperation = 'source-over';
        }

        function spawnMeteor(t) {
            var az = view.yaw + (Math.random() - 0.5) * view.fov * 1.2;
            var alt = 35 + Math.random() * 40;
            var s = altAzToVec(alt, az);
            var e = altAzToVec(alt - 10 - Math.random() * 8, az + (Math.random() - 0.5) * 25);
            meteors.push({
                sx: s[0], sy: s[1], sz: s[2],
                ex: e[0], ey: e[1], ez: e[2],
                born: t, dur: 450 + Math.random() * 500
            });
        }

        // 地面：相机位于天球中心，alt=0 的大圆平面过投影中心，透视下地平线恒为一条直线 y = H/2 + k·tan(pitch)
        function drawGround(dayK) {
            var yH = H / 2 + kNow * Math.tan(view.pitch * D2R);
            if (yH >= H) return; // 视线全部在地平线上，无地面
            var y0 = Math.max(yH, -4);
            var g = ctx.createLinearGradient(0, y0, 0, H);
            g.addColorStop(0, rgb(mix3([18, 24, 40], [104, 116, 98], dayK), 0.92));
            g.addColorStop(0.3, rgb(mix3([10, 15, 28], [80, 92, 80], dayK), 0.95));
            g.addColorStop(1, rgb(mix3([5, 8, 16], [56, 66, 56], dayK), 0.98));
            ctx.fillStyle = g;
            ctx.fillRect(0, y0, W, H - y0);

            // 地平线上的大气光带（太阳越低越暖）
            var twA = clamp01((cache.sunAlt + 12) / 12);
            ctx.fillStyle = 'rgba(255,160,80,' + (twA * 0.24 * (1 - dayK * 0.6)) + ')';
            ctx.fillRect(0, yH - 1, W, 2);
            ctx.fillStyle = 'rgba(140,170,235,0.35)';
            ctx.fillRect(0, yH - 0.5, W, 1);

            // 远山 / 近丘剪影（大气透视：远山更亮更蓝）
            drawSkyline(0, dayK);
            drawSkyline(1, dayK);

            // 地面透视网格（1.7m 眼高，对数径向线 + 距离环）
            if (state.groundGrid && yH < H) drawGroundGrid(dayK);

            // 方位刻度 + 基点字母
            if (yH > 26 && yH < H - 4) {
                ctx.font = '11px "Microsoft YaHei", sans-serif';
                ctx.textAlign = 'center';
                for (var az = 0; az < 360; az += 30) {
                    var pr = projectVec(altAzToVec(0, az), camNow, W, H, fovNow);
                    if (!pr || pr.x < -20 || pr.x > W + 20) continue;
                    var major = az % 90 === 0;
                    ctx.beginPath();
                    ctx.moveTo(pr.x, yH - (major ? 8 : 4));
                    ctx.lineTo(pr.x, yH);
                    ctx.strokeStyle = 'rgba(150,180,240,' + (major ? 0.55 : 0.25) + ')';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    if (major) {
                        ctx.fillStyle = az === 0 ? 'rgba(255,150,130,0.9)' : 'rgba(195,212,250,0.9)';
                        ctx.fillText(['北', '东', '南', '西'][az / 90], pr.x, yH - 13);
                    }
                }
                ctx.textAlign = 'left';
            }

            // 天顶 / 天底标注
            var zt = projectVec([0, 1, 0], camNow, W, H, fovNow);
            if (zt) {
                ctx.font = '10px "Microsoft YaHei", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillStyle = 'rgba(150,170,215,0.5)';
                ctx.fillText('天顶', zt.x, zt.y - 8);
                ctx.textAlign = 'left';
            }
        }

        // 天际线剪影层：layer 0 远山（亮蓝），layer 1 近丘（暗）
        function drawSkyline(layer, dayK) {
            var col = layer === 0 ? mix3([30, 40, 62], [150, 160, 170], dayK)
                                  : mix3([11, 16, 30], [88, 98, 94], dayK);
            ctx.fillStyle = rgb(col, 0.97);
            ctx.beginPath();
            var started = false, firstX = 0, lastX = 0, lastY = 0;
            for (var az = 0; az <= 360; az += 1.5) {
                var alt = skylineElev(az % 360, layer);
                var pr = projectVec(altAzToVec(alt, az), camNow, W, H, fovNow);
                if (!pr || pr.x < -W || pr.x > 2 * W) { started = false; continue; }
                if (!started) {
                    ctx.moveTo(pr.x, pr.y);
                    started = true; firstX = pr.x;
                } else {
                    ctx.lineTo(pr.x, pr.y);
                }
                lastX = pr.x; lastY = pr.y;
            }
            if (started) {
                ctx.lineTo(lastX, H + 60);
                ctx.lineTo(firstX, H + 60);
                ctx.closePath();
                ctx.fill();
            }
        }

        // 地面透视网格：径向线随距离渐隐，距离环近亮远暗
        function drawGroundGrid(dayK) {
            var gg = buildGroundGrid();
            var a0 = 0.1 * (1 - dayK * 0.7);
            if (a0 < 0.02) return;
            ctx.strokeStyle = 'rgba(110,155,220,1)';
            ctx.lineWidth = 1;
            for (var i = 0; i < gg.radials.length; i++) {
                var vs = gg.radials[i];
                ctx.globalAlpha = a0 * 0.55;
                ctx.beginPath();
                var prev = projectVec(vs[0], camNow, W, H, fovNow);
                for (var j = 1; j < vs.length; j++) {
                    var cur = projectVec(vs[j], camNow, W, H, fovNow);
                    if (prev && cur) { ctx.moveTo(prev.x, prev.y); ctx.lineTo(cur.x, cur.y); }
                    prev = cur;
                }
                ctx.stroke();
            }
            for (var r2 = 0; r2 < gg.rings.length; r2++) {
                var vs2 = gg.rings[r2];
                ctx.globalAlpha = a0 * (1.1 - r2 / gg.rings.length * 0.8);
                ctx.beginPath();
                var prev2 = projectVec(vs2[0], camNow, W, H, fovNow);
                for (var j2 = 1; j2 <= vs2.length; j2++) {
                    var cur2 = projectVec(vs2[j2 % vs2.length], camNow, W, H, fovNow);
                    if (prev2 && cur2) { ctx.moveTo(prev2.x, prev2.y); ctx.lineTo(cur2.x, cur2.y); }
                    prev2 = cur2;
                }
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }

        function drawLabels(data) {
            ctx.font = '11px Inter, Roboto, "Segoe UI", "Microsoft YaHei", sans-serif';
            // 行星与月亮（最高优先级）
            for (var n = 0; n < cache.planets.length; n++) {
                var pl = cache.planets[n];
                if (pl.key === 'sun' && cache.sunAlt < -1.5) continue;
                if (pl.key !== 'sun' && pl.alt < -2) continue;
                var pr = projectVec(pl.v, camNow, W, H, fovNow);
                if (!pr) continue;
                var wTxt = ctx.measureText(pl.zh).width;
                if (labelFree(pr.x + 8, pr.y - 8, wTxt + 4, 14)) {
                    ctx.fillStyle = 'rgba(255,225,160,0.9)';
                    ctx.fillText(pl.zh, pr.x + 8, pr.y + 4);
                }
            }
            if (cache.moon.alt > -2) {
                var prM = projectVec(cache.moon.v, camNow, W, H, fovNow);
                if (prM) {
                    var wM = ctx.measureText('月球').width;
                    if (labelFree(prM.x + 12, prM.y - 8, wM + 4, 14)) {
                        ctx.fillStyle = 'rgba(220,228,255,0.9)';
                        ctx.fillText('月球', prM.x + 12, prM.y + 4);
                    }
                }
            }

            // 星座名称
            if (state.conName) {
                ctx.font = '600 12px Inter, Roboto, "Segoe UI", "Microsoft YaHei", sans-serif';
                if ('letterSpacing' in ctx) ctx.letterSpacing = '2px';
                ctx.textAlign = 'center';
                for (var c = 0; c < cache.consts.length; c++) {
                    var con = cache.consts[c];
                    if (con.alt < 3) continue;
                    var pa = projectVec(con.av, camNow, W, H, fovNow);
                    if (!pa) continue;
                    var tw2 = ctx.measureText(con.zh).width + 14;
                    if (!labelFree(pa.x - tw2 / 2, pa.y - 9, tw2, 17)) continue;
                    // 深色胶囊底
                    ctx.fillStyle = 'rgba(6,12,26,0.6)';
                    ctx.beginPath();
                    if (ctx.roundRect) ctx.roundRect(pa.x - tw2 / 2, pa.y - 13, tw2, 17, 8);
                    else ctx.rect(pa.x - tw2 / 2, pa.y - 13, tw2, 17);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(4,8,20,0.85)';
                    ctx.lineWidth = 3;
                    ctx.strokeText(con.zh, pa.x, pa.y);
                    ctx.fillStyle = 'rgba(126,205,255,0.92)';
                    ctx.fillText(con.zh, pa.x, pa.y);
                }
                if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
                ctx.textAlign = 'left';
            }

            // 亮星名称（命名星，亮度 1.6 等以内或放大后）
            if (state.starName) {
                ctx.font = '10px Inter, Roboto, "Segoe UI", "Microsoft YaHei", sans-serif';
                for (var i = 0; i < cache.stars.length; i++) {
                    var s = cache.stars[i];
                    if (s.mag > 1.6 && view.fov >= 55) continue;
                    var nm = data.starNames[s.idx];
                    if (!nm) continue;
                    var pr2 = projectVec(s.v, camNow, W, H, fovNow);
                    if (!pr2) continue;
                    var zh = data.starZh[nm] ? data.starZh[nm] + ' ' : '';
                    var txt = zh + nm;
                    var w2 = ctx.measureText(txt).width;
                    if (!labelFree(pr2.x + 6, pr2.y - 14, w2 + 4, 12)) continue;
                    ctx.fillStyle = 'rgba(205,218,250,0.85)';
                    ctx.fillText(txt, pr2.x + 6, pr2.y - 5);
                }
            }
        }

        // 罗盘：外圈绝对方位 + 视向箭头 + 视场张角 + 太阳/月亮方位点
        function drawCompass() {
            if (W < 560) return;
            var r = 44, cx = W - 84, cy = 96;
            ctx.save();
            ctx.beginPath(); ctx.arc(cx, cy, r + 11, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(10,18,34,0.5)'; ctx.fill();
            ctx.strokeStyle = 'rgba(140,180,240,0.3)'; ctx.lineWidth = 1; ctx.stroke();
            // 精细刻度：5° 细 / 15° 中 / 45° 粗
            for (var a = 0; a < 360; a += 5) {
                var major = a % 45 === 0, mid = a % 15 === 0;
                var rad = a * D2R;
                ctx.beginPath();
                ctx.moveTo(cx + Math.sin(rad) * (r + 2), cy - Math.cos(rad) * (r + 2));
                ctx.lineTo(cx + Math.sin(rad) * (r + (major ? 9 : mid ? 6 : 3.5)), cy - Math.cos(rad) * (r + (major ? 9 : mid ? 6 : 3.5)));
                ctx.strokeStyle = 'rgba(150,185,240,' + (major ? 0.7 : mid ? 0.4 : 0.2) + ')';
                ctx.lineWidth = major ? 1.2 : 1;
                ctx.stroke();
            }
            // 视场张角扇形（半透明青色填充）
            var a1 = (view.yaw - view.fov / 2) * D2R - Math.PI / 2;
            var a2 = (view.yaw + view.fov / 2) * D2R - Math.PI / 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, a1, a2);
            ctx.closePath();
            ctx.fillStyle = 'rgba(56,189,248,0.09)';
            ctx.fill();
            ctx.font = '10px Inter, Roboto, "Segoe UI", "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(110,220,255,0.8)';
            ctx.shadowBlur = 5;
            [['北', 0], ['东', 90], ['南', 180], ['西', 270]].forEach(function (cd) {
                var rad = cd[1] * D2R;
                ctx.fillStyle = cd[1] === 0 ? 'rgba(255,160,140,0.95)' : 'rgba(205,225,255,0.9)';
                ctx.fillText(cd[0], cx + Math.sin(rad) * (r - 9), cy - Math.cos(rad) * (r - 9) + 3);
            });
            ctx.shadowBlur = 0;
            // 太阳/月亮方位点（高度越高越靠圆心）
            for (var i = 0; i < cache.planets.length; i++) {
                var pl = cache.planets[i];
                if (pl.key !== 'sun') continue;
                var rr2 = Math.max(3, Math.min(r - 5, (1 - pl.alt / 100) * (r - 6)));
                var rad2 = pl.az * D2R;
                ctx.beginPath();
                ctx.arc(cx + Math.sin(rad2) * rr2, cy - Math.cos(rad2) * rr2, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd76a'; ctx.fill();
            }
            if (cache.moon) {
                var rr3 = Math.max(3, Math.min(r - 5, (1 - cache.moon.alt / 100) * (r - 6)));
                var rad3 = cache.moon.az * D2R;
                ctx.beginPath();
                ctx.arc(cx + Math.sin(rad3) * rr3, cy - Math.cos(rad3) * rr3, 2.4, 0, Math.PI * 2);
                ctx.fillStyle = '#e8ecff'; ctx.fill();
            }
            // 视场张角 + 视向箭头
            var yw = view.yaw * D2R;
            ctx.strokeStyle = 'rgba(120,170,255,0.4)';
            ctx.lineWidth = 1;
            [-1, 1].forEach(function (sgn) {
                var a2 = (view.yaw + sgn * view.fov / 2) * D2R;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.sin(a2) * r, cy - Math.cos(a2) * r);
                ctx.stroke();
            });
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.sin(yw) * r * 0.78, cy - Math.cos(yw) * r * 0.78);
            ctx.strokeStyle = 'rgba(140,190,255,0.9)';
            ctx.lineWidth = 2;
            ctx.stroke();
            var tipX = cx + Math.sin(yw) * r * 0.78, tipY = cy - Math.cos(yw) * r * 0.78;
            ctx.beginPath();
            ctx.moveTo(tipX, tipY);
            ctx.lineTo(cx + Math.sin(yw + 2.6) * r * 0.6, cy - Math.cos(yw + 2.6) * r * 0.6);
            ctx.lineTo(cx + Math.sin(yw - 2.6) * r * 0.6, cy - Math.cos(yw - 2.6) * r * 0.6);
            ctx.closePath();
            ctx.fillStyle = 'rgba(140,190,255,0.9)';
            ctx.fill();
            ctx.fillStyle = 'rgba(150,170,215,0.6)';
            ctx.fillStyle = 'rgba(150,200,240,0.75)';
            ctx.fillText('仰角 ' + Math.round(view.pitch) + '°', cx, cy + r + 4);
            ctx.restore();
            ctx.textAlign = 'left';
        }

        var lastTipKey = '';

        // 悬停：最近星体 → 信息卡（名称/星等/距离/赤道坐标/地平坐标）；空处 → 光标所指方向读数
        function drawHover() {
            if (!hoverEl) return;
            if (mouse.x < 0 || dragging) {
                hoverEl.classList.remove('show');
                lastTipKey = '';
                hoverConId = '';
                return;
            }
            var best = null, bd = 16;
            for (var i = 0; i < frameCands.length; i++) {
                var cd = frameCands[i];
                var d = Math.hypot(cd.x - mouse.x, cd.y - mouse.y);
                var lim = cd.kind === 'planet' || cd.kind === 'moon' ? 20 : 16;
                if (d < Math.min(bd, lim)) { bd = d; best = cd; }
            }

            var html = '', key = '';
            if (best) {
                hoverConId = '';
                key = best.kind + (best.ref.idx !== undefined ? best.ref.idx : best.ref.key || best.ref.name);
                if (best.kind === 'star') {
                    var s = best.ref;
                    hoverConId = starConOf(s.idx) || '';
                    var data = (typeof STAR_DATA !== 'undefined') ? STAR_DATA : { stars: [], starNames: {}, starZh: {} };
                    var ra = data.stars[s.idx][0], dec = data.stars[s.idx][1];
                    var nm = data.starNames[s.idx];
                    var name = nm ? ((data.starZh[nm] ? data.starZh[nm] + ' ' : '') + nm) : s.mag.toFixed(1) + ' 等星';
                    var dist = nm && STAR_DIST[nm] ? ' · 约 ' + STAR_DIST[nm] + ' 光年' : '';
                    html = '<div class="tt-t">' + name + '</div>' +
                        '<div class="tt-d">' + s.mag.toFixed(2) + ' 等' + dist + '</div>' +
                        '<div class="tt-d">赤经 ' + fmtHMS(ra) + ' · 赤纬 ' + fmtDMS(dec) + '</div>' +
                        '<div class="tt-d">高度 ' + Math.round(s.alt) + '° · ' + azText(altAzOf(s.v).az) + '</div>';
                } else if (best.kind === 'planet') {
                    var pl = best.ref;
                    html = '<div class="tt-t">' + pl.zh + '</div>' +
                        (pl.key === 'sun' ? '' : '<div class="tt-d">典型亮度 ' + pl.mag + ' 等</div>') +
                        '<div class="tt-d">高度 ' + Math.round(pl.alt) + '° · ' + azText(pl.az) + '</div>';
                } else if (best.kind === 'moon') {
                    var m = best.ref;
                    html = '<div class="tt-t">月球 · ' + phaseName(m.age) + '</div>' +
                        '<div class="tt-d">照亮 ' + Math.round(m.illum * 100) + '% · 月龄 ' + m.age.toFixed(1) + '</div>' +
                        '<div class="tt-d">高度 ' + Math.round(m.alt) + '° · ' + azText(m.az) + '</div>';
                } else {
                    var o = best.ref;
                    html = '<div class="tt-t">' + o.name + '</div>' +
                        '<div class="tt-d">高度 ' + Math.round(o.alt) + '° · ' + azText(o.az) + '</div>';
                }
                // 高亮圈
                ctx.beginPath();
                ctx.arc(best.x, best.y, 10, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.85)';
                ctx.lineWidth = 1;
                ctx.stroke();
            } else {
                var dir = screenToAltAz(mouse.x, mouse.y, camNow, W, H, fovNow);
                key = 'dir' + Math.round(dir.alt) + '_' + Math.round(dir.az);
                html = '<div class="tt-d">此方向 · 高度 ' + Math.round(dir.alt) + '° · ' + azText(dir.az) +
                    (dir.alt > 0 ? '（地平线上 ' + Math.round(dir.alt) + '°）' : '（地平线下 ' + Math.round(-dir.alt) + '°）') + '</div>';
            }

            if (key !== lastTipKey) {
                hoverEl.innerHTML = html;
                lastTipKey = key;
            }
            var lx = mouse.x + 20, ly = mouse.y;
            if (lx > W - 240) lx = mouse.x - 250;
            ly = Math.max(10, Math.min(H - 90, ly - 20));
            hoverEl.style.left = lx + 'px';
            hoverEl.style.top = ly + 'px';
            hoverEl.classList.add('show');
        }

        function altAzOf(v) {
            return { alt: Math.asin(Math.max(-1, Math.min(1, v[1]))) * R2D, az: (Math.atan2(v[0], v[2]) * R2D + 360) % 360 };
        }

        function fmtHMS(deg) {
            var h = ((deg / 15) % 24 + 24) % 24, hh = Math.floor(h), mm = Math.floor((h - hh) * 60), ss = Math.round(((h - hh) * 60 - mm) * 60);
            return (hh < 10 ? '0' : '') + hh + 'h' + (mm < 10 ? '0' : '') + mm + 'm' + (ss < 10 ? '0' : '') + ss + 's';
        }

        function fmtDMS(deg) {
            var sign = deg < 0 ? '-' : '+';
            var a = Math.abs(deg), d = Math.floor(a), m = Math.floor((a - d) * 60), ss = Math.round(((a - d) * 60 - m) * 60);
            return sign + (d < 10 ? '0' : '') + d + '°' + (m < 10 ? '0' : '') + m + '′' + (ss < 10 ? '0' : '') + ss + '″';
        }

        function updateHeadAndTonight(t) {
            var d = new Date(t);
            var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
            var dateStr = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
            var lst = lstDeg(t, state.lon);
            document.getElementById('headPlace').textContent = state.place;
            document.getElementById('headMeta').textContent =
                dateStr + ' · 恒星时 ' + fmtHMS(lst) + ' · 太阳高度 ' + Math.round(cache.sunAlt) + '°';

            // 今晚看点（名称 + 高度微进度条 + 方位胶囊）
            var rows = [];
            var m = cache.moon;
            rows.push({
                name: '月球 ' + phaseName(m.age),
                alt: m.alt,
                pill: m.alt > 0 ? (azText(m.az) + ' ' + Math.round(m.alt) + '° · 照亮 ' + Math.round(m.illum * 100) + '%')
                                : '地平线下 · 月龄 ' + m.age.toFixed(1)
            });
            for (var i = 0; i < cache.planets.length; i++) {
                var pl = cache.planets[i];
                if (pl.key === 'sun' || pl.alt < 3) continue;
                rows.push({ name: pl.zh, alt: pl.alt, pill: azText(pl.az) + ' ' + Math.round(pl.alt) + '°' });
            }
            var vis = cache.consts.filter(function (c) { return c.alt > 15; })
                .sort(function (a, b) { return b.alt - a.alt; }).slice(0, 7);
            vis.forEach(function (c) {
                rows.push({ name: c.zh, alt: c.alt, pill: azText(c.az) + ' ' + Math.round(c.alt) + '°' });
            });
            var html = rows.map(function (r) {
                var bw = Math.max(0, Math.min(100, r.alt / 90 * 100)).toFixed(0);
                return '<li><span class="t-name">' + r.name + '</span>' +
                    '<span class="t-viz"><span class="t-bar"><i style="width:' + bw + '%"></i></span>' +
                    '<span class="t-pill">' + r.pill + '</span></span></li>';
            }).join('');
            if (cache.sunAlt > -6) {
                html = '<li class="empty">太阳未落山，先点击"跳到今晚 20:00"看看夜空</li>' + html;
            }
            document.getElementById('tonight').innerHTML = html;
        }

        // ================= 视角运动：开场动画 / 惯性 / 闲置慢转 =================

        function handleMotion(now) {
            if (fly) {
                var fs = stepFly(fly, now);
                view.yaw = ((fs.yaw % 360) + 360) % 360;
                view.pitch = fs.pitch;
                view.fov = fs.fov;
                if (fs.done) fly = null;
                lastInteract = now;
                return;
            }
            if (!userInteracted && introT < 1) {
                introT = Math.min(1, introT + 0.014);
                var e = 1 - Math.pow(1 - introT, 3);
                view.pitch = 85 + (18 - 85) * e;
                view.fov = 105 + (75 - 105) * e;
                return;
            }
            if (dragging) return;
            if (Math.abs(vel.x) > 0.0004 || Math.abs(vel.y) > 0.0004) {
                view.yaw = ((view.yaw + vel.x) % 360 + 360) % 360;
                view.pitch = Math.max(-89, Math.min(89, view.pitch + vel.y));
                vel.x *= 0.93;
                vel.y *= 0.93;
            } else if (now - lastInteract > 4000) {
                // 闲置 4 秒后随恒星时极慢西移
                view.yaw = ((view.yaw - 0.004) % 360 + 360) % 360;
            }
        }

        // ================= 交互 =================

        function pinchDist() {
            if (!pointers || pointers.size < 2) return 0;
            var arr = [];
            pointers.forEach(function (p) { arr.push(p); });
            return Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
        }

        function bindUI() {
            // ---- 面板收起/展开（状态持久化） ----
            var side = document.querySelector('.side');
            var pToggle = document.getElementById('panelToggle');
            var savedPanel = null;
            try { savedPanel = localStorage.getItem('star.panel'); } catch (err) {}
            if (savedPanel === '0') {
                side.classList.add('collapsed');
                pToggle.setAttribute('aria-label', '展开面板');
                pToggle.title = '展开面板';
            }
            pToggle.addEventListener('click', function () {
                var collapsed = side.classList.toggle('collapsed');
                pToggle.setAttribute('aria-label', collapsed ? '展开面板' : '收起面板');
                pToggle.title = collapsed ? '展开面板' : '收起面板';
                try { localStorage.setItem('star.panel', collapsed ? '0' : '1'); } catch (err) {}
                resize();
            });
            side.addEventListener('transitionend', function (e) {
                if (e.propertyName === 'width' || e.propertyName === 'height') resize();
            });

            var sel = document.getElementById('citySel');
            CITIES.forEach(function (c, i) {
                var opt = document.createElement('option');
                opt.value = i;
                opt.textContent = c[0];
                sel.appendChild(opt);
            });
            var customOpt = document.createElement('option');
            customOpt.value = 'custom';
            customOpt.textContent = '自定义坐标…';
            sel.appendChild(customOpt);
            sel.value = '0';
            sel.addEventListener('change', function () {
                if (sel.value === 'custom') {
                    document.getElementById('customBox').classList.add('show');
                    applyCustom();
                } else {
                    document.getElementById('customBox').classList.remove('show');
                    var c = CITIES[+sel.value];
                    state.lat = c[1]; state.lon = c[2]; state.place = c[0];
                    cache.sec = -1;
                }
            });

            function applyCustom() {
                var lat = parseFloat(document.getElementById('latInput').value);
                var lon = parseFloat(document.getElementById('lonInput').value);
                if (isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
                    state.lat = lat; state.lon = lon;
                    state.place = '自定义 (' + lat.toFixed(2) + ', ' + lon.toFixed(2) + ')';
                    cache.sec = -1;
                }
            }
            document.getElementById('latInput').addEventListener('input', applyCustom);
            document.getElementById('lonInput').addEventListener('input', applyCustom);

            var useNow = document.getElementById('useNow');
            var timeInput = document.getElementById('timeInput');
            useNow.addEventListener('change', function () {
                timeInput.disabled = useNow.checked;
                cache.sec = -1;
            });
            timeInput.addEventListener('change', function () {
                var d = new Date(timeInput.value);
                if (!isNaN(d.getTime())) { state.fixedMs = d.getTime(); cache.sec = -1; }
            });
            document.getElementById('tonightBtn').addEventListener('click', function () {
                var d = new Date();
                d.setHours(20, 0, 0, 0);
                useNow.checked = false;
                state.useNow = false;
                timeInput.disabled = false;
                var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
                timeInput.value = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
                    'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
                state.fixedMs = d.getTime();
                cache.sec = -1;
                showToast('已跳到今晚 20:00');
            });

            [['ckLines', 'lines'], ['ckConName', 'conName'], ['ckPlanets', 'planets'],
             ['ckStarName', 'starName'], ['ckGrid', 'grid'], ['ckEcliptic', 'ecliptic'],
             ['ckMw', 'mw'], ['ckDso', 'dso'], ['ckAtmo', 'atmo'],
             ['ckGroundGrid', 'groundGrid'], ['ckMeteor', 'meteor']].forEach(function (pair) {
                document.getElementById(pair[0]).addEventListener('change', function () {
                    state[pair[1]] = this.checked;
                });
            });

            var mag = document.getElementById('magLimit');
            mag.addEventListener('input', function () {
                state.magLimit = +mag.value;
                document.getElementById('magVal').textContent = (+mag.value).toFixed(1);
            });

            document.getElementById('resetBtn').addEventListener('click', function () {
                flyTo(180, 18, 75, 750);
                showToast('视角已复位');
            });

            document.getElementById('fullBtn').addEventListener('click', function () {
                if (document.fullscreenElement) document.exitFullscreen();
                else document.documentElement.requestFullscreen().catch(function () { showToast('浏览器拒绝了全屏请求'); });
            });

            // ---- 指针交互：拖动旋转 / 双指缩放 / 双击对准 / 滚轮缩放 ----
            pointers = new Map();

            canvas.addEventListener('pointerdown', function (e) {
                fly = null;
                userInteracted = true; introT = 1;
                lastInteract = Date.now();
                canvas.classList.add('grabbing');
                if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (pointers.size === 1) {
                    dragging = true;
                    vel.x = 0; vel.y = 0;
                } else if (pointers.size === 2) {
                    dragging = false;
                    pinchPrev = pinchDist();
                }
            });

            canvas.addEventListener('pointermove', function (e) {
                var rect = canvas.getBoundingClientRect();
                mouse.x = e.clientX - rect.left;
                mouse.y = e.clientY - rect.top;
                if (!pointers.has(e.pointerId)) return;
                lastInteract = Date.now();
                var prev = pointers.get(e.pointerId);
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (pointers.size === 1 && dragging) {
                    var bYaw = view.yaw, bPitch = view.pitch;
                    applyDrag(view, e.clientX - prev.x, e.clientY - prev.y, H);
                    vel.x = wrapDeltaDeg(view.yaw - bYaw);
                    vel.y = view.pitch - bPitch;
                } else if (pointers.size === 2) {
                    var d = pinchDist();
                    if (pinchPrev > 0 && d > 0) {
                        view.fov = Math.max(15, Math.min(110, view.fov * pinchPrev / d));
                    }
                    pinchPrev = d;
                    applyDrag(view, (e.clientX - prev.x) / 2, (e.clientY - prev.y) / 2, H);
                }
            });

            function endPointer(e) {
                pointers.delete(e.pointerId);
                if (pointers.size < 2) pinchPrev = 0;
                if (pointers.size === 0) {
                    dragging = false;
                    canvas.classList.remove('grabbing');
                }
                lastInteract = Date.now();
            }
            canvas.addEventListener('pointerup', endPointer);
            canvas.addEventListener('pointercancel', endPointer);
            canvas.addEventListener('pointerleave', function () {
                if (!dragging) { mouse.x = -1; mouse.y = -1; }
            });

            canvas.addEventListener('wheel', function (e) {
                e.preventDefault();
                fly = null;
                userInteracted = true; introT = 1;
                lastInteract = Date.now();
                zoomFov(view, e.deltaY > 0 ? 6 : -6);
            }, { passive: false });

            canvas.addEventListener('dblclick', function (e) {
                var rect = canvas.getBoundingClientRect();
                var dir = screenToAltAz(e.clientX - rect.left, e.clientY - rect.top,
                    camBasis(view.yaw, view.pitch), W, H, view.fov);
                flyTo(dir.az, dir.alt, view.fov, 700);
                lastInteract = Date.now();
                showToast('已对准 ' + azText(dir.az) + ' · 高度 ' + Math.round(dir.alt) + '°');
            });

            window.addEventListener('resize', resize);
        }

        function loop() {
            draw();
            requestAnimationFrame(loop);
        }

        function init() {
            canvas = document.getElementById('skyCanvas');
            ctx = canvas.getContext('2d');
            hoverEl = document.getElementById('hoverInfo');
            resize();
            bindUI();
            // 面板收起动画/窗口变化都会改变画布尺寸，统一由 ResizeObserver 兜底
            if (typeof ResizeObserver !== 'undefined') {
                try { new ResizeObserver(resize).observe(canvas.parentElement); } catch (err) {}
            }
            requestAnimationFrame(loop);
        }

        if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
            window.addEventListener('load', init);
        }
    </script>
</body>
</html>
