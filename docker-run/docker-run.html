<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>docker run ⇄ Compose 互转</title>
    <link rel="stylesheet" href="../assets/common.css">
    <style>
        .container { max-width: 1360px; }
        .io-workspace { display: flex; gap: 16px; align-items: stretch; }
        .io-workspace > .panel { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .io-workspace .panel-header { flex-shrink: 0; }
        .io-workspace .editor-wrap { flex: 1; height: auto; min-height: 380px; height: calc(100vh - 330px); }
        .warn-list { margin-top: 10px; font-size: 12px; color: #b26a00; line-height: 1.8; display: none; }
        .warn-list.show { display: block; }
        .seg { display: inline-flex; border: 1px solid #d0d7de; border-radius: 8px; overflow: hidden; background: #f6f8fa; }
        .seg button { border: none; background: transparent; padding: 7px 14px; font-size: 13px; color: #57606a; cursor: pointer; border-right: 1px solid #d0d7de; }
        .seg button:last-child { border-right: none; }
        .seg button.active { background: #fff; color: #1f6feb; font-weight: 600; box-shadow: inset 0 0 0 1px #1f6feb; }
        @media (max-width: 900px) {
            .io-workspace { flex-direction: column; }
            .io-workspace .editor-wrap { height: 300px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>docker run ⇄ Compose 互转</h1>
        <p class="subtitle">双向互转 · 多服务批量 · 未知参数与字段明确警告</p>

        <div class="btn-row" style="margin-top:14px;">
            <div class="seg" id="dirSeg">
                <button type="button" id="dirAuto" class="active">自动识别</button>
                <button type="button" id="dirR2c">run → Compose</button>
                <button type="button" id="dirC2r">Compose → run</button>
            </div>
            <button class="btn-primary" onclick="convert()">转换</button>
            <button class="btn-success" onclick="copyOutput()">复制结果</button>
            <button class="btn-danger btn-sm" onclick="clearAll()">清空</button>
        </div>

        <div class="io-workspace">
            <div class="panel">
                <div class="panel-header">
                    <h3 id="inputTitle">docker run 命令</h3>
                    <span class="badge badge-info" id="sizeBadge"></span>
                </div>
                <div class="editor-wrap">
                    <div class="line-numbers" id="inputLines"><div>1</div></div>
                    <textarea id="input" wrap="off" placeholder="docker run -d --name web -p 8080:80 -e KEY=val nginx:latest"></textarea>
                </div>
                <div class="error-detail" id="errorDetail"></div>
                <div class="warn-list" id="warnList"></div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h3 id="outputTitle">docker-compose.yml</h3>
                    <span class="badge" id="statusBadge"></span>
                </div>
                <div class="editor-wrap">
                    <div class="line-numbers" id="outputLines"><div>1</div></div>
                    <textarea id="output" wrap="off" readonly placeholder="转换结果将显示在这里..."></textarea>
                </div>
            </div>
        </div>
    </div>
    <div id="toast"></div>
    <script src="../assets/common.js"></script>
    <script>
        // ================= 命令行切词（纯函数，可测） =================
        function tokenize(cmd) {
            var tokens = [], cur = '', quote = null;
            for (var i = 0; i < cmd.length; i++) {
                var ch = cmd[i];
                if (quote === "'") {
                    if (ch === "'") quote = null; else cur += ch;
                } else if (quote === '"') {
                    if (ch === '"') quote = null;
                    else if (ch === '\\' && i + 1 < cmd.length && (cmd[i + 1] === '"' || cmd[i + 1] === '\\')) cur += cmd[++i];
                    else cur += ch;
                } else if (ch === "'" || ch === '"') {
                    quote = ch;
                } else if (ch === '\\' && i + 1 < cmd.length) {
                    cur += cmd[++i];
                } else if (/\s/.test(ch)) {
                    if (cur) { tokens.push(cur); cur = ''; }
                } else {
                    cur += ch;
                }
            }
            if (quote) throw new Error('引号未闭合');
            if (cur) tokens.push(cur);
            return tokens;
        }

        // ================= 解析（纯函数，可测） =================

        // 单值/多值长参数与短参数映射
        var VALUE_FLAGS = {
            '--name': 'name', '--hostname': 'hostname', '-h': 'hostname',
            '--network': 'network', '--net': 'network', '--restart': 'restart',
            '--user': 'user', '-u': 'user', '--workdir': 'workdir', '-w': 'workdir',
            '--entrypoint': 'entrypoint', '--memory': 'memory', '-m': 'memory',
            '--cpus': 'cpus', '--shm-size': 'shmSize', '--pull': 'pull', '--platform': 'platform',
            '--gpus': 'gpus'
        };
        var MULTI_FLAGS = {
            '-p': 'ports', '--publish': 'ports',
            '-v': 'volumes', '--volume': 'volumes',
            '-e': 'env', '--env': 'env',
            '-l': 'labels', '--label': 'labels',
            '--add-host': 'extraHosts', '--dns': 'dns', '--device': 'devices',
            '--cap-add': 'capAdd', '--cap-drop': 'capDrop',
            '--expose': 'exposes', '--link': 'links', '--env-file': 'envFiles'
        };
        // 短参数值可连写：-p8080:80 / -eK=V / -v/a:/b
        var ATTACHABLE = { p: 'ports', e: 'env', v: 'volumes', m: 'memory' };
        var BOOL_FLAGS = {
            '-d': 'detach', '--detach': 'detach',
            '-i': 'stdinOpen', '--interactive': 'stdinOpen',
            '-t': 'tty', '--tty': 'tty',
            '--rm': 'rm', '--privileged': 'privileged', '--init': 'init',
            '--read-only': 'readOnly', '--oom-kill-disable': 'oomKillDisable'
        };

        function emptyService() {
            return {
                image: '', name: '', command: [], ignored: [],
                ports: [], volumes: [], env: [], labels: [], extraHosts: [],
                dns: [], devices: [], capAdd: [], capDrop: [], exposes: [], links: [], envFiles: []
            };
        }

        function takeValue(tokens, i, inline) {
            if (inline !== undefined) return [inline, i];
            if (i + 1 >= tokens.length) throw new Error('参数缺少值：' + tokens[i]);
            return [tokens[i + 1], i + 1];
        }

        // 解析单条 docker run 命令（tokens 不含开头的 docker / run）
        function parseRunTokens(tokens) {
            var s = emptyService();
            var bools = {};
            var positional = [];
            var i = 0, afterDash = false;
            while (i < tokens.length) {
                var tk = tokens[i];
                // docker 语义：镜像名之后的所有内容都是 command，不再当参数解析
                if (positional.length >= 1) { positional.push(tk); i++; continue; }
                if (afterDash) { positional.push(tk); i++; continue; }
                if (tk === '--') { afterDash = true; i++; continue; }

                if (BOOL_FLAGS[tk]) { bools[BOOL_FLAGS[tk]] = true; i++; continue; }
                // 组合短布尔：-it / -dit
                if (/^-[dit]+$/.test(tk)) {
                    for (var j = 1; j < tk.length; j++) bools[{ d: 'detach', i: 'stdinOpen', t: 'tty' }[tk[j]]] = true;
                    i++; continue;
                }
                // 长参数 --flag=value
                var eq = tk.indexOf('=');
                if (tk.slice(0, 2) === '--' && eq > 0) {
                    var flag = tk.slice(0, eq), val = tk.slice(eq + 1);
                    if (VALUE_FLAGS[flag]) s[VALUE_FLAGS[flag]] = val;
                    else if (MULTI_FLAGS[flag]) s[MULTI_FLAGS[flag]].push(val);
                    else if (BOOL_FLAGS[flag]) bools[BOOL_FLAGS[flag]] = val !== 'false';
                    else s.ignored.push(flag);
                    i++; continue;
                }
                if (VALUE_FLAGS[tk]) {
                    var got = takeValue(tokens, i);
                    s[VALUE_FLAGS[tk]] = got[0]; i = got[1] + 1; continue;
                }
                if (MULTI_FLAGS[tk]) {
                    var got2 = takeValue(tokens, i);
                    s[MULTI_FLAGS[tk]].push(got2[0]); i = got2[1] + 1; continue;
                }
                // 短参数连写：-p8080:80
                if (tk.length > 2 && tk[0] === '-' && tk[1] !== '-' && ATTACHABLE[tk[1]]) {
                    s[ATTACHABLE[tk[1]]].push(tk.slice(2)); i++; continue;
                }
                if (tk.slice(0, 2) === '--') {
                    // 未知长参数：按惯例吃掉紧随其后的值（不以 - 开头），避免把值误当镜像名
                    if (i + 1 < tokens.length && tokens[i + 1][0] !== '-') {
                        s.ignored.push(tk + ' ' + tokens[i + 1]);
                        i += 2;
                    } else {
                        s.ignored.push(tk);
                        i++;
                    }
                    continue;
                }
                if (tk[0] === '-') { s.ignored.push(tk); i++; continue; }
                positional.push(tk); i++;
            }
            if (!positional.length) throw new Error('缺少镜像名');
            s.image = positional[0];
            s.command = positional.slice(1);
            s.bools = bools;
            return s;
        }

        function parseDockerRun(lineRaw) {
            var tokens = tokenize(lineRaw);
            var k = 0;
            if (tokens[k] === 'docker') k++;
            if (tokens[k] === 'container') k++;
            if (tokens[k] !== 'run' && tokens[k] !== 'create') throw new Error('不是 docker run 命令');
            return parseRunTokens(tokens.slice(k + 1));
        }

        // ================= 生成 compose（纯函数，可测） =================

        function yamlScalar(s) {
            s = String(s);
            if (/^(true|false|null|~|[-+]?\d+(\.\d+)?)$/i.test(s)) return JSON.stringify(s);
            if (/[#\[\]{}&*!|>'"%@`,?]/.test(s) || /:\s/.test(s) || /:\s*$/.test(s) || /^\s|\s$/.test(s) || s === '') return JSON.stringify(s);
            return s;
        }

        function serviceName(s, idx, used) {
            var base = (s.name || s.image).toLowerCase()
                .replace(/^[a-z0-9.-]+\//, '').replace(/[@:].*$/, '')
                .replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '');
            if (!base) base = 'service';
            var name = base, n = 2;
            while (used[name]) name = base + '-' + (n++);
            used[name] = true;
            return name;
        }

        function boolLine(lines, indent, key, val) {
            if (val) lines.push(indent + key + ': true');
        }

        function listBlock(lines, indent, key, items, forceQuote) {
            if (!items.length) return;
            lines.push(indent + key + ':');
            items.forEach(function (it) {
                lines.push(indent + '  - ' + (forceQuote ? JSON.stringify(String(it)) : yamlScalar(it)));
            });
        }

        function toCompose(services) {
            var used = {};
            var lines = ['services:'];
            services.forEach(function (s, idx) {
                var name = serviceName(s, idx, used);
                var ind = '  ';
                lines.push(ind + name + ':');
                ind += '  ';
                lines.push(ind + 'image: ' + yamlScalar(s.image));
                if (s.name) lines.push(ind + 'container_name: ' + yamlScalar(s.name));
                if (s.bools.detach) { /* detach 是 compose 的默认行为，无需输出 */ }
                boolLine(lines, ind, 'stdin_open', s.bools.stdinOpen);
                boolLine(lines, ind, 'tty', s.bools.tty);
                boolLine(lines, ind, 'privileged', s.bools.privileged);
                boolLine(lines, ind, 'init', s.bools.init);
                boolLine(lines, ind, 'read_only', s.bools.readOnly);
                boolLine(lines, ind, 'oom_kill_disable', s.bools.oomKillDisable);
                if (s.gpus) lines.push(ind + 'gpus: ' + yamlScalar(s.gpus));
                if (s.bools.rm) lines.push(ind + '# --rm：compose 中容器默认随 down 清理，可用 docker compose run --rm 代替');
                if (s.restart) lines.push(ind + 'restart: ' + yamlScalar(s.restart));
                if (s.network) lines.push(ind + 'network_mode: ' + yamlScalar(s.network));
                if (s.hostname) lines.push(ind + 'hostname: ' + yamlScalar(s.hostname));
                if (s.user) lines.push(ind + 'user: ' + yamlScalar(s.user));
                if (s.workdir) lines.push(ind + 'working_dir: ' + yamlScalar(s.workdir));
                if (s.entrypoint) lines.push(ind + 'entrypoint: ' + JSON.stringify(s.entrypoint));
                if (s.command.length) {
                    lines.push(ind + 'command:');
                    s.command.forEach(function (c) { lines.push(ind + '  - ' + JSON.stringify(c)); });
                }
                listBlock(lines, ind, 'ports', s.ports, true);
                listBlock(lines, ind, 'volumes', s.volumes, true);
                listBlock(lines, ind, 'environment', s.env, true);
                listBlock(lines, ind, 'labels', s.labels, true);
                listBlock(lines, ind, 'extra_hosts', s.extraHosts, true);
                listBlock(lines, ind, 'dns', s.dns, false);
                listBlock(lines, ind, 'devices', s.devices, true);
                listBlock(lines, ind, 'cap_add', s.capAdd, false);
                listBlock(lines, ind, 'cap_drop', s.capDrop, false);
                listBlock(lines, ind, 'expose', s.exposes, false);
                if (s.memory) lines.push(ind + 'mem_limit: ' + yamlScalar(s.memory));
                if (s.cpus) lines.push(ind + 'cpus: ' + yamlScalar(s.cpus));
                if (s.shmSize) lines.push(ind + 'shm_size: ' + yamlScalar(s.shmSize));
                if (s.links.length) {
                    lines.push(ind + '# --link 已废弃，建议改用 networks 让服务互访：');
                    lines.push(ind + '# links: ' + JSON.stringify(s.links));
                }
                if (s.envFiles.length) {
                    lines.push(ind + 'env_file:');
                    s.envFiles.forEach(function (f) { lines.push(ind + '  - ' + yamlScalar(f)); });
                }
            s.ignored.forEach(function (ig) {
                lines.push(ind + '# 未转换的参数：' + ig + '（compose 无直接对应，请手动确认）');
            });
        });
        return lines.join('\n') + '\n';
    }

        // ================= 解析 compose YAML 子集（纯函数，可测） =================
        // 仅覆盖 compose 常用写法：块映射 / 块列表 / 行内 [] {} / 引号 / 注释

        function stripYamlComment(line) {
            var sq = false, dq = false;
            for (var i = 0; i < line.length; i++) {
                var ch = line[i];
                if (sq) { if (ch === "'") sq = false; }
                else if (dq) { if (ch === '\\') i++; else if (ch === '"') dq = false; }
                else if (ch === "'") sq = true;
                else if (ch === '"') dq = true;
                else if (ch === '#' && (i === 0 || /\s/.test(line[i - 1]))) return line.slice(0, i);
            }
            return line;
        }

        function unquoteYaml(s) {
            if (s.length > 1 && s[0] === '"' && s[s.length - 1] === '"') {
                try { return JSON.parse(s); } catch (e) { return s.slice(1, -1); }
            }
            if (s.length > 1 && s[0] === "'" && s[s.length - 1] === "'") return s.slice(1, -1).replace(/''/g, "'");
            return s;
        }

        // 找 key: value 的分隔冒号：深度 0、引号外、冒号后为空格或行尾
        function findYamlColon(text) {
            var sq = false, dq = false, depth = 0;
            for (var i = 0; i < text.length; i++) {
                var ch = text[i];
                if (sq) { if (ch === "'") sq = false; continue; }
                if (dq) { if (ch === '\\') i++; else if (ch === '"') dq = false; continue; }
                if (ch === "'") sq = true;
                else if (ch === '"') dq = true;
                else if (ch === '[' || ch === '{') depth++;
                else if (ch === ']' || ch === '}') depth--;
                else if (ch === ':' && depth === 0 && (i + 1 >= text.length || text[i + 1] === ' ' || text[i + 1] === '\t')) return i;
            }
            return -1;
        }

        function splitFlowItems(s) {
            var parts = [], cur = '', depth = 0, sq = false, dq = false;
            for (var i = 0; i < s.length; i++) {
                var ch = s[i];
                if (sq) { cur += ch; if (ch === "'") sq = false; continue; }
                if (dq) {
                    cur += ch;
                    if (ch === '\\') { if (i + 1 < s.length) cur += s[++i]; }
                    else if (ch === '"') dq = false;
                    continue;
                }
                if (ch === "'") sq = true;
                else if (ch === '"') dq = true;
                else if (ch === '[' || ch === '{') depth++;
                else if (ch === ']' || ch === '}') depth--;
                if (ch === ',' && depth === 0) { parts.push(cur); cur = ''; continue; }
                cur += ch;
            }
            if (cur.trim() !== '') parts.push(cur);
            return parts;
        }

        function parseYamlScalar(s) {
            s = s.trim();
            if (s.length > 1 && s[0] === '"' && s[s.length - 1] === '"') {
                try { return JSON.parse(s); } catch (e) { return s.slice(1, -1); }
            }
            if (s.length > 1 && s[0] === "'" && s[s.length - 1] === "'") return s.slice(1, -1).replace(/''/g, "'");
            if (s === 'true') return true;
            if (s === 'false') return false;
            if (s === 'null' || s === '~') return null;
            if (s[0] === '[' && s[s.length - 1] === ']') {
                var inner = s.slice(1, -1).trim();
                return inner ? splitFlowItems(inner).map(parseYamlScalar) : [];
            }
            if (s[0] === '{' && s[s.length - 1] === '}') {
                var obj = {}, inner2 = s.slice(1, -1).trim();
                if (inner2) splitFlowItems(inner2).forEach(function (kv) {
                    var ci = findYamlColon(kv);
                    if (ci > 0) obj[unquoteYaml(kv.slice(0, ci).trim())] = parseYamlScalar(kv.slice(ci + 1));
                });
                return obj;
            }
            return s;
        }

        function yamlItems(text) {
            var out = [];
            text.split('\n').forEach(function (raw, idx) {
                var line = stripYamlComment(raw).replace(/\s+$/, '');
                if (!line.trim()) return;
                out.push({ indent: line.match(/^ */)[0].length, text: line.trim(), no: idx + 1 });
            });
            return out;
        }

        function parseYamlNode(items, i, indent) {
            if (i >= items.length || items[i].indent < indent) return [null, i];
            var isDash = function (t) { return t === '-' || t.slice(0, 2) === '- '; };
            if (isDash(items[i].text)) {
                var arr = [];
                while (i < items.length && items[i].indent === indent && isDash(items[i].text)) {
                    var content = items[i].text === '-' ? '' : items[i].text.slice(2).trim();
                    i++;
                    if (content === '') {
                        if (i < items.length && items[i].indent > indent) {
                            var sub = parseYamlNode(items, i, items[i].indent);
                            arr.push(sub[0]); i = sub[1];
                        } else arr.push(null);
                    } else if (findYamlColon(content) > 0) {
                        // "- key: value" 起始的内联映射（如 ports/volumes 长语法）
                        var m = {}, ci = findYamlColon(content);
                        var k = unquoteYaml(content.slice(0, ci).trim());
                        var rest = content.slice(ci + 1).trim();
                        if (rest) m[k] = parseYamlScalar(rest);
                        else if (i < items.length && items[i].indent > indent) {
                            var sub2 = parseYamlNode(items, i, items[i].indent);
                            m[k] = sub2[0]; i = sub2[1];
                        } else m[k] = null;
                        var mapIndent = (i < items.length && items[i].indent > indent) ? items[i].indent : -1;
                        while (i < items.length && items[i].indent === mapIndent) {
                            var ci2 = findYamlColon(items[i].text);
                            if (ci2 < 0) throw new Error('第 ' + items[i].no + ' 行无法解析：' + items[i].text);
                            var k2 = unquoteYaml(items[i].text.slice(0, ci2).trim());
                            var rest2 = items[i].text.slice(ci2 + 1).trim();
                            i++;
                            if (rest2) m[k2] = parseYamlScalar(rest2);
                            else if (i < items.length && items[i].indent > mapIndent) {
                                var sub3 = parseYamlNode(items, i, items[i].indent);
                                m[k2] = sub3[0]; i = sub3[1];
                            } else m[k2] = null;
                        }
                        arr.push(m);
                    } else {
                        arr.push(parseYamlScalar(content));
                    }
                }
                return [arr, i];
            }
            var obj = {};
            while (i < items.length && items[i].indent === indent && !isDash(items[i].text)) {
                var text = items[i].text;
                var ci = findYamlColon(text);
                if (ci <= 0) throw new Error('第 ' + items[i].no + ' 行无法解析：' + text);
                var key = unquoteYaml(text.slice(0, ci).trim());
                var rest = text.slice(ci + 1).trim();
                i++;
                if (rest !== '') obj[key] = parseYamlScalar(rest);
                else if (i < items.length && items[i].indent > indent) {
                    var sub4 = parseYamlNode(items, i, items[i].indent);
                    obj[key] = sub4[0]; i = sub4[1];
                } else obj[key] = null;
            }
            return [obj, i];
        }

        function parseComposeYaml(text) {
            var items = yamlItems(text);
            if (!items.length) throw new Error('内容为空');
            if (items[0].indent !== 0) throw new Error('第 ' + items[0].no + ' 行缩进异常，顶层字段应从行首开始');
            var doc = parseYamlNode(items, 0, 0)[0];
            if (!doc || typeof doc !== 'object' || doc instanceof Array) throw new Error('不是有效的 YAML 映射');
            if (!doc.services || typeof doc.services !== 'object' || doc.services instanceof Array)
                throw new Error('缺少 services 服务定义');
            return doc;
        }

        // ================= 生成 docker run（纯函数，可测） =================

        // compose 直接认识的字段（静默处理或专项警告）
        var COMPOSE_KNOWN = {
            image: 1, container_name: 1, hostname: 1, restart: 1, network_mode: 1, user: 1,
            working_dir: 1, entrypoint: 1, command: 1, stdin_open: 1, tty: 1, privileged: 1,
            init: 1, read_only: 1, oom_kill_disable: 1, deploy: 1, mem_limit: 1, cpus: 1,
            shm_size: 1, gpus: 1, ports: 1, volumes: 1, environment: 1, labels: 1,
            extra_hosts: 1, dns: 1, devices: 1, cap_add: 1, cap_drop: 1, expose: 1, env_file: 1
        };
        // compose 特有、run 无对应物的字段（专项警告）
        var COMPOSE_ONLY = {
            build: 'build 定义需在 compose 中构建镜像，docker run 请改用已构建的 image',
            depends_on: 'depends_on 无法转换，请在启动脚本中控制启动顺序',
            networks: 'networks 属于 compose 网络定义，docker run 请改用 --network 指定已存在的网络',
            healthcheck: 'healthcheck 无 docker run 对应参数，已忽略',
            logging: 'logging 无 docker run 对应参数，已忽略',
            profiles: 'profiles 无 docker run 对应参数，已忽略',
            stop_grace_period: 'stop_grace_period 无 docker run 对应参数，已忽略',
            pull_policy: 'pull_policy 无 docker run 对应参数，已忽略'
        };

        function shStr(s) {
            s = String(s);
            if (s !== '' && /^[A-Za-z0-9_@%+=:,./\-]+$/.test(s)) return s;
            return "'" + s.replace(/'/g, "'\\''") + "'";
        }

        function asList(v) {
            if (v === null || v === undefined) return [];
            return v instanceof Array ? v : [v];
        }

        function portLongToShort(p, w) {
            var out = '';
            if (p.host_ip) out += String(p.host_ip) + ':';
            if (p.published != null) out += String(p.published);
            if (p.target != null) out += ':' + String(p.target);
            if (p.protocol && p.protocol !== 'tcp') {
                if (p.protocol === 'udp') out += '/udp';
                else w('端口协议 ' + p.protocol + ' 无法转换，仅保留 tcp/udp');
            }
            if (p.mode && p.mode !== 'ingress') w('端口 mode: ' + p.mode + ' 已忽略');
            return out || String(p.target || '');
        }

        function volLongToShort(v, w) {
            if (v.type === 'bind') return String(v.source) + ':' + String(v.target) + (v.read_only ? ':ro' : '');
            if (v.type === 'volume' || !v.type) return String(v.source) + ':' + String(v.target) + (v.read_only ? ':ro' : '');
            w('卷类型 ' + v.type + ' 无法转换');
            return String(v.target || '');
        }

        function envArgs(parts, env, w) {
            if (env instanceof Array) {
                env.forEach(function (e) { parts.push('--env', shStr(e)); });
            } else if (env && typeof env === 'object') {
                Object.keys(env).forEach(function (k) {
                    var v = env[k];
                    parts.push('--env', shStr(v === null || v === undefined ? k : k + '=' + v));
                });
            } else if (env != null) w('environment 格式无法识别，已忽略');
        }

        function toRunCommand(name, svc, warnings) {
            var w = function (msg) { warnings.push('服务 ' + name + '：' + msg); };
            if (!svc || typeof svc !== 'object' || svc instanceof Array) {
                warnings.push('服务 ' + name + '：定义无法识别，已跳过');
                return null;
            }
            if (!svc.image) {
                warnings.push('服务 ' + name + '：缺少 image，已跳过');
                return null;
            }
            var parts = ['docker', 'run', '--detach'];
            if (svc.container_name != null) parts.push('--name', shStr(svc.container_name));
            if (svc.hostname != null) parts.push('--hostname', shStr(svc.hostname));
            if (svc.restart != null) parts.push('--restart', shStr(svc.restart));
            if (svc.network_mode != null) parts.push('--network', shStr(svc.network_mode));
            if (svc.user != null) parts.push('--user', shStr(svc.user));
            if (svc.working_dir != null) parts.push('--workdir', shStr(svc.working_dir));
            if (svc.entrypoint != null) {
                var ep = svc.entrypoint instanceof Array ? svc.entrypoint.join(' ') : String(svc.entrypoint);
                parts.push('--entrypoint', shStr(ep));
            }
            if (svc.stdin_open === true) parts.push('--interactive');
            if (svc.tty === true) parts.push('--tty');
            if (svc.privileged === true) parts.push('--privileged');
            if (svc.init === true) parts.push('--init');
            if (svc.read_only === true) parts.push('--read-only');
            if (svc.oom_kill_disable === true) parts.push('--oom-kill-disable');
            var limits = svc.deploy && typeof svc.deploy === 'object' &&
                svc.deploy.resources && svc.deploy.resources.limits;
            if (limits && limits.memory != null) parts.push('--memory', shStr(limits.memory));
            else if (svc.mem_limit != null) parts.push('--memory', shStr(svc.mem_limit));
            if (limits && limits.cpus != null) parts.push('--cpus', shStr(limits.cpus));
            else if (svc.cpus != null) parts.push('--cpus', shStr(svc.cpus));
            if (svc.shm_size != null) parts.push('--shm-size', shStr(svc.shm_size));
            if (svc.gpus != null) parts.push('--gpus', shStr(svc.gpus));
            asList(svc.ports).forEach(function (p) {
                parts.push('--publish', shStr(typeof p === 'object' ? portLongToShort(p, w) : p));
            });
            asList(svc.volumes).forEach(function (v) {
                parts.push('--volume', shStr(typeof v === 'object' ? volLongToShort(v, w) : v));
            });
            envArgs(parts, svc.environment, w);
            if (svc.labels instanceof Array) svc.labels.forEach(function (l) { parts.push('--label', shStr(l)); });
            else if (svc.labels && typeof svc.labels === 'object') {
                Object.keys(svc.labels).forEach(function (k) { parts.push('--label', shStr(k + '=' + svc.labels[k])); });
            }
            asList(svc.extra_hosts).forEach(function (h) { parts.push('--add-host', shStr(h)); });
            asList(svc.dns).forEach(function (d) { parts.push('--dns', shStr(d)); });
            asList(svc.devices).forEach(function (d) { parts.push('--device', shStr(d)); });
            asList(svc.cap_add).forEach(function (c) { parts.push('--cap-add', shStr(c)); });
            asList(svc.cap_drop).forEach(function (c) { parts.push('--cap-drop', shStr(c)); });
            asList(svc.expose).forEach(function (e) { parts.push('--expose', shStr(e)); });
            asList(svc.env_file).forEach(function (f) { parts.push('--env-file', shStr(f)); });
            Object.keys(svc).forEach(function (k) {
                if (COMPOSE_KNOWN[k] || k in COMPOSE_ONLY) return;
                w('字段 ' + k + ' 未识别，已忽略');
            });
            Object.keys(COMPOSE_ONLY).forEach(function (k) {
                if (k in svc) w(COMPOSE_ONLY[k]);
            });
            parts.push(shStr(svc.image));
            if (svc.command instanceof Array) svc.command.forEach(function (c) { parts.push(shStr(c)); });
            else if (typeof svc.command === 'string' && svc.command.trim()) parts.push(svc.command);
            return parts.join(' ');
        }

        function composeToRun(text) {
            var doc = parseComposeYaml(text);
            var warnings = [], commands = [];
            Object.keys(doc.services).forEach(function (name) {
                var cmd = toRunCommand(name, doc.services[name], warnings);
                if (cmd) commands.push(cmd);
            });
            Object.keys(doc).forEach(function (k) {
                if (k !== 'services' && k !== 'version' && k !== 'name')
                    warnings.push('顶层字段「' + k + '」未转换（networks / volumes 等请在 compose 中维护）');
            });
            return { commands: commands, warnings: warnings };
        }

        // ================= UI =================

        var DIR_LABELS = {
            r2c: {
                inTitle: 'docker run 命令', outTitle: 'docker-compose.yml',
                inPh: 'docker run -d --name web -p 8080:80 -e KEY=val nginx:latest\n支持一次粘贴多条命令，每条一行'
            },
            c2r: {
                inTitle: 'docker-compose.yml', outTitle: 'docker run 命令',
                inPh: 'services:\n  web:\n    image: nginx:latest\n    ports:\n      - "8080:80"\n    environment:\n      - KEY=val'
            }
        };
        var curDir = 'auto';

        function applyDir(dir) {
            var L = DIR_LABELS[dir];
            $('inputTitle').textContent = L.inTitle;
            $('outputTitle').textContent = L.outTitle;
            $('input').placeholder = L.inPh;
            $('output').placeholder = '转换结果将显示在这里...';
            $('output').value = '';
            $('errorDetail').textContent = '';
            $('errorDetail').style.display = 'none';
            $('warnList').classList.remove('show');
            $('statusBadge').textContent = '';
            $('statusBadge').className = 'badge';
            updateLineNumbers($('output'), $('outputLines'));
        }

        function setDir(d) {
            curDir = d;
            var map = { auto: 'dirAuto', r2c: 'dirR2c', c2r: 'dirC2r' };
            Object.keys(map).forEach(function (k) { $(map[k]).classList.toggle('active', k === d); });
            applyDir(d === 'auto' ? 'r2c' : d);
        }

        // 自动识别输入方向：任一非注释行以 docker 开头 → run→compose；整体呈 YAML 形态 → compose→run
        function detectDir(text) {
            var lines = text.split('\n');
            var meaningful = lines.map(function (l) { return l.trim(); })
                .filter(function (l) { return l && l[0] !== '#'; });
            if (!meaningful.length) return 'r2c';
            if (meaningful.some(function (l) { return /^docker\s+/.test(l); })) return 'r2c';
            if (/^(services|version|name)\s*:/.test(meaningful[0]) ||
                (meaningful[0].slice(-1) === ':' && /^[A-Za-z0-9_.-]+$/.test(meaningful[0].slice(0, -1)))) return 'c2r';
            return 'r2c';
        }

        function convert() {
            var text = $('input').value;
            if (!text.trim()) { showToast('请先粘贴内容再转换'); return; }
            var dir = curDir === 'auto' ? detectDir(text) : curDir;
            if (dir === 'c2r') convertC2R(text);
            else convertR2C(text);
        }

        function convertR2C() {
            var lines = $('input').value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
            if (!lines.length) { showToast('请粘贴 docker run 命令'); return; }
            var services = [], errors = [];
            lines.forEach(function (l, i) {
                try {
                    services.push(parseDockerRun(l));
                } catch (e) {
                    errors.push('第 ' + (i + 1) + ' 行：' + e.message);
                }
            });
            $('errorDetail').textContent = errors.join('；');
            $('errorDetail').style.display = errors.length ? 'block' : 'none';
            if (!services.length) return;

            var yml = toCompose(services);
            $('output').value = yml;
            updateLineNumbers($('output'), $('outputLines'));

            var warns = [];
            services.forEach(function (s) {
                if (s.ignored.length) warns.push((s.name || s.image) + '：' + s.ignored.join('、'));
            });
            $('warnList').textContent = warns.length ? '已忽略的参数：' + warns.join('；') : '';
            $('warnList').classList.toggle('show', warns.length > 0);

            $('statusBadge').className = 'badge badge-ok';
            $('statusBadge').textContent = '已转换 ' + services.length + ' 个服务';
            showToast('已转换 ' + services.length + ' 个服务');
        }

        function convertC2R(text) {
            var res, err = null;
            try {
                res = composeToRun(text);
            } catch (e) {
                err = e.message;
            }
            $('errorDetail').textContent = err || '';
            $('errorDetail').style.display = err ? 'block' : 'none';
            if (err) return;

            $('output').value = res.commands.length ? res.commands.join('\n') + '\n' : '';
            updateLineNumbers($('output'), $('outputLines'));

            $('warnList').textContent = res.warnings.length ? '转换警告：' + res.warnings.join('；') : '';
            $('warnList').classList.toggle('show', res.warnings.length > 0);

            $('statusBadge').className = 'badge badge-ok';
            $('statusBadge').textContent = res.commands.length ? '已生成 ' + res.commands.length + ' 条命令' : '没有可转换的服务';
            showToast(res.commands.length ? '已生成 ' + res.commands.length + ' 条命令' : '没有可转换的服务');
        }

        function copyOutput() {
            var t = $('output').value;
            if (!t) { showToast('没有可复制的内容'); return; }
            navigator.clipboard.writeText(t).then(function () { showToast('已复制到剪贴板'); });
        }

        function clearAll() {
            $('input').value = '';
            $('output').value = '';
            $('errorDetail').textContent = '';
            $('errorDetail').style.display = 'none';
            $('warnList').classList.remove('show');
            $('statusBadge').textContent = '';
            updateLineNumbers($('input'), $('inputLines'));
            updateLineNumbers($('output'), $('outputLines'));
            updateSize('input', 'sizeBadge');
        }

        bindEditor('input', 'inputLines', 'sizeBadge');
        bindEditor('output', 'outputLines');
        $('dirAuto').addEventListener('click', function () { setDir('auto'); });
        $('dirR2c').addEventListener('click', function () { setDir('r2c'); });
        $('dirC2r').addEventListener('click', function () { setDir('c2r'); });
    </script>
</body>
</html>
